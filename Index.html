<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-foundation: #F7F1EB;
      --surface-card:  #FBF7F1;
      --surface-inset: #EFE8DD;
      --ink-primary:   #2A2725;
      --ink-body:      #4A4540;
      --ink-muted:     #8A8178;
      --rule:          #D4CFC4;
      --accent:        #E91D79;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-foundation);
      color: var(--ink-body);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
    }

    .auth-screen {
      align-items: center;
      display: flex;
      min-height: 100vh;
      padding: 32px;
    }

    .auth-panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      margin: 0 auto;
      max-width: 440px;
      padding: 32px;
      width: 100%;
    }

    .masthead {
      align-items: flex-end;
      display: flex;
      gap: 24px;
      justify-content: space-between;
      padding: 8px 0 28px;
    }

    .masthead h1 {
      font-size: 44px;
    }

    .eyebrow {
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1, h2, h3 {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      margin: 0;
    }

    h1 {
      font-size: 38px;
      line-height: 1;
    }

    h2 {
      font-size: 26px;
    }

    h3 {
      font-size: 20px;
    }

    .userline {
      color: var(--ink-muted);
      text-align: left;
      line-height: 1.45;
    }

    .masthead-actions {
      align-items: center;
      display: flex;
      gap: 16px;
    }

    .user-chip {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: flex-start;
    }

    .user-avatar {
      align-items: center;
      background: var(--ink-primary);
      border-radius: 50%;
      color: var(--bg-foundation);
      display: inline-flex;
      flex: 0 0 auto;
      font-size: 13px;
      height: 36px;
      justify-content: center;
      width: 36px;
    }

    .user-name-line {
      color: var(--ink-primary);
      display: block;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
    }

    .user-role-line {
      color: var(--ink-muted);
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .toolbar {
      align-items: center;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 34px;
      min-width: 0;
      position: relative;
    }

    .nav-group {
      position: relative;
    }

    .toolbar-actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      padding: 10px 0 8px;
    }

    button,
    .button-like {
      border-radius: 2px;
      border: 1px solid var(--ink-primary);
      background: transparent;
      color: var(--ink-primary);
      cursor: pointer;
      display: inline-block;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      padding: 10px 14px;
      text-transform: uppercase;
      transition: background-color 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;
    }

    button:hover:not(:disabled),
    .button-like:hover {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button.primary {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }

    button.active {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    button.is-loading {
      pointer-events: none;
    }

    .nav-group-trigger {
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--ink-muted);
      display: inline-flex;
      gap: 9px;
      align-items: center;
      font-size: 13px;
      letter-spacing: 0.14em;
      line-height: 1.15;
      min-height: 58px;
      padding: 14px 0 16px;
      text-align: center;
    }

    .nav-group-trigger::after {
      border: solid currentColor;
      border-width: 0 1px 1px 0;
      content: '';
      display: inline-block;
      height: 6px;
      margin-top: -4px;
      transform: rotate(45deg);
      width: 6px;
    }

    .nav-group-trigger:hover:not(:disabled) {
      background: transparent;
      color: var(--ink-primary);
    }

    .nav-group.active > .nav-group-trigger,
    .nav-group.open > .nav-group-trigger {
      background: transparent;
      border-bottom-color: var(--ink-primary);
      color: var(--ink-primary);
    }

    .nav-menu {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      display: none;
      gap: 4px;
      left: 0;
      min-width: 280px;
      padding: 12px;
      position: absolute;
      top: calc(100% + 1px);
      z-index: 20;
    }

    .nav-group:last-child .nav-menu {
      left: auto;
      right: 0;
    }

    .nav-group.open .nav-menu {
      display: grid;
    }

    button.nav-menu-item {
      background: transparent;
      border: 0;
      color: var(--ink-body);
      display: block;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.3;
      min-height: 0;
      padding: 14px;
      text-align: left;
      text-transform: none;
      width: 100%;
    }

    button.nav-menu-item:hover:not(:disabled),
    button.nav-menu-item.active {
      background: var(--surface-inset);
      color: var(--ink-primary);
    }

    .nav-item-label {
      color: var(--ink-primary);
      display: block;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .nav-item-description {
      color: var(--ink-muted);
      display: block;
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.35;
      margin-top: 5px;
    }

    .masthead-actions button,
    .toolbar-actions button {
      border-color: var(--border-strong, #B8AC94);
      font-size: 12px;
      letter-spacing: 0.12em;
      min-height: 42px;
      padding: 10px 18px;
    }

    .masthead-actions button {
      background: transparent;
      color: var(--ink-body);
    }

    .toolbar-actions button.primary {
      min-width: 138px;
    }

    .status {
      color: var(--ink-muted);
      min-height: 20px;
      text-align: right;
    }

    .error {
      color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      min-width: 0;
      padding: 28px;
    }

    .panel-header {
      border-bottom: 1px solid var(--rule);
      margin-bottom: 20px;
      padding-bottom: 16px;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      padding: 18px;
    }

    .task-card.overdue {
      border-top: 2px solid var(--accent);
    }

    .task-side {
      align-content: start;
      display: grid;
      gap: 8px;
      justify-items: end;
      min-width: 72px;
    }

    .task-main {
      min-width: 0;
    }

    .brand-chip {
      border: 1px solid var(--rule);
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1;
      padding: 5px 7px;
      text-transform: uppercase;
    }

    .brand-chip.hp {
      background: #FCEAF3;
      border-color: #F3B8D5;
      color: #A71358;
    }

    .brand-chip.vvs {
      background: #FFF4CC;
      border-color: #E8C75C;
      color: #725500;
    }

    .calendar-nav {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .calendar-month {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      line-height: 1;
    }

    .calendar-grid {
      border-left: 1px solid var(--rule);
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekday {
      background: var(--surface-inset);
      border-bottom: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      padding: 9px 8px;
      text-transform: uppercase;
    }

    .calendar-day {
      background: var(--surface-card);
      border-bottom: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      min-height: 132px;
      padding: 8px;
    }

    .calendar-day.outside {
      background: var(--bg-foundation);
      color: var(--ink-muted);
    }

    .calendar-day.today {
      background: var(--surface-inset);
    }

    .calendar-day-number {
      color: var(--ink-muted);
      font-size: 11px;
      margin-bottom: 8px;
      text-align: right;
    }

    button.calendar-event {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: block;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.35;
      padding: 7px 0;
      text-align: left;
      text-transform: none;
      width: 100%;
    }

    button.calendar-event:hover:not(:disabled) {
      background: transparent;
      color: var(--ink-primary);
    }

    .calendar-event-time {
      color: var(--ink-muted);
      display: block;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .calendar-more {
      color: var(--ink-muted);
      font-size: 11px;
      padding-top: 7px;
    }

    .task-top {
      display: flex;
      gap: 16px;
      justify-content: space-between;
    }

    .task-title {
      color: var(--ink-primary);
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .meta {
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      background: var(--surface-inset);
      color: var(--ink-body);
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.12em;
      margin: 10px 8px 0 0;
      padding: 5px 7px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .empty, .loading {
      background: var(--surface-inset);
      color: var(--ink-muted);
      padding: 24px;
    }

    .detail-body {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .detail-section {
      border-bottom: 1px solid var(--rule);
      min-width: 0;
      padding-bottom: 18px;
    }

    .detail-section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .snooze-panel summary {
      align-items: center;
      color: var(--ink-muted);
      cursor: pointer;
      display: flex;
      font-size: 10px;
      gap: 12px;
      justify-content: space-between;
      letter-spacing: 0.14em;
      list-style: none;
      text-transform: uppercase;
    }

    .snooze-panel summary::-webkit-details-marker {
      display: none;
    }

    .snooze-panel summary::after {
      border: 1px solid var(--rule);
      color: var(--ink-primary);
      content: '+';
      flex: 0 0 auto;
      font-size: 13px;
      height: 24px;
      line-height: 22px;
      text-align: center;
      width: 24px;
    }

    .snooze-panel[open] summary {
      margin-bottom: 14px;
    }

    .snooze-panel[open] summary::after {
      content: '-';
    }

    .snooze-panel summary:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 4px;
    }

    .snooze-summary-text {
      min-width: 0;
    }

    .snooze-current {
      color: var(--ink-muted);
      display: block;
      font-size: 12px;
      letter-spacing: 0;
      line-height: 1.5;
      margin-top: 6px;
      text-transform: none;
    }

    .template-box {
      background: var(--surface-inset);
      color: var(--ink-primary);
      line-height: 1.55;
      max-width: 100%;
      min-height: 96px;
      overflow-wrap: anywhere;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .attachment-list {
      display: grid;
      gap: 12px;
    }

    .attachment-row {
      border-bottom: 1px solid var(--rule);
      overflow-wrap: anywhere;
      padding-bottom: 12px;
    }

    .attachment-row a {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .attachment-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .attachment-image {
      border: 1px solid var(--rule);
      display: block;
      margin-top: 10px;
      max-height: 220px;
      max-width: 100%;
      object-fit: contain;
    }

    label {
      color: var(--ink-muted);
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    textarea, input, select {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      color: var(--ink-primary);
      font: inherit;
      padding: 6px 2px;
      width: 100%;
    }

    textarea {
      border: 1px solid var(--rule);
      min-height: 140px;
      padding: 12px;
      resize: vertical;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
      outline: none;
    }

    .checklist {
      display: grid;
      gap: 10px;
    }

    .check-row {
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .check-row input {
      width: auto;
    }

    .role-grid {
      display: grid;
      gap: 10px;
    }

    .role-option {
      align-items: flex-start;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      font-size: 14px;
      gap: 10px;
      grid-template-columns: 18px 1fr;
      letter-spacing: 0;
      margin-bottom: 0;
      padding: 10px 0;
      text-transform: none;
    }

    .role-option input {
      margin-top: 2px;
      width: auto;
    }

    .admin-form {
      display: grid;
      gap: 12px;
    }

    .field-grid {
      display: grid;
      gap: 14px;
    }

    .field-grid .wide {
      grid-column: 1 / -1;
    }

    .mini-table {
      border-top: 1px solid var(--rule);
      display: grid;
      gap: 0;
    }

    .mini-row {
      border-bottom: 1px solid var(--rule);
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 160px);
      padding: 12px 0;
    }

    .mini-row.three {
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 150px) minmax(80px, 110px);
    }

    .mini-row.artifact-row {
      grid-template-columns: minmax(150px, 1fr) minmax(92px, 120px);
    }

    .artifact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .artifact-links a {
      font-size: 12px;
    }

    .upload-grid {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .review-context {
      display: grid;
      gap: 12px;
    }

    .review-context .template-box {
      min-height: 0;
    }

    .wax-update-row {
      grid-template-columns: minmax(160px, 1fr) minmax(220px, 2fr);
    }

    .wax-update-row textarea {
      margin-top: 8px;
      min-height: 64px;
    }

    .bulk-actions {
      align-items: center;
      background: var(--surface-inset);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 14px;
    }

    .bulk-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stock-filter-panel {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      margin-bottom: 16px;
      padding: 14px;
    }

    .stock-filter-heading {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stock-filter-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .bulk-return-row {
      align-items: flex-start;
      border-top: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      gap: 12px;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      letter-spacing: 0;
      margin: 0;
      padding: 16px 0;
      text-transform: none;
    }

    .bulk-return-row.issue {
      border-top: 2px solid var(--accent);
    }

    .bulk-return-row input {
      margin-top: 4px;
      width: auto;
    }

    .bulk-return-row .task-title,
    .bulk-return-row .meta {
      display: block;
    }

    .bulk-selected-list {
      border-top: 1px solid var(--rule);
      display: grid;
      gap: 0;
      margin-top: 10px;
    }

    .bulk-selected-item {
      border-bottom: 1px solid var(--rule);
      padding: 10px 0;
    }

    .stat-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      padding: 14px;
    }

    .stat-value {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      line-height: 1;
    }

    .admin-filter-panel {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
      padding: 16px;
    }

    .admin-filter-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    }

    .admin-closed-toggle {
      align-items: center;
      color: var(--ink-body);
      display: flex;
      font-size: 13px;
      gap: 8px;
      letter-spacing: 0;
      margin: 0;
      text-transform: none;
    }

    .admin-closed-toggle input {
      width: auto;
    }

    .admin-filter-actions {
      justify-content: flex-end;
      margin-top: 0;
    }

    .admin-kpi-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      margin-bottom: 18px;
    }

    .admin-kpi-card {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      min-height: 112px;
      padding: 14px;
    }

    .admin-kpi-card .meta {
      margin-top: 8px;
    }

    .admin-warning {
      background: var(--surface-inset);
      border-top: 2px solid var(--accent);
      color: var(--ink-body);
      margin-bottom: 18px;
      padding: 14px;
    }

    .admin-dashboard-wide .layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .admin-dashboard-wide #detailPanel {
      display: none;
    }

    .customer-search-wide .layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .customer-search-wide #detailPanel {
      display: none;
    }

    .employee-schedule-wide .layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .employee-schedule-wide #detailPanel {
      display: none;
    }

    .schedule-shell {
      display: grid;
      gap: 24px;
    }

    .schedule-hero {
      align-items: end;
      border-bottom: 1px solid var(--rule);
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr) auto;
      padding-bottom: 24px;
    }

    .schedule-hero h2 {
      font-size: 42px;
      line-height: 0.95;
    }

    .schedule-hero-actions,
    .schedule-filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .schedule-auto-card {
      align-items: center;
      background: var(--surface-card);
      border: 1px solid var(--rule);
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: 18px;
    }

    .schedule-switch {
      cursor: pointer;
      margin: 0;
    }

    .schedule-switch input {
      opacity: 0;

      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
    }

    .proposal-main {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .proposal-card,
    .proposal-side-panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      min-width: 0;
      padding: 24px;
    }

    .proposal-card.inset,
    .proposal-side-panel {
      background: var(--surface-inset);
    }

    .proposal-card-head {
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
    }

    .proposal-card-head h3 {
      font-size: 22px;
    }

    .proposal-stepper {
      align-items: center;
      background: var(--surface-inset);
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(160px, auto) 1fr minmax(160px, auto) 1fr minmax(160px, auto);
      padding: 12px 14px;
    }

    .proposal-step-button {
      align-items: center;
      background: transparent;
      border: 0;
      color: var(--ink-muted);
      display: inline-flex;
      font-size: 12px;
      font-weight: 400;
      gap: 8px;
      letter-spacing: 0;
      line-height: 1.2;
      min-height: 0;
      padding: 0;
      text-align: left;
      text-transform: none;
    }

    .proposal-step-button:hover:not(:disabled) {
      background: transparent;
      color: var(--ink-primary);
    }

    .proposal-step-button.active {
      background: transparent;
      color: var(--ink-primary);
    }

    .proposal-step-number {
      align-items: center;
      background: var(--rule);
      border-radius: 50%;
      color: var(--ink-primary);
      display: inline-flex;
      flex: 0 0 auto;
      font-size: 10px;
      height: 20px;
      justify-content: center;
      width: 20px;
    }

    .proposal-step-button.active .proposal-step-number,
    .proposal-step-button.done .proposal-step-number {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    .proposal-step-line {
      background: var(--rule);
      height: 1px;
    }

    .proposal-step[hidden] {
      display: none;
    }

    .proposal-field-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .proposal-field-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .proposal-field-grid .wide {
      grid-column: 1 / -1;
    }

    .proposal-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .proposal-chip {
      border: 1px solid var(--rule);
      color: var(--ink-body);
      display: inline-flex;
      gap: 4px;
      padding: 7px 10px;
    }

    .proposal-chip span {
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .proposal-match-band {
      background: var(--ink-primary);
      color: var(--bg-foundation);
      padding: 24px;
    }

    .proposal-match-band h3 {
      color: var(--bg-foundation);
      font-size: 24px;
    }

    .proposal-match-band .meta {
      color: var(--rule);
      margin-top: 6px;
    }

    .proposal-match-band .task-top {
      align-items: center;
    }

    .proposal-match-band button.primary {
      background: var(--bg-foundation);
      border-color: var(--bg-foundation);
      color: var(--ink-primary);
    }

    .proposal-match-band button.primary:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-foundation);
    }

    .proposal-match-results {
      display: none;
    }

    .proposal-results-toolbar {
      align-items: end;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .proposal-inventory-list {
      border-top: 1px solid var(--rule);
    }

    .proposal-inventory-row {
      align-items: center;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      gap: 12px;
      grid-template-columns: 22px minmax(180px, 1.25fr) repeat(7, minmax(72px, 0.6fr));
      letter-spacing: 0;
      margin: 0;
      padding: 14px 0;
      text-transform: none;
    }

    .proposal-inventory-row input {
      width: auto;
    }

    .proposal-inventory-cert {
      color: var(--ink-primary);
      font-weight: 500;
    }

    .proposal-inventory-cell {
      font-size: 12px;
      min-width: 0;
    }

    .proposal-inventory-cell .eyebrow {
      margin-bottom: 2px;
    }

    .proposal-inventory-value {
      color: var(--ink-primary);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .proposal-inventory-footer {
      align-items: center;
      border-top: 1px solid var(--rule);
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
    }

    .proposal-aside {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .proposal-side-panel .mini-row {
      grid-template-columns: minmax(90px, 1fr) minmax(80px, auto);
    }

    .proposal-link-list {
      display: grid;
      gap: 8px;
    }

    .proposal-link-list a {
      overflow-wrap: anywhere;
    }

    .proposal-checklist {
      display: grid;
      gap: 10px;
    }

    .proposal-checklist .check-row {
      align-items: flex-start;
    }

    .proposal-row.imported {
      border-top-color: var(--ink-primary);
    }

    .proposal-review-table {
      border-top: 1px solid var(--rule);
    }

    .proposal-review-row {
      align-items: center;
      border-bottom: 1px solid var(--rule);
      display: grid;
      gap: 14px;
      grid-template-columns: 36px minmax(180px, 1fr) repeat(5, minmax(80px, 0.5fr));
      padding: 14px 0;
    }

    .proposal-review-row .meta {
      overflow-wrap: anywhere;
    }

    .proposal-footer {
      align-items: center;
      border-top: 1px solid var(--rule);
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-top: 6px;
      padding: 16px 0 0;
    }

    .proposal-footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .login-status {
      min-height: 18px;
      margin-top: 12px;
    }

    @media (max-width: 980px) {
      .shell {
        padding: 20px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .calendar-weekday {
        display: none;
      }

      .calendar-day.outside {
        display: none;
      }

      .calendar-day {
        min-height: 96px;
      }

      .stat-grid, .proposal-grid, .admin-filter-grid, .admin-kpi-grid, .admin-risk-grid, .admin-pulse-grid, .admin-dashboard-grid, .admin-stage-grid {
        grid-template-columns: 1fr;
      }

      .schedule-hero,
      .schedule-section-heading,
      .schedule-summary-grid,
      .schedule-person-card,
      .schedule-routing,
      .schedule-override-grid,
      .schedule-override-form-grid {
        grid-template-columns: 1fr;
      }

      .schedule-hero-actions,
      .schedule-filter-group {
        justify-content: flex-start;
      }

      .schedule-roster-head {
        display: none;
      }

      .admin-kanban-board {
        grid-template-columns: 1fr;
        overflow-x: visible;
      }

      .customer-detail-hero,
      .customer-detail-next,
      .customer-detail-info-grid,
      .customer-detail-footer-grid {
        grid-template-columns: 1fr;
      }

      .customer-detail-card h2 {
        font-size: 34px;
      }

      .customer-next-rule {
        height: 4px;
        min-height: 0;
      }

      .customer-detail-tile,
      .customer-detail-footer-grid .detail-section {
        border-bottom: 1px solid var(--rule);
        border-right: 0;
      }

      .customer-detail-tile:last-child,
      .customer-detail-footer-grid .detail-section:last-child {
        border-bottom: 0;
      }

      .customer-kv-row,
      .customer-payment-row,
      .reference-grid {
        grid-template-columns: 1fr;
      }

      .customer-payment-side {
        text-align: left;
      }

      .stock-filter-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .stock-filter-grid {
        grid-template-columns: 1fr;
      }

      .masthead, .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .userline, .status {
        text-align: left;
      }

      .masthead-actions,
      .toolbar-actions {
        align-items: flex-start;
        justify-content: flex-start;
      }

      .toolbar-actions {
        padding-top: 0;
      }

      .tabs {
        gap: 18px;
        width: 100%;
      }

      .nav-group {
        position: static;
      }

      .nav-group-trigger {
        min-height: 50px;
        padding: 12px 0 14px;
      }

      .nav-menu {
        left: 0;
        min-width: min(320px, calc(100vw - 40px));
        right: auto;
        width: min(320px, calc(100vw - 40px));
      }

      .user-chip {
        justify-content: flex-start;
      }

      .proposal-task-head,
      .proposal-match-band .task-top,
      .proposal-results-toolbar,
      .proposal-inventory-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .proposal-actions {
        justify-content: flex-start;
      }

      .proposal-work-grid,
      .proposal-field-grid,
      .proposal-field-grid.three {
        grid-template-columns: 1fr;
      }

      .proposal-stepper {
        grid-template-columns: 1fr;
      }

      .proposal-step-line {
        display: none;
      }

      .proposal-inventory-row {
        grid-template-columns: 22px minmax(0, 1fr);
      }

      .proposal-inventory-row > *:nth-child(n+3) {
        grid-column: 2;
      }

      .proposal-review-row {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .proposal-review-row > *:nth-child(n+3) {
        grid-column: 2;
      }

      .proposal-footer,
      .proposal-footer-actions {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <section class="auth-screen" id="loginScreen">
    <div class="auth-panel">
      <div class="eyebrow">Sales Workflow</div>
      <h1>Sign in</h1>
      <div class="field-grid" style="margin-top:24px">
        <div>
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username">
        </div>
        <div>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password">
        </div>
      </div>
      <div class="actions">
        <button id="loginButton" class="primary" type="button">Sign In</button>
      </div>
      <div class="login-status error" id="loginStatus"></div>
    </div>
  </section>

  <main class="shell" id="appShell" style="display:none">
    <header class="masthead">
      <div>
        <div class="eyebrow">Sales Appointment Workflow</div>
        <h1>Team Queue</h1>
      </div>
      <div class="masthead-actions">
        <div class="userline" id="userLine">Loading user</div>
        <button id="logoutButton" type="button">Sign Out</button>
      </div>
    </header>

    <section class="toolbar">
      <nav class="tabs" aria-label="Dashboard navigation">
        <div class="nav-group active" data-nav-group="work">
          <button class="nav-group-trigger" type="button" aria-expanded="false">Work</button>
          <div class="nav-menu" role="menu">
            <button id="tab-mine" class="nav-menu-item active" type="button" data-view="mine" role="menuitem">
              <span class="nav-item-label">My Queue</span>
              <span class="nav-item-description">Tasks assigned to you</span>
            </button>
            <button id="tab-calendar" class="nav-menu-item" type="button" data-view="calendar" role="menuitem">
              <span class="nav-item-label">Calendar</span>
              <span class="nav-item-description">Upcoming appointments</span>
            </button>
            <button id="tab-coverage" class="nav-menu-item" type="button" data-view="coverage" role="menuitem" style="display:none">
              <span class="nav-item-label">JOC Coverage</span>
              <span class="nav-item-description">Shared coverage queue</span>
            </button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="customers" style="display:none">
          <button class="nav-group-trigger" type="button" aria-expanded="false">Customers</button>
          <div class="nav-menu" role="menu">
            <button id="tab-customerSearch" class="nav-menu-item" type="button" data-view="customerSearch" role="menuitem" style="display:none">
              <span class="nav-item-label">Customer Search</span>
              <span class="nav-item-description">Find customers and update status</span>
            </button>
            <button id="tab-adminDashboard" class="nav-menu-item" type="button" data-view="adminDashboard" role="menuitem" style="display:none">
              <span class="nav-item-label">Customer Pipeline</span>
              <span class="nav-item-description">Admin kanban and health</span>
            </button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="diamonds">
          <button class="nav-group-trigger" type="button" aria-expanded="false">Diamonds</button>
          <div class="nav-menu" role="menu">
            <button id="tab-inStockDiamonds" class="nav-menu-item" type="button" data-view="inStockDiamonds" role="menuitem">
              <span class="nav-item-label">Diamond Inventory</span>
              <span class="nav-item-description">In-stock stones and return dates</span>
            </button>
            <button id="tab-diamondTracking" class="nav-menu-item" type="button" data-view="diamondTracking" role="menuitem" style="display:none">
              <span class="nav-item-label">Diamond Tracking</span>
              <span class="nav-item-description">Shipments, ETAs, and returns</span>
            </button>
            <button id="tab-bulkReturns" class="nav-menu-item" type="button" data-view="bulkReturns" role="menuitem" style="display:none">
              <span class="nav-item-label">Bulk Returns</span>
              <span class="nav-item-description">Return multiple stones together</span>
            </button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="admin" style="display:none">
          <button class="nav-group-trigger" type="button" aria-expanded="false">Admin</button>
          <div class="nav-menu" role="menu">
            <button id="tab-employeeSchedules" class="nav-menu-item" type="button" data-view="employeeSchedules" role="menuitem" style="display:none">
              <span class="nav-item-label">Schedules</span>
              <span class="nav-item-description">Roster, skills, and coverage</span>
            </button>
            <button id="tab-admin" class="nav-menu-item" type="button" data-view="admin" role="menuitem" style="display:none">
              <span class="nav-item-label">Admin Review</span>
              <span class="nav-item-description">All open workflow tasks</span>
            </button>
            <button id="manageUsersButton" class="nav-menu-item" type="button" role="menuitem" style="display:none">
              <span class="nav-item-label">Manage Users</span>
              <span class="nav-item-description">Users, roles, and passwords</span>
            </button>
            <button id="tab-cleanup" class="nav-menu-item" type="button" data-view="cleanup" role="menuitem" style="display:none">
              <span class="nav-item-label">Cleanup</span>
              <span class="nav-item-description">Temporary stale customer campaign</span>
            </button>
          </div>
        </div>
      </nav>
      <div class="toolbar-actions">
        <button id="refreshQueueButton" class="primary" type="button">Refresh Queue</button>
      </div>
    </section>

    <div class="status" id="status"></div>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="eyebrow" id="viewEyebrow">My Queue</div>
          <h2 id="viewTitle">Tasks assigned to you</h2>
        </div>
        <div id="taskList" class="task-list">
          <div class="loading">LOADING</div>
        </div>
      </div>

      <aside class="panel" id="detailPanel">
        <div class="panel-header">
          <div class="eyebrow">Task Detail</div>
          <h2>Select a task</h2>
        </div>
        <div class="empty">Open a task to see instructions, message templates, attachments, and completion controls.</div>
      </aside>
    </section>

    <section class="task-workspace" id="taskWorkspace" style="display:none"></section>
  </main>

  <script>
    var SW_DASHBOARD_BUILD = 'login-bootstrap-combined-2026-05-05';

    var appState = {
      token: '',
      user: null,
      view: 'mine',
      selectedTaskId: '',
      detail: null,
      userAdmin: null,
      calendarMonth: '',
      calendarAppointments: [],
      diamondTrackingRows: [],
      inStockDiamondsRows: [],
      inStockDiamondsSource: null,
      inStockDiamondFilters: {
        shape: '',
        caratMin: '',
        caratMax: '',
        color: '',
        clarity: ''
      },
      proposalInventoryRows: [],
      proposalInventoryMatches: [],
      proposalInventorySource: null,
      proposalStep: 1,
      bulkReturnRows: [],
      bulkReturnSource: null,
      diamondSyncPreview: null,
      adminDashboard: null,
      adminDashboardFilters: null,
      adminDashboardDetail: null,
      adminDashboardSelectedRoot: '',
      employeeScheduleFilter: 'all',
      customerSearch: {
        query: '',
        filters: { activeOnly: true, defaultAdvisor: true },
        result: null,
        detail: null,
        selectedRoot: ''
      },
      mainRequestId: 0,
      detailRequestId: 0,
      lastActionButton: null,
      appointmentDriveSyncTimer: null,
      appointmentDriveSyncUntil: 0,
      appointmentDriveSyncTaskId: '',
      loginBusy: false,
      busy: false
    };

    function bindEvents() {
      document.addEventListener('click', function (event) {
        var button = closestMatch_(event.target, 'button');
        if (!button || button.disabled) return;
        appState.lastActionButton = button;
        window.setTimeout(function () {
          if (appState.lastActionButton === button) appState.lastActionButton = null;
        }, 0);
      }, true);

      var loginButton = document.getElementById('loginButton');
      if (loginButton) loginButton.addEventListener('click', login);
      var loginPassword = document.getElementById('loginPassword');
      if (loginPassword) {
        loginPassword.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') login();
        });
      }

      var logoutButton = document.getElementById('logoutButton');
      if (logoutButton) logoutButton.addEventListener('click', logout);

      [].slice.call(document.querySelectorAll('.nav-group-trigger')).forEach(function (trigger) {
        trigger.addEventListener('click', function () {
          toggleNavigationMenu(trigger);
        });
      });

      document.addEventListener('click', function (event) {
        if (!closestMatch_(event.target, '.nav-group')) closeNavigationMenus();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeNavigationMenus();
      });

      var manageUsersButton = document.getElementById('manageUsersButton');
      if (manageUsersButton) {
        manageUsersButton.addEventListener('click', function () {
          closeNavigationMenus();
          openUserAdminPanel();
        });
      }

      ['mine', 'calendar', 'customerSearch', 'cleanup', 'inStockDiamonds', 'diamondTracking', 'bulkReturns', 'coverage', 'adminDashboard', 'employeeSchedules', 'admin'].forEach(function (view) {
        var tab = document.getElementById('tab-' + view);
        if (!tab) return;
        tab.addEventListener('click', function () {
          closeNavigationMenus();
          if (view === 'calendar') loadCalendar();
          else if (view === 'customerSearch') loadCustomerSearch();
          else if (view === 'inStockDiamonds') loadInStockDiamonds();
          else if (view === 'diamondTracking') loadDiamondTracking();
          else if (view === 'bulkReturns') loadBulkReturns();
          else if (view === 'adminDashboard') loadAdminDashboard();
          else if (view === 'employeeSchedules') loadEmployeeSchedules();
          else loadTasks(view);
        });
      });

      var refreshQueueButton = document.getElementById('refreshQueueButton');
      if (refreshQueueButton) {
        refreshQueueButton.addEventListener('click', function () {
          closeNavigationMenus();
          refreshQueue();
        });
      }

      var taskList = document.getElementById('taskList');
      if (taskList) {
        taskList.addEventListener('click', function (event) {
          var stockClearButton = closestMatch_(event.target, '.js-stock-filter-clear');
          if (stockClearButton) {
            clearInStockDiamondFilters();
            return;
          }
          if (closestMatch_(event.target, '.js-open-loupe360-sync')) {
            openLoupe360SyncPanel();
            return;
          }
          if (closestMatch_(event.target, '.js-admin-dashboard-apply')) {
            loadAdminDashboard(collectAdminDashboardFilters());
            return;
          }
          if (closestMatch_(event.target, '.js-admin-dashboard-clear')) {
            clearAdminDashboardFilters();
            return;
          }
          var scheduleFilterButton = closestMatch_(event.target, '.js-schedule-filter');
          if (scheduleFilterButton) return setEmployeeScheduleFilter(scheduleFilterButton.getAttribute('data-filter') || 'all');
          var scheduleSaveButton = closestMatch_(event.target, '.js-schedule-save');
          if (scheduleSaveButton) return saveEmployeeSchedules(scheduleSaveButton);
          if (closestMatch_(event.target, '.js-schedule-add-row')) return addEmployeeScheduleRow();
          var scheduleAddButton = closestMatch_(event.target, '.js-schedule-add-change');
          if (scheduleAddButton) return upsertEmployeeScheduleChange(scheduleAddButton);
          var scheduleDeleteButton = closestMatch_(event.target, '.js-schedule-delete-change');
          if (scheduleDeleteButton) return deleteEmployeeScheduleChange(scheduleDeleteButton);
          if (closestMatch_(event.target, '.js-customer-search-apply')) {
            loadCustomerSearch(collectCustomerSearchFilters());
            return;
          }
          if (closestMatch_(event.target, '.js-customer-search-clear')) {
            clearCustomerSearchFilters();
            return;
          }
          if (closestMatch_(event.target, '.js-customer-status-open')) return openCustomerStatusAction();
          if (closestMatch_(event.target, '.js-customer-status-save')) return saveCustomerSearchStatus();
          if (closestMatch_(event.target, '.js-customer-deadline-save')) return saveCustomerSearch3DDeadline();
          if (closestMatch_(event.target, '.js-customer-revision-save')) return submitCustomerSearch3DRevision();
          if (closestMatch_(event.target, '.js-customer-wax-save')) return submitCustomerSearchWaxRequest();
          var customerCard = closestMatch_(event.target, '.js-customer-search-card');
          if (customerCard) {
            openCustomerSearchDetail(customerCard.getAttribute('data-root') || '');
            return;
          }
          var adminCard = closestMatch_(event.target, '.js-admin-kanban-card');
          if (adminCard) {
            openAdminDashboardCustomerDetail(adminCard.getAttribute('data-root') || '');
            return;
          }
          var bulkSelectButton = closestMatch_(event.target, '.js-bulk-return-select');
          if (bulkSelectButton) {
            selectBulkReturnRows(bulkSelectButton.getAttribute('data-select-mode') || '');
            return;
          }
          var calendarButton = closestMatch_(event.target, '.js-calendar-appt');
          if (calendarButton) {
            renderCalendarAppointmentDetail(calendarButton.getAttribute('data-appointment-id') || '');
            return;
          }
          var trackingButton = closestMatch_(event.target, '.js-diamond-tracking-row');
          if (trackingButton) {
            renderDiamondTrackingDetail(trackingButton.getAttribute('data-row-index') || '');
            return;

    function closestMatch_(target, selector) {
      return target && target.closest ? target.closest(selector) : null;
    }

    function toggleNavigationMenu(trigger) {
      var group = closestMatch_(trigger, '.nav-group');
      if (!group) return;
      var shouldOpen = !group.classList.contains('open');
      closeNavigationMenus();
      group.classList.toggle('open', shouldOpen);
      trigger.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
    }

    function closeNavigationMenus() {
      [].slice.call(document.querySelectorAll('.nav-group.open')).forEach(function (group) {
        group.classList.remove('open');
        var trigger = group.querySelector('.nav-group-trigger');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
      });
    }

    function updateNavigationGroups() {
      [].slice.call(document.querySelectorAll('.nav-group')).forEach(function (group) {
        var items = [].slice.call(group.querySelectorAll('.nav-menu-item'));
        var hasVisibleItem = items.some(function (item) {
          return item.style.display !== 'none';
        });
        var hasActiveItem = items.some(function (item) {
          return item.style.display !== 'none' && item.classList.contains('active');
        });
        group.style.display = hasVisibleItem ? '' : 'none';
        group.classList.toggle('active', hasActiveItem);
      });
    }

    function setStatus(message, isError) {
      var el = document.getElementById('status');
      el.textContent = message || '';
      el.className = isError ? 'status error' : 'status';
    }

    function setLoginStatus(message) {
      document.getElementById('loginStatus').textContent = message || '';
    }

    function setLoginBusy(isBusy) {
      appState.loginBusy = !!isBusy;
      var button = document.getElementById('loginButton');
      var email = document.getElementById('loginEmail');
      var password = document.getElementById('loginPassword');
      if (button) {
        button.disabled = !!isBusy;
        button.textContent = isBusy ? 'Signing In' : 'Sign In';
      }
      if (email) email.disabled = !!isBusy;
      if (password) password.disabled = !!isBusy;
    }

    function setBusy(isBusy, message) {
      appState.busy = isBusy;
      if (message) {
        setStatus(message);
      } else if (!isBusy) {
        setStatus('');
      }
    }

    function lockLoadingButton(sourceButton) {
      var button = sourceButton || appState.lastActionButton;
      if (!button || !document.documentElement.contains(button) || button.disabled) return null;
      button.disabled = true;
      button.classList.add('is-loading');
      button.setAttribute('aria-busy', 'true');
      return button;
    }

    function releaseLoadingButton(button) {
      if (!button) return;
      button.classList.remove('is-loading');
      button.removeAttribute('aria-busy');
      if (document.documentElement.contains(button)) button.disabled = false;
    }

    function serverCall(fnName, args, onSuccess, busyMessage, sourceButton) {
      var loadingButton = lockLoadingButton(sourceButton);
      setBusy(true, busyMessage || 'Working');
      var callArgs = args || [];
      if (fnName !== 'sw_login') callArgs = [appState.token].concat(callArgs);
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          onSuccess(response || {});
        })
        .withFailureHandler(function (err) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          var message = (err && err.message) ? err.message : String(err);
          if (fnName === 'sw_login') {
            setLoginBusy(false);
            setLoginStatus(message);
          }
          else if (fnName === 'sw_getBootstrap' && !appState.user) {
            appState.token = '';
            sessionStorage.removeItem('salesWorkflowToken');
            showLogin();
            setLoginStatus(message);
          }
          else setStatus(message, true);
        });
      runner[fnName].apply(runner, callArgs);
    }

    function openAppointmentUploadFolder(sourceButton) {
      if (!appState.selectedTaskId) return;
      var artifactType = valueOf('appointmentDriveArtifactType') || 'APPOINTMENT_RECORDING';
      var popup = window.open('', 'appointmentDriveUpload', 'width=1100,height=760,resizable=yes,scrollbars=yes');
      if (popup) {
        popup.document.write('<!doctype html><title>Opening Drive</title><body style="background:#F7F1EB;color:#2A2725;font-family:Inter,system-ui,sans-serif;padding:32px"><div style="color:#8A8178;font-size:11px;letter-spacing:.14em;text-transform:uppercase">Opening Drive Folder</div></body>');
        popup.document.close();
      }
      var loadingButton = lockLoadingButton(sourceButton);
      setBusy(true, 'Opening Drive folder');
      google.script.run
        .withSuccessHandler(function (res) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          if (!res || !res.url) {
            if (popup && !popup.closed) popup.close();
            setStatus('No Drive folder URL was returned for this appointment.', true);
            return;
          }
          if (popup && !popup.closed) {
            popup.location.href = res.url;
          } else {
            window.open(res.url, '_blank');
          }
          setStatus('Drive folder opened. This card will sync and rename new files automatically.');
          startAppointmentDriveUploadSync();
        })
        .withFailureHandler(function (err) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          if (popup && !popup.closed) popup.close();
          setStatus((err && err.message) ? err.message : String(err), true);
        })
        .sw_getAppointmentUploadFolder(appState.token, appState.selectedTaskId, artifactType);
    }

    function startAppointmentDriveUploadSync() {
      stopAppointmentDriveUploadSync();
      appState.appointmentDriveSyncTaskId = appState.selectedTaskId || '';
      appState.appointmentDriveSyncUntil = Date.now() + (10 * 60 * 1000);
      window.setTimeout(syncAppointmentDriveUploads, 8000);
      appState.appointmentDriveSyncTimer = window.setInterval(syncAppointmentDriveUploads, 20000);
    }

    function stopAppointmentDriveUploadSync() {
      if (appState.appointmentDriveSyncTimer) {
        window.clearInterval(appState.appointmentDriveSyncTimer);
        appState.appointmentDriveSyncTimer = null;
      }
      appState.appointmentDriveSyncUntil = 0;
      appState.appointmentDriveSyncTaskId = '';
    }

    function syncAppointmentDriveUploads() {
      var taskId = appState.appointmentDriveSyncTaskId;
      if (!taskId || appState.selectedTaskId !== taskId || Date.now() > appState.appointmentDriveSyncUntil) {
        stopAppointmentDriveUploadSync();
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (appState.selectedTaskId !== taskId) return;
          var automation = (res && res.automation) || {};
          var processed = Number(automation.processed || 0);
          var errors = Number(automation.errors || 0);
          if (res && res.automationError) setStatus(res.automationError, true);
          if ((res && res.registered) || processed || errors) {
            var parts = [];
            if (res && res.registered) parts.push('registered ' + res.registered + ' Drive file(s)');
            if (processed) parts.push('processed ' + processed + ' automation item(s)');
            if (errors) parts.push(errors + ' automation error(s)');
            setStatus(parts.join('; ') + '.');
            openTask(taskId);
          }
        })
        .withFailureHandler(function (err) {
          stopAppointmentDriveUploadSync();
          setStatus((err && err.message) ? err.message : String(err), true);
        })
        .sw_syncAppointmentDriveUploads(appState.token, taskId);
    }

    function maybeStartAppointmentAutomationWatch(res) {
      var task = (res && res.task) || {};
      if (task.taskType !== 'APPOINTMENT_DAY_CHECKLIST') return;
      if (!hasActiveAppointmentAutomation((res && res.appointmentArtifacts) || [])) return;
      if (appState.appointmentDriveSyncTaskId === appState.selectedTaskId) return;
      startAppointmentDriveUploadSync();
    }

    function hasActiveAppointmentAutomation(artifacts) {
      artifacts = artifacts || [];
      var activeStages = {
        UPLOADED: true,
        TRANSCRIPTION_QUEUED: true,
        TRANSCRIBING: true,
        TRANSCRIPT_READY: true,
        SUMMARY_QUEUED: true,
        SUMMARY_READY: true
      };
      return artifacts.some(function (artifact) {
        return activeStages[String(artifact.workflowStage || '').toUpperCase()];
      });
    }

    function beginMainRequest(view) {
      setTaskWorkspaceVisible(false);
      appState.mainRequestId += 1;
      appState.view = view;
      return appState.mainRequestId;
    }

    function isCurrentMainRequest(requestId, view) {
      return requestId === appState.mainRequestId && appState.view === view;
    }

    function init() {
      appState.token = sessionStorage.getItem('salesWorkflowToken') || '';
      if (!appState.token) {
        showLogin();
        return;
      }
      showAppLoading();
      bootstrap();
    }

    function bootstrap() {
      var requestId = beginMainRequest('mine');
      serverCall('sw_getBootstrap', [], function (res) {
        applyBootstrap(res, requestId);
      }, 'Opening dashboard');
    }

    function applyBootstrap(res, requestId) {
      showApp();
      appState.user = res.user;
      renderUser(res);
      if (requestId && !isCurrentMainRequest(requestId, 'mine')) return;
      appState.view = 'mine';
      setActiveTab(appState.view);
      renderViewHeader(appState.view);
      renderTasks(res.tasks || []);
      if (res.message) setStatus(res.message);
    }

    function showLogin() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
      setLoginBusy(false);
      setLoginStatus('');
      window.setTimeout(function () {
        var email = document.getElementById('loginEmail');
        var password = document.getElementById('loginPassword');
        var target = email && email.value ? password : email;
        if (target && target.focus) target.focus();
      }, 0);
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = '';
    }

    function showAppLoading() {
      showApp();
      setStatus('Opening dashboard');
      var taskList = document.getElementById('taskList');
      if (taskList) taskList.innerHTML = '<div class="loading">LOADING TASKS</div>';
      renderTaskDetailPlaceholder(
        'Task Detail',
        'Loading Queue',
        'Task details will appear after the queue opens.'
      );
    }

    function login() {
      if (appState.loginBusy || appState.busy) return;
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      setLoginBusy(true);
      setLoginStatus('Signing in');
      serverCall('sw_login', [email, password, { includeBootstrap: true }], function (res) {
        setLoginStatus('Opening dashboard');
        appState.token = res.token || '';
        appState.user = res.user || null;
        sessionStorage.setItem('salesWorkflowToken', appState.token);
        setLoginBusy(false);
        if (res.bootstrap && res.bootstrap.ok) {
          applyBootstrap(res.bootstrap, beginMainRequest('mine'));
          return;
        }
        showApp();
        renderUser({
          user: appState.user || {},
          views: clientViewsForUser(appState.user || {})
        });
        document.getElementById('taskList').innerHTML = '<div class="loading">LOADING TASKS</div>';
        bootstrap();
      }, 'Signing in');
    }

    function clientViewsForUser(user) {
      user = user || {};
      return {
        mine: true,
        calendar: true,
        customerSearch: !!(user.isAdmin || user.isJoc || user.isRep),
        cleanup: false,
        inStockDiamonds: true,
        diamondTracking: !!(user.isAdmin || user.isDiamondOrderAdmin || user.isDiamondOrderAssistant),
        bulkReturns: !!(user.isAdmin || user.isDiamondOrderAdmin),
        coverage: !!(user.isJoc || user.isAdmin),
        adminDashboard: !!user.isAdmin,
        employeeSchedules: !!user.isAdmin,
        admin: !!user.isAdmin
      };
    }

    function logout() {
      serverCall('sw_logout', [], function () {
        appState.token = '';
        sessionStorage.removeItem('salesWorkflowToken');
        appState.user = null;
        showLogin();
      }, 'Signing out');
    }

    function renderUser(res) {
      var user = res.user || {};
      var parts = [];
      if (user.isAdmin) parts.push('Admin');
      if (user.isJoc) parts.push('JOC');
      if (user.isDiamondOrderAdmin) parts.push('Diamond Order Admin');
      if (user.isDiamondOrderAssistant) parts.push('Diamond Order Assistant');
      if (!parts.length && user.isRep) parts.push('Client Advisor');
      var displayName = user.name || user.email || 'Unknown user';
      document.getElementById('userLine').innerHTML = [
        '<span class="user-chip">',
          '<span class="user-avatar">' + escapeHtml(userInitials(displayName)) + '</span>',
          '<span>',
            '<span class="user-name-line">' + escapeHtml(displayName) + '</span>',
            '<span class="user-role-line">' + escapeHtml(parts.join(' / ') || 'Workflow User') + '</span>',
          '</span>',
        '</span>'
      ].join('');
      document.getElementById('tab-cleanup').style.display = res.views && res.views.cleanup ? '' : 'none';
      document.getElementById('tab-customerSearch').style.display = res.views && res.views.customerSearch ? '' : 'none';
      document.getElementById('tab-inStockDiamonds').style.display = res.views && res.views.inStockDiamonds !== false ? '' : 'none';
      document.getElementById('tab-diamondTracking').style.display = res.views && res.views.diamondTracking ? '' : 'none';
      document.getElementById('tab-bulkReturns').style.display = res.views && res.views.bulkReturns ? '' : 'none';
      document.getElementById('tab-coverage').style.display = res.views && res.views.coverage ? '' : 'none';
      document.getElementById('tab-adminDashboard').style.display = res.views && res.views.adminDashboard ? '' : 'none';
      document.getElementById('tab-employeeSchedules').style.display = res.views && res.views.employeeSchedules ? '' : 'none';
      document.getElementById('tab-admin').style.display = res.views && res.views.admin ? '' : 'none';
      document.getElementById('manageUsersButton').style.display = user.isAdmin ? '' : 'none';
      updateNavigationGroups();
    }

    function userInitials(value) {
      var parts = String(value || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return 'U';
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

      var loadingButton = lockLoadingButton(sourceButton);

      google.script.run
        .withSuccessHandler(function (res) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          appState.diamondSyncPreview = res || {};
          input.value = '';
          var fileStatus = document.getElementById('loupe360FileStatus');
          if (fileStatus) fileStatus.textContent = 'File uploaded for preview';
          renderLoupe360SyncPreview(res || {});
          setStatus('Preview ready. Review counts before applying.');
        })
        .withFailureHandler(function (err) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          setStatus((err && err.message) ? err.message : String(err), true);
        })
        .sw_previewLoupe360DiamondSync(form);
    }

    function renderLoupe360SyncPreview(res) {
      var stats = res.stats || {};
      var samples = res.samples || {};
      var tracker = res.spreadsheetUrl ? '<a href="' + escapeHref(res.spreadsheetUrl) + '" target="_blank">Open 200_ tracker</a>' : '';
      var html = [
        '<div class="detail-section">',
          '<label>Preview</label>',
          '<div class="stat-grid">',
            statCardHtml('Source Rows', stats.sourceRows || res.sourceRows || 0),
            statCardHtml('Matched', stats.matched || 0),
            statCardHtml('Will Update', stats.updated || 0),
            statCardHtml('Will Append', stats.appended || 0),
            statCardHtml('Needs Assignment', res.assignmentMissing || 0),
          '</div>',
          '<div class="meta">' + escapeHtml(res.tab || '') + '</div>',
          tracker ? '<div class="actions">' + tracker + '</div>' : '',
        '</div>'
      ];
      if ((stats.statusOverwrites || 0) || (stats.duplicateSourceCerts || 0) || (stats.duplicateTrackerCerts || 0)) {
        html.push([
          '<div class="detail-section">',
            '<label>Review Flags</label>',
            '<div class="template-box">',
              'Status overwrites: ' + escapeHtml(stats.statusOverwrites || 0) + '<br>',
              'Duplicate source certificates: ' + escapeHtml(stats.duplicateSourceCerts || 0) + '<br>',
              'Duplicate tracker certificates: ' + escapeHtml(stats.duplicateTrackerCerts || 0),
            '</div>',
          '</div>'
        ].join(''));
      }
      html.push(renderLoupe360SampleList('Rows To Append', samples.appends || []));
      html.push(renderLoupe360SampleList('Rows To Update', samples.updates || []));
      html.push(renderLoupe360SampleList('Skipped Rows', (samples.conflicts || []).concat(samples.skipped || [])));
      html.push('<div class="actions"><button class="primary js-apply-loupe360-sync" type="button">Apply Sync</button></div>');
      var el = document.getElementById('loupe360SyncPreview');
      if (el) el.innerHTML = html.join('');
    }

          '<label>' + escapeHtml(title) + '</label>',
          '<div class="tracking-list">',
            rows.map(function (row) {
              return '<div class="tracking-row"><div class="task-top"><div><div class="task-title">' + escapeHtml(row.diamond || row.certNo || ('Row ' + (row.rowIndex || ''))) + '</div><div class="meta">' + escapeHtml([row.certNo ? 'Cert ' + row.certNo : '', row.status || '', row.reason || '', row.changeCount ? row.changeCount + ' field(s)' : ''].filter(Boolean).join(' | ')) + '</div></div></div></div>';

          '</div>',
        '</div>'
      ].join('');

    function applyLoupe360DiamondSync(sourceButton) {
      var preview = appState.diamondSyncPreview || {};
      if (!preview.syncId) {
        setStatus('Preview the spreadsheet before applying.', true);
        return;
      }
      serverCall('sw_applyLoupe360DiamondSync', [preview.syncId], function (res) {

    function loadTasks(view, options) {
      if (view === 'calendar') {
        loadCalendar(appState.calendarMonth);
        return;
      }
      if (view === 'customerSearch') {
        loadCustomerSearch();
        return;
      }
      if (view === 'inStockDiamonds') {
        loadInStockDiamonds();
        return;
      }
      if (view === 'diamondTracking') {
        loadDiamondTracking();
        return;
      }
      if (view === 'bulkReturns') {
        loadBulkReturns();
        return;
      }
      if (view === 'adminDashboard') {
        loadAdminDashboard();
        return;
      }
      if (view === 'employeeSchedules') {
        loadEmployeeSchedules();
        return;
      }
      options = options || {};
      var viewName = view || 'mine';
      var reopenTaskId = options.reopenTaskId || '';
      var requestId = beginMainRequest(viewName);
      setActiveTab(viewName);
      renderViewHeader(viewName);
      document.getElementById('taskList').innerHTML = '<div class="loading">LOADING</div>';
      if (reopenTaskId) {
        appState.selectedTaskId = reopenTaskId;
        appState.detail = null;
        appState.detailRequestId += 1;
        renderTaskDetailLoading('Task Detail', 'Refreshing Task', 'LOADING TASK');
      } else {
        clearTaskDetailSelection();
      }
      serverCall('sw_getMyTasks', [viewName], function (res) {
        if (!isCurrentMainRequest(requestId, viewName)) return;
        renderTasks(res.tasks || []);
        if (reopenTaskId) openTask(reopenTaskId);
      });

        var el = document.getElementById('tab-' + v);

      });
      updateNavigationGroups();
      updateAdminDashboardLayoutMode();

    function updateAdminDashboardLayoutMode() {

    function loadAdminDashboard(filters) {
      var requestId = beginMainRequest('adminDashboard');
      appState.selectedTaskId = '';
      appState.detailRequestId += 1;
      appState.adminDashboardDetail = null;
      appState.adminDashboardSelectedRoot = '';
      setActiveTab('adminDashboard');
      renderViewHeader('adminDashboard');
      document.getElementById('taskList').innerHTML = '<div class="loading">LOADING ADMIN DASHBOARD</div>';
      document.getElementById('detailPanel').innerHTML = '<div class="panel-header"><div class="eyebrow">Admin Dashboard</div><h2>Loading</h2></div><div class="loading">LOADING</div>';
      filters = filters || appState.adminDashboardFilters || {};
      filters.mode = 'kanban';
      var dashboardCacheKey = adminDashboardFilterCacheKey(filters);
      var previousDashboard = appState.adminDashboardCacheKey === dashboardCacheKey ? (appState.adminDashboard || {}) : {};
      serverCall('sw_getAdminDashboard', [filters], function (res) {
        if (!isCurrentMainRequest(requestId, 'adminDashboard')) return;
        appState.adminDashboard = mergeAdminDashboardResponse(previousDashboard, res || {});
        appState.adminDashboardCacheKey = dashboardCacheKey;
        appState.adminDashboardFilters = (res && res.filters) || filters || {};
        renderAdminDashboard(appState.adminDashboard || {});
      }, 'Loading admin dashboard');

    function adminDashboardFilterCacheKey(filters) {
      filters = filters || {};
      return [
        filters.windowPreset || '',
        filters.startDate || '',
        filters.endDate || '',
        filters.brand || '',
        filters.clientAdvisor || '',
        filters.joc || '',
        filters.includeClosed ? '1' : '0'
      ].join('|');
    }

    function mergeAdminDashboardResponse(prev, next) {
      prev = prev || {};
      next = next || {};
      return {
        ok: next.ok,
        generatedAt: next.generatedAt || prev.generatedAt || '',
        filters: next.filters || prev.filters || {},
        filterOptions: next.filterOptions || prev.filterOptions || {},
        kanban: next.kanban || prev.kanban || null,
        taskCount: next.taskCount == null ? prev.taskCount : next.taskCount,
        warnings: next.warnings || prev.warnings || []
      };
    }

    function collectAdminDashboardFilters() {
      return {
        windowPreset: valueOf('adminDashWindow'),
        startDate: valueOf('adminDashStartDate'),
        endDate: valueOf('adminDashEndDate'),
        mode: 'kanban',
        brand: valueOf('adminDashBrand'),
        clientAdvisor: valueOf('adminDashClientAdvisor'),
        joc: valueOf('adminDashJoc'),
        includeClosed: checkedOf('adminDashIncludeClosed')
      };
    }

    function clearAdminDashboardFilters() {
      appState.adminDashboardFilters = {};

          '<div class="schedule-person-cell">',

      ].join('');

      var tags = ['<option value="">' + escapeHtml(emptyLabel || 'No fixed partner') + '</option>'];

        if (!name || norm(name) === norm(currentName) || seen[norm(name)]) return;

        tags.push('<option value="' + escapeAttrValue(name) + '"' + (norm(name) === norm(selected) ? ' selected' : '') + '>' + escapeHtml(name) + '</option>');

      return tags.join('');

      return [
        '<section class="schedule-override-panel">',
          '<div><div class="eyebrow">Schedule override</div><h2>Add a schedule override</h2><div class="meta">One-off day off, partial shift, or extra working day for any team member.</div></div>',

    function renderEmployeeScheduleChangeTypeOptions(changeTypes, selected) {

      order.concat(changeTypes || []).forEach(function (type) {

      var type = norm(value);
      if (type === 'full-day off') return 'Full day off';

    function renderEmployeeScheduleSummary(res) {
      res = res || {};
      var people = res.people || [];
      var jocCount = people.filter(function (person) { return employeeScheduleHasRole(person.role, 'JOC') && person.active !== false; }).length;
      var advisorCount = people.filter(function (person) { return employeeScheduleHasRole(person.role, 'Client Advisor') && person.active !== false; }).length;
      var today = res.today || [];
      document.getElementById('detailPanel').innerHTML = [
        '<div class="panel-header"><div class="eyebrow">Team Schedules</div><h2>Routing Rules</h2></div>',
        '<div class="detail-body">',
          '<div class="detail-section"><label>Active Employees</label><div class="template-box">' + escapeHtml(advisorCount + ' Client Advisor(s), ' + jocCount + ' JOC user(s).') + '</div></div>',
          '<div class="detail-section"><label>Today Working</label><div class="template-box">' + escapeHtml(today.length ? today.map(function (person) { return person.name + (person.availableFrom || person.availableUntil ? ' (' + [person.availableFrom || 'start', person.availableUntil || 'end'].join('-') + ')' : ''); }).join(', ') : 'No scheduled employees found for today.') + '</div></div>',
          '<div class="detail-section"><label>Client Advisor Pairing</label><div class="meta">Auto-assignment picks a working, qualified Client Advisor, then writes that advisor and linked JOC to the appointment.</div></div>',
          '<div class="detail-section"><label>JOC Coverage</label><div class="meta">If the linked or intended JOC is off, tasks first use that JOC coverage partner, then another working JOC, then the shared JOC Coverage queue.</div></div>',
          '<div class="detail-section"><label>Client Advisor Round Robin</label><div class="meta">' + escapeHtml((res.settings || {}).clientAdvisorRoundRobin ? 'Enabled for blank or unavailable Client Advisor fields on queue refresh.' : 'Disabled. Existing Client Advisor values stay manual unless enabled.') + '</div></div>',
        '</div>'
      ].join('');
