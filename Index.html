<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-foundation: #F7F1EB;
      --surface-card:  #FBF7F1;
      --surface-inset: #EFE8DD;
      --ink-primary:   #2A2725;
      --ink-body:      #4A4540;
      --ink-muted:     #8A8178;
      --rule:          #D4CFC4;
      --accent:        #E91D79;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-foundation);
      color: var(--ink-body);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
    }

    .auth-screen {
      align-items: center;
      display: flex;
      min-height: 100vh;
      padding: 32px;
    }

    .auth-panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      margin: 0 auto;
      max-width: 440px;
      padding: 32px;
      width: 100%;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow {
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1, h2, h3 {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      margin: 0;
    }

    h1 {
      font-size: 38px;
      line-height: 1;
    }

    h2 {
      font-size: 26px;
    }

    h3 {
      font-size: 20px;
    }

    .userline {
      color: var(--ink-muted);
      text-align: right;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border-radius: 2px;
      border: 1px solid var(--ink-primary);
      background: transparent;
      color: var(--ink-primary);
      cursor: pointer;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      padding: 10px 14px;
      text-transform: uppercase;
      transition: background-color 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;
    }

    button:hover:not(:disabled) {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button.primary {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }

    button.active {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .status {
      color: var(--ink-muted);
      min-height: 20px;
      text-align: right;
    }

    .error {
      color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      padding: 28px;
    }

    .panel-header {
      border-bottom: 1px solid var(--rule);
      margin-bottom: 20px;
      padding-bottom: 16px;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      padding: 18px;
    }

    .task-card.overdue {
      border-top: 2px solid var(--accent);
    }

    .calendar-nav {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .calendar-month {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      line-height: 1;
    }

    .calendar-grid {
      border-left: 1px solid var(--rule);
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekday {
      background: var(--surface-inset);
      border-bottom: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      padding: 9px 8px;
      text-transform: uppercase;
    }

    .calendar-day {
      background: var(--surface-card);
      border-bottom: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      min-height: 132px;
      padding: 8px;
    }

    .calendar-day.outside {
      background: var(--bg-foundation);
      color: var(--ink-muted);
    }

    .calendar-day.today {
      background: var(--surface-inset);
    }

    .calendar-day-number {
      color: var(--ink-muted);
      font-size: 11px;
      margin-bottom: 8px;
      text-align: right;
    }

    button.calendar-event {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: block;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.35;
      padding: 7px 0;
      text-align: left;
      text-transform: none;
      width: 100%;
    }

    button.calendar-event:hover:not(:disabled) {
      background: transparent;
      color: var(--ink-primary);
    }

    .calendar-event-time {
      color: var(--ink-muted);
      display: block;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .calendar-more {
      color: var(--ink-muted);
      font-size: 11px;
      padding-top: 7px;
    }

    .task-top {
      display: flex;
      gap: 16px;
      justify-content: space-between;
    }

    .task-title {
      color: var(--ink-primary);
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .meta {
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      background: var(--surface-inset);
      color: var(--ink-body);
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.12em;
      margin: 10px 8px 0 0;
      padding: 5px 7px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .empty, .loading {
      background: var(--surface-inset);
      color: var(--ink-muted);
      padding: 24px;
    }

    .detail-body {
      display: grid;
      gap: 18px;
    }

    .detail-section {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 18px;
    }

    .detail-section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .template-box {
      background: var(--surface-inset);
      color: var(--ink-primary);
      line-height: 1.55;
      min-height: 96px;
      padding: 16px;
      white-space: pre-wrap;
    }

    .attachment-list {
      display: grid;
      gap: 12px;
    }

    .attachment-row {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 12px;
    }

    .attachment-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .attachment-image {
      border: 1px solid var(--rule);
      display: block;
      margin-top: 10px;
      max-height: 220px;
      max-width: 100%;
      object-fit: contain;
    }

    label {
      color: var(--ink-muted);
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    textarea, input, select {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      color: var(--ink-primary);
      font: inherit;
      padding: 6px 2px;
      width: 100%;
    }

    textarea {
      border: 1px solid var(--rule);
      min-height: 140px;
      padding: 12px;
      resize: vertical;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
      outline: none;
    }

    .checklist {
      display: grid;
      gap: 10px;
    }

    .check-row {
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .check-row input {
      width: auto;
    }

    .role-grid {
      display: grid;
      gap: 10px;
    }

    .role-option {
      align-items: flex-start;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      font-size: 14px;
      gap: 10px;
      grid-template-columns: 18px 1fr;
      letter-spacing: 0;
      margin-bottom: 0;
      padding: 10px 0;
      text-transform: none;
    }

    .role-option input {
      margin-top: 2px;
      width: auto;
    }

    .admin-form {
      display: grid;
      gap: 12px;
    }

    .field-grid {
      display: grid;
      gap: 14px;
    }

    .mini-table {
      border-top: 1px solid var(--rule);
      display: grid;
      gap: 0;
    }

    .mini-row {
      border-bottom: 1px solid var(--rule);
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 160px);
      padding: 12px 0;
    }

    .mini-row.three {
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 150px) minmax(80px, 110px);
    }

    .stat-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      padding: 14px;
    }

    .stat-value {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      line-height: 1;
    }

    button.tracking-row {
      background: transparent;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      border-top: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      font-size: 14px;
      font-weight: 400;
      gap: 10px;
      letter-spacing: 0;
      padding: 16px 0;
      text-align: left;
      text-transform: none;
      width: 100%;
    }

    button.tracking-row:hover:not(:disabled) {
      background: var(--surface-inset);
      color: var(--ink-body);
    }

    button.tracking-row.issue {
      border-top: 2px solid var(--accent);
    }

    .proposal-rows {
      display: grid;
      gap: 18px;
    }

    .proposal-row {
      border-top: 1px solid var(--rule);
      padding-top: 16px;
    }

    .proposal-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .proposal-grid .wide {
      grid-column: 1 / -1;
    }

    .login-status {
      min-height: 18px;
      margin-top: 12px;
    }

    @media (max-width: 980px) {
      .shell {
        padding: 20px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .calendar-weekday {
        display: none;
      }

      .calendar-day.outside {
        display: none;
      }

      .calendar-day {
        min-height: 96px;
      }

      .stat-grid, .proposal-grid {
        grid-template-columns: 1fr;
      }

      .masthead, .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .userline, .status {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <section class="auth-screen" id="loginScreen">
    <div class="auth-panel">
      <div class="eyebrow">Sales Workflow</div>
      <h1>Sign in</h1>
      <div class="field-grid" style="margin-top:24px">
        <div>
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username">
        </div>
        <div>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password">
        </div>
      </div>
      <div class="actions">
        <button id="loginButton" class="primary" type="button">Sign In</button>
      </div>
      <div class="login-status error" id="loginStatus"></div>
    </div>
  </section>

  <main class="shell" id="appShell" style="display:none">
    <header class="masthead">
      <div>
        <div class="eyebrow">Sales Appointment Workflow</div>
        <h1>Team Queue</h1>
      </div>
      <div class="userline" id="userLine">Loading user</div>
    </header>

    <section class="toolbar">
      <div class="tabs">
        <button id="tab-mine" class="active" type="button" data-view="mine">My Queue</button>
        <button id="tab-calendar" type="button" data-view="calendar">Calendar</button>
        <button id="tab-inStockDiamonds" type="button" data-view="inStockDiamonds">In-Stock Diamonds</button>
        <button id="tab-diamondTracking" type="button" data-view="diamondTracking" style="display:none">Diamond Tracking</button>
        <button id="tab-coverage" type="button" data-view="coverage" style="display:none">JOC Coverage</button>
        <button id="tab-admin" type="button" data-view="admin" style="display:none">Admin Review</button>
      </div>
      <div>
        <button id="manageUsersButton" type="button" style="display:none">Manage Users</button>
        <button id="logoutButton" type="button">Sign Out</button>
        <button id="refreshOwnersButton" type="button">Refresh Owners</button>
        <button id="generateTasksButton" class="primary" type="button">Generate Tasks</button>
      </div>
    </section>

    <div class="status" id="status"></div>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="eyebrow" id="viewEyebrow">My Queue</div>
          <h2 id="viewTitle">Tasks assigned to you</h2>
        </div>
        <div id="taskList" class="task-list">
          <div class="loading">LOADING</div>
        </div>
      </div>

      <aside class="panel" id="detailPanel">
        <div class="panel-header">
          <div class="eyebrow">Task Detail</div>
          <h2>Select a task</h2>
        </div>
        <div class="empty">Open a task to see instructions, message templates, attachments, and completion controls.</div>
      </aside>
    </section>
  </main>

  <script>
    var appState = {
      token: '',
      user: null,
      view: 'mine',
      selectedTaskId: '',
      detail: null,
      userAdmin: null,
      calendarMonth: '',
      calendarAppointments: [],
      diamondTrackingRows: [],
      inStockDiamondsRows: [],
      mainRequestId: 0,
      detailRequestId: 0,
      busy: false
    };

    function bindEvents() {
      var loginButton = document.getElementById('loginButton');
      if (loginButton) loginButton.addEventListener('click', login);
      var loginPassword = document.getElementById('loginPassword');
      if (loginPassword) {
        loginPassword.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') login();
        });
      }

      var logoutButton = document.getElementById('logoutButton');
      if (logoutButton) logoutButton.addEventListener('click', logout);

      var manageUsersButton = document.getElementById('manageUsersButton');
      if (manageUsersButton) manageUsersButton.addEventListener('click', openUserAdminPanel);

      ['mine', 'calendar', 'inStockDiamonds', 'diamondTracking', 'coverage', 'admin'].forEach(function (view) {
        var tab = document.getElementById('tab-' + view);
        if (!tab) return;
        tab.addEventListener('click', function () {
          if (view === 'calendar') loadCalendar();
          else if (view === 'inStockDiamonds') loadInStockDiamonds();
          else if (view === 'diamondTracking') loadDiamondTracking();
          else loadTasks(view);
        });
      });

      var refreshOwnersButton = document.getElementById('refreshOwnersButton');
      if (refreshOwnersButton) refreshOwnersButton.addEventListener('click', refreshOwners);

      var generateTasksButton = document.getElementById('generateTasksButton');
      if (generateTasksButton) generateTasksButton.addEventListener('click', generateTasks);

      var taskList = document.getElementById('taskList');
      if (taskList) {
        taskList.addEventListener('click', function (event) {
          var calendarButton = closestMatch_(event.target, '.js-calendar-appt');
          if (calendarButton) {
            renderCalendarAppointmentDetail(calendarButton.getAttribute('data-appointment-id') || '');
            return;
          }
          var trackingButton = closestMatch_(event.target, '.js-diamond-tracking-row');
          if (trackingButton) {
            renderDiamondTrackingDetail(trackingButton.getAttribute('data-row-index') || '');
            return;
          }
          var stockButton = closestMatch_(event.target, '.js-instock-diamond-row');
          if (stockButton) {
            renderInStockDiamondDetail(stockButton.getAttribute('data-row-index') || '');
            return;
          }
          var button = closestMatch_(event.target, '.js-open-task');
          if (!button) return;
          openTask(button.getAttribute('data-task-id') || '');
        });
      }

      var detailPanel = document.getElementById('detailPanel');
      if (detailPanel) {
        detailPanel.addEventListener('click', function (event) {
          if (closestMatch_(event.target, '.js-copy-template')) return copyTemplate();
          if (closestMatch_(event.target, '.js-copy-manufacturing')) return copyManufacturingMessage();
          var refreshButton = closestMatch_(event.target, '.js-refresh-diamond-quote');
          if (refreshButton) return refreshDiamondQuote(refreshButton.getAttribute('data-mode') || 'all');
          var copyStockButton = closestMatch_(event.target, '.js-copy-stock-diamond');
          if (copyStockButton) return copyStockDiamondDetails(copyStockButton.getAttribute('data-row-index') || '');
          var addProposalButton = closestMatch_(event.target, '.js-add-proposal-row');
          if (addProposalButton) return addProposalRow();
          var removeProposalButton = closestMatch_(event.target, '.js-remove-proposal-row');
          if (removeProposalButton) return removeProposalRow(removeProposalButton);
          if (closestMatch_(event.target, '.js-claim-task')) return claimTask();
          if (closestMatch_(event.target, '.js-complete-task')) return completeTask();
          if (closestMatch_(event.target, '.js-admin-reassign')) return adminReassign();
          if (closestMatch_(event.target, '.js-admin-block')) return adminBlock();
          if (closestMatch_(event.target, '.js-admin-unblock')) return adminUnblock();
          if (closestMatch_(event.target, '.js-admin-generate-password')) return fillGeneratedUserPassword();
          if (closestMatch_(event.target, '.js-admin-save-user')) return saveWorkflowUser();
        });
        detailPanel.addEventListener('change', function () {
          updateCompleteButtonState();
        });
        detailPanel.addEventListener('input', function () {
          updateCompleteButtonState();
        });
      }
    }

    function closestMatch_(target, selector) {
      return target && target.closest ? target.closest(selector) : null;
    }

    function setStatus(message, isError) {
      var el = document.getElementById('status');
      el.textContent = message || '';
      el.className = isError ? 'status error' : 'status';
    }

    function setLoginStatus(message) {
      document.getElementById('loginStatus').textContent = message || '';
    }

    function setLoginBusy(isBusy) {
      var button = document.getElementById('loginButton');
      var email = document.getElementById('loginEmail');
      var password = document.getElementById('loginPassword');
      if (button) {
        button.disabled = !!isBusy;
        button.textContent = isBusy ? 'Signing In' : 'Sign In';
      }
      if (email) email.disabled = !!isBusy;
      if (password) password.disabled = !!isBusy;
    }

    function setBusy(isBusy, message) {
      appState.busy = isBusy;
      if (message) {
        setStatus(message);
      } else if (!isBusy) {
        setStatus('');
      }
    }

    function serverCall(fnName, args, onSuccess, busyMessage) {
      setBusy(true, busyMessage || 'Working');
      var callArgs = args || [];
      if (fnName !== 'sw_login') callArgs = [appState.token].concat(callArgs);
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          setBusy(false, '');
          onSuccess(response || {});
        })
        .withFailureHandler(function (err) {
          setBusy(false, '');
          var message = (err && err.message) ? err.message : String(err);
          if (fnName === 'sw_login') {
            setLoginBusy(false);
            setLoginStatus(message);
          }
          else if (fnName === 'sw_getBootstrap' && !appState.user) {
            appState.token = '';
            sessionStorage.removeItem('salesWorkflowToken');
            showLogin();
            setLoginStatus(message);
          }
          else setStatus(message, true);
        });
      runner[fnName].apply(runner, callArgs);
    }

    function beginMainRequest(view) {
      appState.mainRequestId += 1;
      appState.view = view;
      return appState.mainRequestId;
    }

    function isCurrentMainRequest(requestId, view) {
      return requestId === appState.mainRequestId && appState.view === view;
    }

    function init() {
      appState.token = sessionStorage.getItem('salesWorkflowToken') || '';
      if (!appState.token) {
        showLogin();
        return;
      }
      bootstrap();
    }

    function bootstrap() {
      var requestId = beginMainRequest('mine');
      serverCall('sw_getBootstrap', [], function (res) {
        showApp();
        appState.user = res.user;
        renderUser(res);
        if (!isCurrentMainRequest(requestId, 'mine')) return;
        appState.view = 'mine';
        setActiveTab(appState.view);
        renderViewHeader(appState.view);
        renderTasks(res.tasks || []);
        if (res.message) setStatus(res.message);
      });
    }

    function showLogin() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
      setLoginBusy(false);
      setLoginStatus('');
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = '';
    }

    function login() {
      if (appState.busy) return;
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      setLoginBusy(true);
      setLoginStatus('Signing in');
      serverCall('sw_login', [email, password], function (res) {
        setLoginStatus('Opening dashboard');
        appState.token = res.token || '';
        appState.user = res.user || null;
        sessionStorage.setItem('salesWorkflowToken', appState.token);
        showApp();
        renderUser({
          user: appState.user || {},
          views: clientViewsForUser(appState.user || {})
        });
        document.getElementById('taskList').innerHTML = '<div class="loading">LOADING TASKS</div>';
        bootstrap();
      }, 'Signing in');
    }

    function clientViewsForUser(user) {
      user = user || {};
      return {
        mine: true,
        calendar: true,
        inStockDiamonds: true,

    function calendarDays(monthKey, appointments, todayKey) {
      var first = monthDate(monthKey);
      var start = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
      var byDate = {};
      (appointments || []).forEach(function (appt) {
        if (!byDate[appt.dateKey]) byDate[appt.dateKey] = [];
        byDate[appt.dateKey].push(appt);
      });
      var days = [];
      for (var i = 0; i < 42; i++) {
        var date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        var key = dateKey(date);
        days.push({
          dateKey: key,
          dayNumber: date.getDate(),
          inMonth: date.getMonth() === first.getMonth(),
          isToday: key === todayKey,
          appointments: byDate[key] || []
        });
      }
      return days;
    }

    function currentMonthKey() {
      var now = new Date();
      return now.getFullYear() + '-' + pad2(now.getMonth() + 1);
    }

    function currentDateKey() {
      return dateKey(new Date());
    }

    function monthDate(monthKey) {
      var parts = String(monthKey || currentMonthKey()).split('-');
      var year = Number(parts[0]) || new Date().getFullYear();
      var month = (Number(parts[1]) || (new Date().getMonth() + 1)) - 1;
      return new Date(year, month, 1);
    }

    function dateKey(date) {
      return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function renderTasks(tasks) {
      var list = document.getElementById('taskList');
      if (!tasks.length) {
        list.innerHTML = emptyTaskHtml();
        return;
      }
      list.innerHTML = tasks.map(function (task) {
        var overdue = /^Overdue/.test(task.dueLabel || '');
        var coverage = task.coverageReason ? '<span class="badge">' + escapeHtml(task.coverageReason) + '</span>' : '';
        return [
          '<article class="task-card ' + (overdue ? 'overdue' : '') + '">',
            '<div class="task-top">',
              '<div>',
                '<div class="task-title">' + escapeHtml(task.taskTitle || task.taskType) + '</div>',
                '<div class="meta">' + escapeHtml(task.customerName || 'No customer') + ' · ' + escapeHtml(task.visitDate || 'No date') + ' ' + escapeHtml(task.visitTime || '') + '</div>',
                '<div class="meta">Owner: ' + escapeHtml(task.currentOwner || 'Unassigned') + '</div>',
              '</div>',
              '<div class="meta">' + escapeHtml(task.dueLabel || '') + '</div>',
            '</div>',
            '<span class="badge">' + escapeHtml(task.lifecycleStage || task.ownerRole || '') + '</span>',
            coverage,
            '<div class="actions">',
              '<button class="primary js-open-task" type="button" data-task-id="' + escapeAttrValue(task.taskId) + '">Open</button>',

    function emptyTaskHtml() {
      var user = appState.user || {};
      var title = 'No tasks here';
      var message = 'Your queue is clear for this view.';
      if (appState.view === 'mine' && user.isDiamondOrderAdmin) {
        title = 'No diamond admin tasks';
        message = 'Order, delivery, and return tasks appear when the 200_ diamond tracker has Proposing, On the Way, or due-return diamonds for Diamond Viewing appointments. Run Generate Tasks after tracker updates.';
      } else if (appState.view === 'mine' && user.isDiamondOrderAssistant) {
        title = 'No diamond assistant tasks';
        message = 'Tracking and return tasks appear when diamonds are On the Way or have return decisions due soon. Run Generate Tasks after tracker updates.';
      }
      return '<div class="empty"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(message) + '</p></div>';
    }

    function openTask(taskId) {
      appState.selectedTaskId = taskId;
      appState.detailRequestId += 1;
      var detailRequestId = appState.detailRequestId;
      var mainRequestId = appState.mainRequestId;
      document.getElementById('detailPanel').innerHTML = '<div class="loading">LOADING</div>';
      serverCall('sw_getTaskDetail', [taskId], function (res) {
        if (detailRequestId !== appState.detailRequestId ||
            mainRequestId !== appState.mainRequestId ||
            appState.selectedTaskId !== taskId) return;
        appState.detail = res;
        renderDetail(res);
      });
    }

    function renderDetail(res) {
      var task = res.task || {};
      var missing = (res.missingFields || []).length
        ? '<div class="error">Missing template fields: ' + escapeHtml(res.missingFields.join(', ')) + '</div>'
        : '';
      var template = res.renderedTemplate
        ? '<div class="detail-section"><label>Template</label><div class="template-box" id="renderedTemplate">' + escapeHtml(res.renderedTemplate) + '</div><div class="actions"><button class="js-copy-template" type="button">Copy Template</button></div>' + missing + '</div>'
        : '';
      var attachments = renderAttachments(res.attachments || (res.attachment && res.attachment.url ? [res.attachment] : []));
      var checklist = renderChecklist(res.checklist || []);
      var diamondControls = renderDiamondControls(task, res);
      var textArea = renderCompletionTextArea(task, res);
      var claim = res.canClaim ? '<button class="js-claim-task" type="button">Claim Task</button>' : '';
      var complete = res.canComplete ? '<button class="primary js-complete-task" type="button">' + escapeHtml(task.primaryAction || 'Complete') + '</button>' : '';
      var admin = res.canAdmin ? renderAdminForm(task) : '';

      document.getElementById('detailPanel').innerHTML = [
        '<div class="panel-header">',
          '<div class="eyebrow">' + escapeHtml(task.lifecycleStage || 'Task Detail') + '</div>',
          '<h2>' + escapeHtml(task.taskTitle || task.taskType || '') + '</h2>',
        '</div>',
        '<div class="detail-body">',
          '<div class="detail-section">',
            '<div class="meta">' + escapeHtml(task.customerName || '') + '</div>',
            '<div class="meta">' + escapeHtml(task.visitDate || '') + ' ' + escapeHtml(task.visitTime || '') + '</div>',
            '<div class="meta">Current owner: ' + escapeHtml(task.currentOwner || 'Unassigned') + '</div>',
            task.coverageReason ? '<div class="error">' + escapeHtml(task.coverageReason) + '</div>' : '',
          '</div>',
          '<div class="detail-section"><label>Instructions</label><div>' + escapeHtml(task.instructions || 'No instructions provided.') + '</div></div>',
          template,
          attachments,
          diamondControls,
          checklist,
          textArea,
          '<div class="actions">' + claim + complete + '</div>',
          admin,
        '</div>'
      ].join('');
      updateCompleteButtonState();
    }

    function renderAttachments(attachments) {
      attachments = attachments || [];
      if (!attachments.length) return '';
      return [
        '<div class="detail-section">',
          '<label>Attachments</label>',
          '<div class="attachment-list">',
            attachments.map(function (attachment) {
              var preview = isImageUrl(attachment.url) ? '<img class="attachment-image" src="' + escapeHref(attachment.url) + '" alt="">' : '';
              return '<div class="attachment-row"><a href="' + escapeHref(attachment.url) + '" target="_blank">' + escapeHtml(attachment.label || attachment.url) + '</a>' + preview + '</div>';
            }).join(''),
          '</div>',
        '</div>'
      ].join('');
    }

    function renderChecklist(items) {
      if (!items.length) return '';
      return [
        '<div class="detail-section">',
          '<label>Checklist</label>',
          '<div class="checklist">',
            items.map(function (item) {
              var required = item.required === false ? '' : ' data-required-checklist="1"';
              return '<div class="check-row"><input type="checkbox" id="check-' + escapeAttr(item.id) + '"' + required + '><span>' + escapeHtml(item.label || item.id) + (item.required === false ? '' : ' *') + '</span></div>';

          '</div>',
        '</div>'
      ].join('');
    }

      var payload = res.payload || {};
      var extra = payload.extra || {};
      var diamond = extra.diamond || {};
      var rows = diamond.rows || [];
      if (!isDiamondTask(task.taskType)) return '';

      var quoteButtons = '';
      if (task.taskType === 'PREPARE_DV_QUOTATION') {
        quoteButtons = [
          '<div class="detail-section">',
            '<label>Quotation Refresh</label>',
            '<div class="actions">',
              '<button class="js-refresh-diamond-quote" type="button" data-mode="diamonds">Refresh Diamonds</button>',
              '<button class="js-refresh-diamond-quote" type="button" data-mode="settings">Refresh 3D</button>',

          '<div class="field-grid" style="margin-top:14px"><div><label for="orderedDate">Purchased / Ordered Date</label><input id="orderedDate" type="date" value="' + escapeAttrValue(currentDateKey()) + '"></div></div></div>';
      }

      if (task.taskType === 'TRACK_DIAMONDS') {
        return quoteButtons + [
          '<div class="detail-section">',
            '<label>Tracking Update</label>',
            '<div class="field-grid">',
              '<div><label for="trackingEta">Tracking ETA</label><input id="trackingEta" type="date"></div>',
              '<div><label for="trackingStatus">Tracking Status</label><select id="trackingStatus"><option value="">Select status</option><option>On time</option><option>Delayed</option><option>Unavailable</option><option>Cancelled</option><option>Concerning</option></select></div>',
              '<div><label for="carrier">Carrier</label><input id="carrier"></div>',
              '<div><label for="trackingNumber">Tracking Number</label><input id="trackingNumber"></div>',

          '</div>'

      }

      if (task.taskType === 'RECORD_DIAMOND_DECISIONS') {

          renderStoneDecisionRows(rows) +
          '<div class="template-box" style="margin-top:14px" id="manufacturingMessage">' + escapeHtml(extra.manufacturingMessage || '') + '</div>' +
          '<div class="actions"><button class="js-copy-manufacturing" type="button">Copy Manufacturing Message</button></div></div>';
      }

      if (task.taskType === 'RETURN_DIAMONDS') {
        return quoteButtons + '<div class="detail-section"><label>Return Queue</label><div class="template-box">Completing this task marks the listed rows in 200_ as Return in Progress and writes return notes with the completion time.</div>' + renderReadonlyDiamondRows(diamond.returnRows || []) + '</div>';
      }

      return [
        '<div class="detail-section">',
          '<label>Proposed Diamonds</label>',
          '<div class="template-box">Add proposed diamonds here. Use the In-Stock Diamonds tab first if you want to select store inventory and confirm the return date works for this appointment. Completing this task uses the same Sheet 100 proposal flow: it validates the stones, inserts them into 200_, updates Sheet 100 diamond counts/status, and keeps the appointment context tied to this customer.</div>',

    function proposalSelectHtml(name, label, options) {
      return '<div><label>' + escapeHtml(label) + '</label><select class="proposal-field" data-field="' + escapeAttrValue(name) + '">' +
        '<option value="">Select</option>' +
        (options || []).filter(function (option) { return option !== ''; }).map(function (option) {
          return '<option value="' + escapeAttrValue(option) + '">' + escapeHtml(option) + '</option>';
        }).join('') +
        '</select></div>';
    }

    function proposalInputHtml(name, label, type, step) {
      return '<div><label>' + escapeHtml(label) + '</label><input class="proposal-field" data-field="' + escapeAttrValue(name) + '" type="' + escapeAttrValue(type || 'text') + '"' + (step ? ' step="' + escapeAttrValue(step) + '"' : '') + '></div>';

    function addProposalRow() {
      var container = document.getElementById('proposalRows');
      if (!container) return;
      var index = container.querySelectorAll('.proposal-row').length;
      container.insertAdjacentHTML('beforeend', proposalRowHtml(index));
      updateProposalRowNumbers();
      updateCompleteButtonState();
    }

    function removeProposalRow(button) {
      var row = button ? button.closest('.proposal-row') : null;
      if (row) row.parentNode.removeChild(row);
      updateProposalRowNumbers();
      updateCompleteButtonState();
    }

    function updateProposalRowNumbers() {
      [].slice.call(document.querySelectorAll('.proposal-row')).forEach(function (row, i) {
        row.setAttribute('data-proposal-row', String(i));
        var heading = row.querySelector('h3');
        if (heading) heading.textContent = 'Diamond ' + (i + 1);
      });
    }

    function renderOrderDecisionRows(rows) {
      var proposing = (rows || []).filter(function (row) { return norm(row.orderStatus) === 'proposing'; });
      if (!proposing.length) return '<div class="empty">No proposed stones are currently in the task snapshot.</div>';
      return '<div class="mini-table">' + proposing.map(function (row) {
        return '<div class="mini-row three" data-row-index="' + escapeAttrValue(row.rowIndex) + '">' +
          '<div><strong>' + escapeHtml(diamondLabel(row)) + '</strong><div class="meta">' + escapeHtml(row.vendor || '') + '</div></div>' +
          '<select class="diamond-order-decision"><option value="">Select decision</option><option>On the Way</option><option>Not Approved</option></select>' +
          '<div class="meta">Row ' + escapeHtml(row.rowIndex || '') + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function renderStoneDecisionRows(rows) {
      var delivered = (rows || []).filter(function (row) {
        return norm(row.orderStatus) === 'delivered' || norm(row.stoneStatus).indexOf('in stock') >= 0;
      });
      if (!delivered.length) return '<div class="empty">No delivered stones are currently in the task snapshot.</div>';
      return '<div class="mini-table">' + delivered.map(function (row) {
        return '<div class="mini-row three" data-row-index="' + escapeAttrValue(row.rowIndex) + '">' +
          '<div><strong>' + escapeHtml(diamondLabel(row)) + '</strong><div class="meta">' + escapeHtml(row.measurement || '') + '</div></div>' +
          '<select class="diamond-stone-decision"><option value="">No change</option><option>Purchase</option><option>Return</option></select>' +
          '<label class="meta"><input class="diamond-hold" type="checkbox"> Hold</label>' +
        '</div>';
      }).join('') + '</div>';
    }

    function renderReadonlyDiamondRows(rows) {
      rows = rows || [];
      if (!rows.length) return '<div class="empty">No matching diamonds are currently in the task snapshot.</div>';
      return '<div class="mini-table">' + rows.map(function (row) {
        return '<div class="mini-row">' +
          '<div><strong>' + escapeHtml(diamondLabel(row)) + '</strong><div class="meta">' + escapeHtml([row.orderStatus, row.stoneStatus, row.decision].filter(Boolean).join(' | ')) + '</div></div>' +
          '<div class="meta">' + escapeHtml(row.returnDueDate || row.trackingEta || ('Row ' + (row.rowIndex || ''))) + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function diamondLabel(row) {
      return [row.shape, row.carat ? row.carat + 'ct' : '', row.color, row.clarity, row.certNo ? 'Cert ' + row.certNo : ''].filter(Boolean).join(' | ') || ('Row ' + (row.rowIndex || ''));
    }

    function isDiamondTask(taskType) {
      return [
        'PROPOSE_DIAMONDS',
        'PREPARE_DV_QUOTATION',
        'ORDER_DIAMONDS',
        'TRACK_DIAMONDS',
        'CONFIRM_DIAMOND_DELIVERY',
        'RECORD_DIAMOND_DECISIONS',
        'RETURN_DIAMONDS',
        'ACK_DIAMONDS_ORDERED_ASSIGNED_REP',
        'ACK_DIAMONDS_ORDERED_JOC',
        'REVIEW_DIAMOND_ETA_ASSIGNED_REP',
        'REVIEW_DIAMOND_ETA_JOC'
      ].indexOf(taskType) >= 0;
    }

    function norm(value) {
      return String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function renderCompletionTextArea(task, res) {
      if (task.taskType === 'PROCESS_APPOINTMENT_DATA') {
        return '<div class="detail-section"><label>Recap Draft</label><textarea id="completionText"></textarea></div>';
      }
      if (task.taskType === 'APPROVE_RECAP_MESSAGE') {
        var draft = ((res.payload || {}).extra || {}).recapDraft || res.renderedTemplate || '';
        return '<div class="detail-section"><label>Approved Recap Text</label><textarea id="completionText">' + escapeHtml(draft) + '</textarea></div>';
      }
      return '';
    }

    function renderAdminForm(task) {
      return [
        '<div class="detail-section">',
          '<label>Admin Reassign</label>',
          '<div class="admin-form">',
            '<input id="adminOwnerName" placeholder="Owner name">',
            '<input id="adminOwnerEmail" placeholder="Owner email">',
            '<input id="adminReason" placeholder="Reason">',
            '<button class="js-admin-reassign" type="button">Reassign</button>',
            '<button class="js-admin-block" type="button">Block</button>',
            '<button class="js-admin-unblock" type="button">Unblock</button>',
          '</div>',
        '</div>'
      ].join('');
    }

    function openUserAdminPanel() {
      document.getElementById('detailPanel').innerHTML = '<div class="loading">LOADING</div>';
      serverCall('sw_adminListWorkflowUsers', [], function (res) {
        appState.userAdmin = res;
        renderUserAdminPanel(res);
      }, 'Loading users');
    }

      var roles = res.roleOptions || [];
      var users = res.users || [];
      document.getElementById('detailPanel').innerHTML = [
        '<div class="panel-header">',
          '<div class="eyebrow">Admin</div>',
          '<h2>Workflow Users</h2>',
        '</div>',
        '<div class="detail-body">',
          '<div class="detail-section">',
            '<label>Add or Update User</label>',
            '<div class="field-grid">',
              '<div><label for="userAdminEmail">Email</label><input id="userAdminEmail" type="email"></div>',
              '<div><label for="userAdminName">Name</label><input id="userAdminName"></div>',
              '<div><label for="userAdminPassword">Password</label><input id="userAdminPassword" type="text" placeholder="Leave blank to auto-generate"></div>',
              '<div class="actions"><button class="js-admin-generate-password" type="button">Generate Password</button></div>',
              '<div><label>Role Access</label><div class="role-grid">' + renderRoleOptions(roles) + '</div></div>',

            '<div class="login-status" id="userAdminStatus"></div>',
          '</div>',
          '<div class="detail-section">',

    function renderRoleOptions(roles) {
      return (roles || []).map(function (role) {

            '<input class="user-role-option" type="checkbox" value="' + escapeAttrValue(role.value) + '">',
            '<span><strong>' + escapeHtml(role.label || role.value) + '</strong><span class="meta">' + escapeHtml(role.description || '') + '</span></span>',
          '</label>'
        ].join('');
      }).join('');
    }

    function renderWorkflowUserRow(user) {
      return '<div class="mini-row three">' +
        '<div><strong>' + escapeHtml(user.name || user.email) + '</strong><div class="meta">' + escapeHtml(user.email || '') + '</div></div>' +
        '<div class="meta">' + escapeHtml(user.roles || '') + '</div>' +
        '<div class="meta">' + escapeHtml(user.active || '') + (user.passwordSet ? ' · Password set' : ' · No password') + '</div>' +
      '</div>';
    }

    function fillGeneratedUserPassword() {
      var el = document.getElementById('userAdminPassword');
      if (el) el.value = clientGeneratedPassword();
    }

    function saveWorkflowUser() {
      var status = document.getElementById('userAdminStatus');
      if (status) status.textContent = '';
      var payload = {
        email: valueOf('userAdminEmail'),
        name: valueOf('userAdminName'),
        password: valueOf('userAdminPassword'),
        notes: valueOf('userAdminNotes'),
        roles: [].slice.call(document.querySelectorAll('.user-role-option:checked')).map(function (el) { return el.value; })
      };
      serverCall('sw_adminUpsertWorkflowUser', [payload], function (res) {
        var message = 'Saved ' + (res.email || payload.email) + '. Password: ' + (res.password || payload.password || 'unchanged');
        if (status) status.textContent = message;
        setStatus('Workflow user saved');
        serverCall('sw_adminListWorkflowUsers', [], function (list) {
          appState.userAdmin = list;
          renderUserAdminPanel(list);
          var nextStatus = document.getElementById('userAdminStatus');
          if (nextStatus) nextStatus.textContent = message;
        });
      }, 'Saving user');
    }

    function clientGeneratedPassword() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
      var out = '';
      for (var i = 0; i < 14; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    function completionPayload() {
      var detail = appState.detail || {};
      var task = detail.task || {};
      var payload = { checklist: {} };
      (detail.checklist || []).forEach(function (item) {
        var el = document.getElementById('check-' + item.id);
        payload.checklist[item.id] = !!(el && el.checked);
      });
      var text = document.getElementById('completionText');
      if (text && task.taskType === 'PROCESS_APPOINTMENT_DATA') payload.recapText = text.value;
      if (text && task.taskType === 'APPROVE_RECAP_MESSAGE') payload.approvedText = text.value;
      if (task.taskType === 'PROPOSE_DIAMONDS') {
        payload.proposalStones = collectProposalStones();
      }
      if (task.taskType === 'ORDER_DIAMONDS') {
        payload.orderedDate = valueOf('orderedDate');
        payload.diamondOrderDecisions = [].slice.call(document.querySelectorAll('.diamond-order-decision')).map(function (select) {
          var row = select.closest('.mini-row');
          return { rowIndex: row ? row.getAttribute('data-row-index') : '', decision: select.value };
        });
      }
      if (task.taskType === 'TRACK_DIAMONDS') {
        payload.trackingEta = valueOf('trackingEta');
        payload.trackingStatus = valueOf('trackingStatus');
        payload.carrier = valueOf('carrier');
        payload.trackingNumber = valueOf('trackingNumber');
        payload.trackingUrl = valueOf('trackingUrl');
        payload.trackingNotes = valueOf('trackingNotes');
      }
      if (task.taskType === 'CONFIRM_DIAMOND_DELIVERY') {
        payload.memoDate = valueOf('memoDate');
      }
      if (task.taskType === 'RECORD_DIAMOND_DECISIONS') {
        payload.diamondDecisions = [].slice.call(document.querySelectorAll('.diamond-stone-decision')).map(function (select) {
          var row = select.closest('.mini-row');
          var hold = row ? row.querySelector('.diamond-hold') : null;
          return { rowIndex: row ? row.getAttribute('data-row-index') : '', decision: select.value, hold: !!(hold && hold.checked) };
        }).filter(function (item) { return item.decision; });
      }
      return payload;
    }

    function collectProposalStones() {
      return [].slice.call(document.querySelectorAll('.proposal-row')).map(function (row) {
        var stone = {};
        [].slice.call(row.querySelectorAll('.proposal-field')).forEach(function (field) {
          stone[field.getAttribute('data-field')] = field.value;
        });
        return stone;
      }).filter(function (stone) {
        return !!(stone.certNo || stone.shape || stone.carat || stone.vendor);
      });
    }

    function updateCompleteButtonState() {
      var button = document.querySelector('.js-complete-task');
      if (!button) return;
      var detail = appState.detail || {};
      var task = detail.task || {};
      var disabled = false;
      (detail.checklist || []).forEach(function (item) {
        if (item.required === false) return;
        var el = document.getElementById('check-' + item.id);
        if (!el || !el.checked) disabled = true;
      });
      if (task.taskType === 'ORDER_DIAMONDS') {
        var selects = [].slice.call(document.querySelectorAll('.diamond-order-decision'));
        if (selects.length && selects.some(function (select) { return !select.value; })) disabled = true;
      }
      if (task.taskType === 'PROPOSE_DIAMONDS' && !collectProposalStones().length) {
        disabled = true;
      }
      button.disabled = disabled;
      button.title = disabled ? 'Complete required checklist items and diamond decisions first.' : '';
    }

    function valueOf(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    function completeTask() {
      if (!appState.selectedTaskId) return;
      serverCall('sw_completeTask', [appState.selectedTaskId, completionPayload()], function () {
        setStatus('Task completed');
        loadTasks(appState.view);
        appState.selectedTaskId = '';
        document.getElementById('detailPanel').innerHTML = '<div class="panel-header"><div class="eyebrow">Task Detail</div><h2>Select a task</h2></div><div class="empty">Open a task to see instructions, message templates, attachments, and completion controls.</div>';
      });
    }

    function claimTask() {
      if (!appState.selectedTaskId) return;
      serverCall('sw_claimTask', [appState.selectedTaskId], function () {
        setStatus('Task claimed');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function adminReassign() {
      if (!appState.selectedTaskId) return;
      var name = document.getElementById('adminOwnerName').value;
      var email = document.getElementById('adminOwnerEmail').value;
      var reason = document.getElementById('adminReason').value;
      serverCall('sw_adminReassignTask', [appState.selectedTaskId, name, email, reason], function () {
        setStatus('Task reassigned');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function adminBlock() {
      if (!appState.selectedTaskId) return;
      var reason = document.getElementById('adminReason').value || 'Admin blocked';
      serverCall('sw_adminBlockTask', [appState.selectedTaskId, reason], function () {
        setStatus('Task blocked');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function adminUnblock() {
      if (!appState.selectedTaskId) return;
      var reason = document.getElementById('adminReason').value || '';
      serverCall('sw_adminUnblockTask', [appState.selectedTaskId, reason], function () {
        setStatus('Task unblocked');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function generateTasks() {
      setStatus('Generating tasks. This can take a minute on the first run.');
      serverCall('sw_generateSalesWorkflowTasks', [], function (res) {
        setStatus('Generated: ' + (res.created || 0) + ' created, ' + (res.updated || 0) + ' updated');
        loadTasks(appState.view);
      }, 'Generating tasks. This can take a minute on the first run.');
    }

    function refreshOwners() {
      setStatus('Refreshing task owners.');
      serverCall('sw_refreshTaskOwners', [], function (res) {
        setStatus('Owners refreshed: ' + (res.updated || 0) + ' updated');
        loadTasks(appState.view);
      }, 'Refreshing task owners.');
    }

    function copyTemplate() {
      var text = document.getElementById('renderedTemplate');
      if (!text) return;
      navigator.clipboard.writeText(text.textContent || '').then(function () {
        setStatus('Template copied');
        if (appState.selectedTaskId) {
          google.script.run.sw_logTemplateCopied(appState.token, appState.selectedTaskId);
        }
      }, function () {
        setStatus('Copy failed. Select the template text manually.', true);
      });
    }

    function copyManufacturingMessage() {
      var text = document.getElementById('manufacturingMessage');
      if (!text) return;
      navigator.clipboard.writeText(text.textContent || '').then(function () {
        setStatus('Manufacturing message copied');
      }, function () {
        setStatus('Copy failed. Select the manufacturing message manually.', true);
      });
    }

    function refreshDiamondQuote(mode) {
      if (!appState.selectedTaskId) return;
      var fn = mode === 'diamonds' ? 'sw_refreshDiamondQuoteFromTracking' :
        mode === 'settings' ? 'sw_refreshDiamondQuoteFrom3D' : 'sw_refreshDiamondQuoteAll';
      serverCall(fn, [appState.selectedTaskId], function (res) {
        setStatus('Quotation refreshed');
        openTask(appState.selectedTaskId);
      }, 'Refreshing quotation');
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/\s+/g, '_');
    }

    function escapeAttrValue(value) {
      return escapeHtml(value);
    }

    function escapeHref(value) {
      return escapeHtml(value);
    }

    function isImageUrl(value) {
      return /\.(png|jpe?g|gif|webp)(\?|#|$)/i.test(String(value || ''));
    }

    bindEvents();
    init();
  </script>
</body>
</html>
