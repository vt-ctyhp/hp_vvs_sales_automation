    function employeeSchedulePersonOptions(people) {
      var tags = ['<option value="">Select employee</option>'];
      (people || []).forEach(function (person) {
        if (!person || !person.name) return;
        tags.push('<option value="' + escapeAttrValue(person.name) + '">' + escapeHtml(person.name) + '</option>');
      });
      return tags.join('');
    }

    function employeeScheduleHasRole(role, target) {
      return String(role || '').split(/[,\n;]/).some(function (item) {
        return norm(item) === norm(target);
      });
    }

    function setEmployeeScheduleFilter(filter) {
      appState.employeeScheduleFilter = filter || 'all';
      applyEmployeeScheduleFilter(appState.employeeScheduleFilter);
    }

    function applyEmployeeScheduleFilter(filter) {
      filter = filter || 'all';
      var shell = document.querySelector('.schedule-shell');
      if (!shell) return;
      shell.setAttribute('data-schedule-filter', filter);
      Array.prototype.slice.call(shell.querySelectorAll('.js-schedule-filter')).forEach(function (button) {
        var active = (button.getAttribute('data-filter') || 'all') === filter;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function employeeScheduleInitials(value) {
      var parts = String(value || '').replace(/@.*/, '').split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function employeeScheduleAvatarColor(value) {
      var colors = ['#3F2F91', '#9B3D1F', '#0F6B56', '#1769AA', '#8A5A08', '#5946C6', '#437C17', '#7B2147', '#4B4A45', '#0D6F5A'];
      var text = String(value || '');
      var hash = 0;
      for (var i = 0; i < text.length; i++) hash = (hash + text.charCodeAt(i) * (i + 1)) % 997;
      return colors[hash % colors.length];
    }

    function selectedEmployeeScheduleChangeType() {
      var input = document.querySelector('input[name="scheduleChangeType"]:checked');
      return input ? input.value || 'Full-day off' : 'Full-day off';
    }

    function collectEmployeeSchedules() {
      var rows = Array.prototype.slice.call(document.querySelectorAll('.schedule-row'));
      return rows.map(function (row) {
        var days = {};
        Array.prototype.slice.call(row.querySelectorAll('.schedule-day')).forEach(function (input) {
          days[input.getAttribute('data-day') || ''] = !!input.checked;
        });
        var roles = Array.prototype.slice.call(row.querySelectorAll('.schedule-role')).filter(function (input) {
          return input.checked;
        }).map(function (input) {
          return input.getAttribute('data-role') || '';
        }).filter(Boolean);
        return {
          name: (row.querySelector('.schedule-name') || {}).value || '',
          email: (row.querySelector('.schedule-email') || {}).value || '',
          role: roles.join(','),
          active: !!((row.querySelector('.schedule-active') || {}).checked),
          days: days,
          defaultJoc: (row.querySelector('.schedule-default-joc') || {}).value || '',
          coverageEnabled: !!((row.querySelector('.schedule-coverage-enabled') || {}).checked),
          skills: {
            labDiamond: !!((row.querySelector('.schedule-skill-lab') || {}).checked),
            naturalDiamond: (row.querySelector('.schedule-skill-natural') || {}).value || 'None',
            generalAppointment: !!((row.querySelector('.schedule-skill-general') || {}).checked)
          },
          coveragePartner: (row.querySelector('.schedule-coverage-partner') || {}).value || ''
        };
      }).filter(function (person) {
        return String(person.name || '').trim();
      });
    }

    function saveEmployeeSchedules(sourceButton) {
      var payload = {
        people: collectEmployeeSchedules(),
        settings: {
          clientAdvisorRoundRobin: checkedOf('scheduleRoundRobin')
        }
      };
      serverCall('sw_adminSaveEmployeeSchedules', [payload], function (res) {
        appState.employeeSchedule = res.schedule || {};
        renderEmployeeSchedules(appState.employeeSchedule);
        renderEmployeeScheduleSummary(appState.employeeSchedule);
        setStatus('Schedules saved.');
      }, 'Saving schedules', sourceButton);
    }

    function addEmployeeScheduleRow() {
      var res = appState.employeeSchedule || {};
      if (!res.people) res.people = [];
      appState.employeeScheduleFilter = 'all';
      res.people.push({
        name: '',
        email: '',
        role: 'Client Advisor',
        active: true,
        coverageEnabled: true,
        defaultJoc: '',
        coveragePartner: '',
        skills: { labDiamond: false, naturalDiamond: 'None', generalAppointment: true },
        days: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: false, Sun: false }
      });
      renderEmployeeSchedules(res);
      renderEmployeeScheduleSummary(res);
    }

    function upsertEmployeeScheduleChange(sourceButton) {
      var person = findEmployeeSchedulePerson(valueOf('scheduleChangeEmployee'));
      var payload = {
        name: valueOf('scheduleChangeEmployee'),
        email: person.email || '',
        role: person.role || '',
        date: valueOf('scheduleChangeDate'),
        changeType: selectedEmployeeScheduleChangeType(),
        availableFrom: valueOf('scheduleChangeFrom'),
        availableUntil: valueOf('scheduleChangeUntil'),
        notes: valueOf('scheduleChangeNotes')
      };
      if (!payload.name || !payload.date) {
        setStatus('Select an employee and date for the schedule change.', true);
        return;
      }
      serverCall('sw_adminUpsertScheduleChange', [payload], function (res) {
        appState.employeeSchedule = res.schedule || {};
        renderEmployeeSchedules(appState.employeeSchedule);
        renderEmployeeScheduleSummary(appState.employeeSchedule);
        setStatus('Schedule change saved.');
      }, 'Saving schedule change', sourceButton);
    }

    function deleteEmployeeScheduleChange(sourceButton) {
      var name = sourceButton.getAttribute('data-name') || '';
      var date = sourceButton.getAttribute('data-date') || '';
      if (!name || !date) return;
      if (sourceButton.getAttribute('data-confirm') !== '1') {
        sourceButton.setAttribute('data-confirm', '1');
        sourceButton.textContent = 'Confirm';
        window.setTimeout(function () {
          if (sourceButton && sourceButton.getAttribute('data-confirm') === '1') {
            sourceButton.removeAttribute('data-confirm');
            sourceButton.textContent = 'x';
          }
        }, 4000);
        return;
      }
      serverCall('sw_adminDeleteScheduleChange', [name, date], function (res) {
        appState.employeeSchedule = res.schedule || {};
        renderEmployeeSchedules(appState.employeeSchedule);
        renderEmployeeScheduleSummary(appState.employeeSchedule);
        setStatus('Schedule change deleted.');
      }, 'Deleting schedule change', sourceButton);
    }

    function findEmployeeSchedulePerson(name) {
      var target = norm(name);
      var people = (appState.employeeSchedule || {}).people || [];
      for (var i = 0; i < people.length; i++) {
        if (norm(people[i].name) === target) return people[i];
      }
      return {};
    }

    function adminFilterObjectOptionTags(options, selected) {
      var tags = [];
      (options || []).forEach(function (option) {
        var value = String((option && option.value) || '');
        var label = String((option && option.label) || value);
        tags.push('<option value="' + escapeAttrValue(value) + '"' + (value === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>');
      });
      return tags.join('');
    }

    function adminFilterOptionTags(options, selected, emptyLabel) {
      var seen = {};
      var tags = ['<option value="">' + escapeHtml(emptyLabel || 'All') + '</option>'];
      (options || []).forEach(function (option) {
        var value = String(option || '');
        var key = norm(value);
        if (!value || seen[key]) return;
        seen[key] = true;
        tags.push('<option value="' + escapeAttrValue(value) + '"' + (norm(value) === norm(selected) ? ' selected' : '') + '>' + escapeHtml(value) + '</option>');
      });
      return tags.join('');
    }

    function loadCustomerSearch(filters, preserveDetail) {
      var requestId = beginMainRequest('customerSearch');
      var current = appState.customerSearch || {};
      filters = filters || current.filters || defaultCustomerSearchFilters();
      filters.activeOnly = filters.activeOnly !== false;
      appState.customerSearch.filters = filters;
      appState.customerSearch.query = filters.query || '';
      setActiveTab('customerSearch');
      renderViewHeader('customerSearch');
      document.getElementById('taskList').innerHTML = '<div class="loading">LOADING CUSTOMER SEARCH</div>';
      if (!preserveDetail) {
        appState.customerSearch.detail = null;
        appState.customerSearch.selectedRoot = '';
        hideCustomerSearchWorkspace();
      }
      serverCall('sw_searchCustomers', [filters.query || '', filters], function (res) {
        if (!isCurrentMainRequest(requestId, 'customerSearch')) return;
        appState.customerSearch.result = res || {};
        appState.customerSearch.filters = (res && res.filters) || filters;
        renderCustomerSearch(res || {});
      }, 'Searching customers');

      };

    function customerLatestStatusLog(logs) {

      for (var i = 0; i < logs.length; i++) {

      }

    function customerLastTouchMeta(card, logs) {
      var log = customerLatestStatusLog(logs || []);
      var raw = (log && log.eventAt) || card.updatedAt || card.lastPaymentDate || card.lastVisit || '';
      var date = customerDateFromValue(raw);
      if (!date) return { label: raw || 'Unavailable', stale: false };
      var today = new Date();
      var startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      var startDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      var days = Math.floor((startToday.getTime() - startDate.getTime()) / 86400000);
      if (days < 0) return { label: customerDisplayDate(raw), stale: false };
      if (days === 0) return { label: 'today', stale: false };
      return { label: days + ' days ago', stale: days >= 30 };
    }

    function customerDisplayDate(value) {
      var date = customerDateFromValue(value);
      if (!date) return String(value || '');
      return String(date.getMonth() + 1) + '/' + String(date.getDate());
    }

    function customerDateFromValue(value) {
      var s = String(value || '').trim();
      if (!s) return null;
      var iso = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      var mdy = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);
      if (mdy) {
        var y = Number(mdy[3]);
        if (y < 100) y += 2000;
        return new Date(y, Number(mdy[1]) - 1, Number(mdy[2]));
      }
      var parsed = new Date(s);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function customerSearchIndividualNames(options) {
      var seen = {};
      var out = [];
      (options || []).forEach(function (option) {
        String(option || '').split(/\s*(?:\/|,|;|\+|&|\band\b)\s*/i).forEach(function (part) {
          part = part.trim();
          var key = norm(part);
          if (!part || seen[key]) return;
          seen[key] = true;
          out.push(part);
        });
      });
      out.sort(function (a, b) { return a.localeCompare(b); });
      return out;
    }

    function uniqueStockFilterValues(rows, field, gradeOrder) {
      var seen = {};
      var values = [];
      (rows || []).forEach(function (row) {
        var value = String(row && row[field] || '').trim();
        var key = norm(value);
        if (!value || seen[key]) return;
        seen[key] = true;
        values.push(value);
      });
      if (gradeOrder && gradeOrder.length) {
        var gradeRank = {};
        gradeOrder.forEach(function (grade, index) {
          gradeRank[String(grade).toUpperCase()] = index;
        });
        values.sort(function (a, b) {
          var ai = gradeRank[String(a).toUpperCase()];
          var bi = gradeRank[String(b).toUpperCase()];
          if (ai == null && bi == null) return String(a).localeCompare(String(b));
          if (ai == null) return 1;
          if (bi == null) return -1;
          return ai - bi || String(a).localeCompare(String(b));
        });
        return values;
      }
      return values.sort(function (a, b) { return String(a).localeCompare(String(b)); });
    }

    function hasActiveInStockDiamondFilters(filters) {

    function filteredInStockDiamondRows(rows) {
      var filters = currentInStockDiamondFilters();
      var caratMin = stockCaratNumber(filters.caratMin);
      var caratMax = stockCaratNumber(filters.caratMax);
      return (rows || []).filter(function (row) {
        if (filters.shape && norm(row.shape) !== norm(filters.shape)) return false;
        if (filters.color && norm(row.color) !== norm(filters.color)) return false;
        if (filters.clarity && norm(row.clarity) !== norm(filters.clarity)) return false;
        if (!isNaN(caratMin) || !isNaN(caratMax)) {
          var carat = stockCaratNumber(row.carat);
          if (isNaN(carat)) return false;
          if (!isNaN(caratMin) && carat < caratMin) return false;
          if (!isNaN(caratMax) && carat > caratMax) return false;
        }
        return true;
      });
    }

    function stockCaratNumber(value) {
      var match = String(value || '').replace(/,/g, '').match(/\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : NaN;
    }

    function calendarDays(monthKey, appointments, todayKey) {
      var first = monthDate(monthKey);
      var start = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
      var byDate = {};
      (appointments || []).forEach(function (appt) {
        if (!byDate[appt.dateKey]) byDate[appt.dateKey] = [];
        byDate[appt.dateKey].push(appt);
      });
      var days = [];
      for (var i = 0; i < 42; i++) {
        var date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        var key = dateKey(date);
        days.push({
          dateKey: key,
          dayNumber: date.getDate(),
          inMonth: date.getMonth() === first.getMonth(),
          isToday: key === todayKey,
          appointments: byDate[key] || []
        });
      }
      return days;
    }

    function currentMonthKey() {
      var now = new Date();
      return now.getFullYear() + '-' + pad2(now.getMonth() + 1);
    }

    function currentDateKey() {
      return dateKey(new Date());
    }

    function monthDate(monthKey) {
      var parts = String(monthKey || currentMonthKey()).split('-');
      var year = Number(parts[0]) || new Date().getFullYear();
      var month = (Number(parts[1]) || (new Date().getMonth() + 1)) - 1;
      return new Date(year, month, 1);
    }

    function dateKey(date) {
      return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function formatCalendarTime(value) {
      var s = String(value == null ? '' : value).trim();
      if (!s) return '';
      var m12 = /^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*(AM|PM)$/i.exec(s);
      if (m12) {
        var hour12 = Number(m12[1]);
        if (!hour12) hour12 = 12;
        hour12 = ((hour12 - 1) % 12) + 1;
        return pad2(hour12) + ':' + m12[2] + ' ' + m12[3].toLowerCase();
      }
      var m24 = /^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?$/.exec(s);
      if (m24) {
        var hour24 = Number(m24[1]);
        var minute = Number(m24[2]);
        if (hour24 >= 0 && hour24 <= 23 && minute >= 0 && minute <= 59) {
          return pad2((hour24 % 12) || 12) + ':' + pad2(minute) + ' ' + (hour24 < 12 ? 'am' : 'pm');
        }
      }
      return s.replace(/:(\d{2})(\s*[AP]M)$/i, function (_match, _seconds, suffix) {
        return ' ' + suffix.trim().toLowerCase();
      }).replace(/\s*(AM|PM)$/i, function (_match, suffix) {
        return ' ' + suffix.toLowerCase();
      });
    }

    function taskBrandCode(brand) {
      var b = String(brand || '').trim().toUpperCase();
      if (!b) return '';
      if (b.normalize) b = b.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      b = b.replace(/[^A-Z0-9]+/g, ' ');
      if (/\bVVS\b/.test(b) || b.indexOf('VVS JEWELRY') >= 0) return 'VVS';
      if (/\bHP\b/.test(b) || b.indexOf('HPUSA') >= 0 || b.indexOf('HUNG PHAT') >= 0) return 'HP';
      return '';
    }

    }

      return '<div><label for="' + escapeAttrValue(id) + '">' + escapeHtml(label) + (required ? ' *' : '') + '</label><select id="' + escapeAttrValue(id) + '">' + optionTags(options, selected) + '</select></div>';

      return '<select class="' + escapeAttrValue(className) + '">' + optionTags(options, selected) + '</select>';
    }

    function optionTags(options, selected) {
      var seen = {};
      options = options && options.length ? options : [''];
      if (String(options[0] || '') !== '') options = [''].concat(options);
      return options.filter(function (option) {
        var key = String(option || '');
        if (seen[key]) return false;
        seen[key] = true;
        return true;
      }).map(function (option) {
        var v = String(option || '');
        return '<option value="' + escapeAttrValue(v) + '"' + (v === String(selected || '') ? ' selected' : '') + '>' + escapeHtml(v || 'Select') + '</option>';
      }).join('');
    }

    function dateInputValue(value) {
      value = String(value || '').trim();

      if (mdy) return mdy[3] + '-' + ('0' + mdy[1]).slice(-2) + '-' + ('0' + mdy[2]).slice(-2);
      return '';
    }

    function setProposalStep(step) {
      step = Math.max(1, Math.min(3, Number(step) || 1));
      var current = appState.proposalStep || 1;
      if (step > current) {
        for (var s = current; s < step; s++) {
          if (!canAdvanceProposalStep(s)) return;
        }
      }
      appState.proposalStep = step;
      updateProposalWorkspaceState();
      updateCompleteButtonState();
      var workspace = document.getElementById('taskWorkspace');
      if (workspace) workspace.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function canAdvanceProposalStep(step) {
      if (step === 1) {
        var missing = missingCustomerDiamondRequirements(collectCustomerDiamondRequirements());
        if (missing.length) {
          updateCustomerDiamondRequirementStatus(missing);
          setStatus('Complete required customer requirements before continuing: ' + missing.join(', ') + '.', true);
          return false;
        }
      }
      if (step === 2 && !collectProposalStones().length) {
        setStatus('Add at least one proposed diamond before review.', true);
        return false;
      }
      setStatus('');
      return true;
    }

    function updateProposalWorkspaceState() {
      if (!document.getElementById('taskWorkspace')) return;
      var step = Math.max(1, Math.min(3, appState.proposalStep || 1));
      appState.proposalStep = step;
      [].slice.call(document.querySelectorAll('.proposal-step')).forEach(function (el) {
        el.hidden = String(el.getAttribute('data-proposal-step')) !== String(step);
      });
      [].slice.call(document.querySelectorAll('.proposal-step-button')).forEach(function (button) {
        var n = Number(button.getAttribute('data-step') || 0);
        button.classList.toggle('active', n === step);
        button.classList.toggle('done', n < step);
      });
      var prev = document.querySelector('.js-proposal-prev');
      var next = document.querySelector('.js-proposal-next');
      var submit = document.querySelector('.js-complete-task');
      if (prev) {
        prev.style.display = step === 1 ? 'none' : '';
        prev.textContent = step === 2 ? 'Back To Requirements' : 'Back To Stones';
      }
      if (next) {
        next.style.display = step === 3 ? 'none' : '';
        next.textContent = step === 1 ? 'Continue To Stones' : 'Continue To Review';
        next.disabled = step === 1 ? !!missingCustomerDiamondRequirements(collectCustomerDiamondRequirements()).length :
          step === 2 ? !collectProposalStones().length : false;
      }
      if (submit) submit.style.display = step === 3 ? '' : 'none';
      updateProposalDynamicSummaries();
    }

    function updateProposalDynamicSummaries() {
      var requirements = collectCustomerDiamondRequirements();
      var stones = collectProposalStones();
      var footer = document.getElementById('proposalFooterStatus');
      if (footer) {
        footer.textContent = appState.proposalStep === 1
          ? 'Step 1 of 3: capture the customer brief and variety strategy.'
          : appState.proposalStep === 2
            ? stones.length + ' stone(s) added.'
            : stones.length + ' stone(s) ready to submit.';
      }
      updateProposalSummaryBlocks(requirements);
      updateProposalStoneStatus(stones);
      updateProposalReviewBlocks(requirements, stones);
    }

    function updateProposalSummaryBlocks(requirements) {
      [].slice.call(document.querySelectorAll('.js-proposal-summary-chips')).forEach(function (el) {
        el.innerHTML = proposalRequirementChipsHtml(requirements);
      });
      [].slice.call(document.querySelectorAll('.js-proposal-summary-brief')).forEach(function (el) {
        el.textContent = requirements.summary || 'No buying brief captured yet.';
      });
      [].slice.call(document.querySelectorAll('.js-proposal-summary-variety')).forEach(function (el) {
        el.textContent = proposalVarietyLabels(requirements.varietyFocus || []).join(' | ') || 'No variety strategy selected yet.';
      });
    }

    function updateProposalStoneStatus(stones) {
      var count = stones.length;
      var countEl = document.getElementById('proposalStoneCount');
      var hintEl = document.getElementById('proposalStoneHint');
      if (countEl) countEl.textContent = count;
      if (hintEl) hintEl.textContent = count >= 3 ? 'Target met for comparison.' : (3 - count) + ' more to reach the usual 3-stone comparison target.';
    }

    function updateProposalReviewBlocks(requirements, stones) {
      var stonesEl = document.getElementById('proposalReviewStones');
      if (stonesEl) stonesEl.innerHTML = renderProposalReviewStones(stones);
      var reviewFoot = document.getElementById('proposalReviewStoneFoot');
      if (reviewFoot) reviewFoot.textContent = stones.length + ' stone(s) added. Pricing is intentionally omitted until quote data is available.';
      var checklistNote = document.getElementById('proposalChecklistNote');
      if (checklistNote) {
        var missing = missingCustomerDiamondRequirements(requirements);
        checklistNote.textContent = missing.length ? 'Missing requirements: ' + missing.join(', ') + '.' : 'Requirements are complete.';
      }
    }

    function findProposalInventoryMatches(sourceButton) {
      var requirements = collectCustomerDiamondRequirements();
      var hasCriteria = requirements.stoneType || requirements.shape || requirements.caratMin || requirements.caratMax ||
        requirements.colorMin || requirements.colorMax || requirements.clarityMin || requirements.clarityMax;
      if (!hasCriteria) {
        setStatus('Enter at least a stone type, shape, carat, color, or clarity requirement before matching inventory.', true);
        return;
      }
      serverCall('sw_getInStockDiamonds', [], function (res) {
        var rows = (res && res.rows) || [];
        appState.proposalInventoryRows = rows;
        appState.proposalInventorySource = res || {};
        appState.proposalInventoryMatches = proposalInventoryMatches(rows, requirements);
        renderProposalInventoryResults(appState.proposalInventoryMatches || []);
        setStatus('Found ' + (appState.proposalInventoryMatches || []).length + ' matching in-stock diamond(s).');
      }, 'Finding matching diamonds', sourceButton);
    }

    function proposalInventoryMatches(rows, requirements) {
      requirements = normalizeCustomerDiamondRequirements(requirements);
      var detail = appState.detail || {};
      var task = detail.task || {};
      var payload = detail.payload || {};
      var appt = payload.appointment || {};
      var apptMs = proposalDateMs(task.visitDate || appt.visitDate || '');
      return (rows || []).filter(function (row) {
        if (!proposalStoneTypeMatches(row.stoneType, requirements.stoneType)) return false;
        if (!proposalTextMatches(row.shape, requirements.shape)) return false;
        if (!proposalNumberInRange(row.carat, requirements.caratMin, requirements.caratMax)) return false;
        if (!proposalQualityInRange(row.color, requirements.colorMin, requirements.colorMax, ['D', 'E', 'F', 'G', 'H', 'I', 'Fancy'])) return false;
        if (!proposalQualityInRange(row.clarity, requirements.clarityMin, requirements.clarityMax, ['FL', 'IF', 'VVS1', 'VVS2', 'VS1', 'VS2', 'SI1', 'SI2'])) return false;
        if (apptMs && row.returnDueDate) {
          var returnMs = proposalDateMs(row.returnDueDate);
          if (returnMs && returnMs < apptMs) return false;
        }
        return true;
      });
    }

    function renderProposalInventoryResults(matches) {
      matches = matches || [];
      var panel = document.getElementById('proposalInventoryResults');
      var list = document.getElementById('proposalInventoryList');
      var title = document.getElementById('proposalInventoryTitle');
      var summary = document.getElementById('proposalInventorySummary');
      var footer = document.getElementById('proposalInventoryFooter');
      if (!panel || !list || !title || !summary || !footer) return;
      panel.style.display = 'block';
      var sorted = sortProposalInventoryMatches(matches);
      title.textContent = sorted.length ? sorted.length + ' matching in-stock diamond(s)' : 'No matching in-stock diamonds';
      summary.textContent = proposalInventorySummaryText(collectCustomerDiamondRequirements());
      if (!sorted.length) {
        list.innerHTML = '<div class="empty"><h3>No matching in-stock diamonds</h3><p>Adjust the customer requirements or add a proposal diamond manually below.</p></div>';
        footer.style.display = 'none';
        return;
      }
      footer.style.display = 'flex';
      list.innerHTML = sorted.map(renderProposalInventoryRow).join('');
      updateProposalInventorySelection();
    }

      var mainMeta = [

        row.vendor ? 'Vendor ' + row.vendor : '',

      ].filter(Boolean).join(' | ');

            '<div class="meta">' + escapeHtml(mainMeta) + '</div>',
          '</div>',
          proposalInventoryCell('Type', typeLabel),
          proposalInventoryCell('Carat', row.carat || ''),

    function proposalInventoryCell(label, value) {
      return '<div class="proposal-inventory-cell"><div class="eyebrow">' + escapeHtml(label) + '</div><div class="proposal-inventory-value">' + escapeHtml(value || '-') + '</div></div>';

    function sortProposalInventoryMatches(matches) {
      var sorted = (matches || []).slice();
      var sortEl = document.getElementById('proposalMatchSort');
      var mode = sortEl ? sortEl.value : 'best';
      var requirements = collectCustomerDiamondRequirements();
      sorted.sort(function (a, b) {
        if (mode === 'caratAsc') return proposalNumber(a.carat) - proposalNumber(b.carat);
        if (mode === 'caratDesc') return proposalNumber(b.carat) - proposalNumber(a.carat);
        if (mode === 'returnDate') return (proposalDateMs(a.returnDueDate) || 9999999999999) - (proposalDateMs(b.returnDueDate) || 9999999999999);
        return proposalInventoryScore(b, requirements) - proposalInventoryScore(a, requirements) ||
          proposalNumber(b.carat) - proposalNumber(a.carat);
      });
      return sorted;
    }

    function proposalInventoryScore(row, requirements) {
      requirements = normalizeCustomerDiamondRequirements(requirements);
      var score = 0;
      if (requirements.stoneType && proposalStoneTypeMatches(row.stoneType, requirements.stoneType)) score += 20;
      if (requirements.shape && proposalTextMatches(row.shape, requirements.shape)) score += 20;
      if (proposalNumberInRange(row.carat, requirements.caratMin, requirements.caratMax)) score += 10;
      if (proposalQualityInRange(row.color, requirements.colorMin, requirements.colorMax, ['D', 'E', 'F', 'G', 'H', 'I', 'Fancy'])) score += 8;
      if (proposalQualityInRange(row.clarity, requirements.clarityMin, requirements.clarityMax, ['FL', 'IF', 'VVS1', 'VVS2', 'VS1', 'VS2', 'SI1', 'SI2'])) score += 8;
      if (!row.issue) score += 4;
      return score;
    }

      var selected = selectedProposalInventoryRows();
      if (!selected.length) {

        return;
      }
      var container = document.getElementById('proposalRows');
      if (!container) return;
      var existingRows = [].slice.call(container.querySelectorAll('.proposal-row'));
      if (existingRows.length === 1 && !proposalRowHasData(existingRows[0])) {
        container.innerHTML = '';
      }
      selected.forEach(function (row) {
        var index = container.querySelectorAll('.proposal-row').length;
        container.insertAdjacentHTML('beforeend', proposalRowHtml(index, proposalStoneFromInventory(row), true));
      });
      updateProposalRowNumbers();
      updateProposalWorkspaceState();
      updateCompleteButtonState();
      setStatus('Added ' + selected.length + ' in-stock diamond(s) to the proposal.');
    }

      row = row || {};
      return {
        vendor: row.vendor || 'From In Stock',
        stoneType: proposalStoneTypeForProposal(row.stoneType),
        shape: proposalChoiceValue(row.shape, ['Round', 'Oval', 'Pear', 'Cushion', 'Emerald', 'Radiant', 'Princess', 'Marquise', 'Asscher', 'Heart', 'Other']),
        carat: row.carat || '',
        color: proposalColorForProposal(row.color),
        clarity: proposalChoiceValue(row.clarity, ['FL', 'IF', 'VVS1', 'VVS2', 'VS1', 'VS2', 'SI1', 'SI2']),
        lab: proposalChoiceValue(row.lab, ['GIA', 'IGI', 'Other']),
        certNo: row.certNo || '',

      };

    function proposalInventorySummaryText(requirements) {
      requirements = normalizeCustomerDiamondRequirements(requirements);
      return [
        requirements.stoneType,
        requirements.shape,
        swUiRangeText(requirements.caratMin, requirements.caratMax, 'ct'),
        swUiRangeText(requirements.colorMin, requirements.colorMax, 'color'),
        swUiRangeText(requirements.clarityMin, requirements.clarityMax, 'clarity')
      ].filter(Boolean).join(' | ');
    }

    function swUiRangeText(min, max, suffix) {
      if (!min && !max) return '';
      if (min && max) return min + '-' + max + (suffix === 'ct' ? ' ct' : ' ' + suffix);
      return (min || max) + (suffix === 'ct' ? ' ct' : ' ' + suffix);
    }

    function proposalTextMatches(value, expected) {
      if (!expected) return true;
      return norm(value) === norm(expected);
    }

    function proposalStoneTypeMatches(value, expected) {
      if (!expected) return true;
      return proposalStoneTypeKey(value) === proposalStoneTypeKey(expected);
    }

    function proposalStoneTypeKey(value) {
      var n = norm(value);
      if (!n) return '';
      if (/\blab\b|lab grown|lab-grown|lab created|lgd|\blg\b|cvd|hpht|synthetic|man made/.test(n)) return 'lab';
      if (/natural|earth/.test(n)) return 'natural';
      if (/sapphire/.test(n)) return 'sapphire';
      if (/emerald/.test(n)) return 'emerald';
      if (/ruby/.test(n)) return 'ruby';
      return n;
    }

    function proposalStoneTypeLabel(value) {
      var key = proposalStoneTypeKey(value);
      if (key === 'lab') return 'Lab Diamond';
      if (key === 'natural') return 'Natural Diamond';
      return value || 'Stone type missing';
    }

    function proposalStoneTypeForProposal(value) {
      var key = proposalStoneTypeKey(value);
      if (key === 'lab') return 'Lab Diamond';
      if (key === 'natural') return 'Natural Diamond';
      return proposalChoiceValue(value, ['Lab Diamond', 'Natural Diamond', 'Sapphire', 'Emerald', 'Ruby']);
    }

    function proposalNumberInRange(value, min, max) {
      var n = proposalNumber(value);
      if (!min && !max) return true;
      if (isNaN(n)) return false;
      var lo = min ? proposalNumber(min) : -Infinity;
      var hi = max ? proposalNumber(max) : Infinity;
      if (lo > hi) {
        var tmp = lo;
        lo = hi;
        hi = tmp;
      }
      return n >= lo && n <= hi;
    }

    function proposalNumber(value) {
      var n = Number(String(value || '').replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    function proposalQualityInRange(value, min, max, order) {
      if (!min && !max) return true;
      var v = proposalQualityIndex(value, order);
      if (v < 0) return false;
      var lo = min ? proposalQualityIndex(min, order) : 0;
      var hi = max ? proposalQualityIndex(max, order) : order.length - 1;
      if (lo < 0) lo = 0;
      if (hi < 0) hi = order.length - 1;
      if (lo > hi) {
        var tmp = lo;
        lo = hi;
        hi = tmp;
      }
      return v >= lo && v <= hi;
    }

    function proposalQualityIndex(value, order) {
      var n = norm(value);
      for (var i = 0; i < order.length; i++) {
        if (n === norm(order[i]) || (order[i] === 'Fancy' && n.indexOf('fancy') === 0)) return i;
      }
      return -1;
    }

    function proposalColorForProposal(value) {
      if (/^fancy/i.test(String(value || ''))) return 'Fancy';
      return proposalChoiceValue(value, ['D', 'E', 'F', 'G', 'H', 'I', 'Fancy']);
    }

    function proposalChoiceValue(value, options) {
      var n = norm(value);
      for (var i = 0; i < options.length; i++) {
        if (norm(options[i]) === n) return options[i];
      }
      return value || '';
    }

    function proposalDateMs(value) {
      var iso = dateInputValue(value);
      if (!iso) return 0;
      var parts = iso.split('-');
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 0, 0, 0, 0).getTime();
    }

      serverCall('sw_adminListWorkflowUsers', [], function (res) {
        appState.userAdmin = res;
        renderUserAdminPanel(res);
      }, 'Loading users');
    }

    function renderUserAdminPanel(res) {
      var roles = res.roleOptions || [];
      var users = res.users || [];
      document.getElementById('detailPanel').innerHTML = [
        '<div class="panel-header">',
          '<div class="eyebrow">Admin</div>',
          '<h2>Workflow Users</h2>',
        '</div>',
        '<div class="detail-body">',
          '<div class="detail-section">',
            '<label>Add or Update User</label>',
            '<div class="field-grid">',
              '<div><label for="userAdminEmail">Email</label><input id="userAdminEmail" type="email"></div>',
              '<div><label for="userAdminName">Name</label><input id="userAdminName"></div>',
              '<div><label for="userAdminPassword">Password</label><input id="userAdminPassword" type="text" placeholder="Leave blank to auto-generate"></div>',
              '<div class="actions"><button class="js-admin-generate-password" type="button">Generate Password</button></div>',
              '<div><label>Role Access</label><div class="role-grid">' + renderRoleOptions(roles) + '</div></div>',
              '<div><label for="userAdminNotes">Notes</label><input id="userAdminNotes"></div>',
            '</div>',
            '<div class="actions"><button class="primary js-admin-save-user" type="button">Save User</button></div>',
            '<div class="login-status" id="userAdminStatus"></div>',
          '</div>',
          '<div class="detail-section">',
            '<label>Existing Users</label>',
            users.length ? '<div class="mini-table">' + users.map(renderWorkflowUserRow).join('') + '</div>' : '<div class="empty">No workflow users yet.</div>',
          '</div>',
        '</div>'
      ].join('');
    }

    function renderRoleOptions(roles) {
      return (roles || []).map(function (role) {
        return [
          '<label class="role-option">',
            '<input class="user-role-option" type="checkbox" value="' + escapeAttrValue(role.value) + '">',
            '<span><strong>' + escapeHtml(role.label || role.value) + '</strong><span class="meta">' + escapeHtml(role.description || '') + '</span></span>',
          '</label>'
        ].join('');
      }).join('');
    }

    function renderWorkflowUserRow(user) {
      return '<div class="mini-row three">' +
        '<div><strong>' + escapeHtml(user.name || user.email) + '</strong><div class="meta">' + escapeHtml(user.email || '') + '</div></div>' +
        '<div class="meta">' + escapeHtml(displayWorkflowRoles(user.roles || '')) + '</div>' +
        '<div class="meta">' + escapeHtml(user.active || '') + (user.passwordSet ? ' · Password set' : ' · No password') + '</div>' +
      '</div>';
    }

    function fillGeneratedUserPassword() {
      var el = document.getElementById('userAdminPassword');
      if (el) el.value = clientGeneratedPassword();
    }

    function displayWorkflowRoles(value) {
      return String(value || '').split(/[,\n;]/).map(function (role) {
        role = role.trim();
        if (role === 'SALES_REP') return 'Client Advisor';
        return role;
      }).filter(Boolean).join(', ');
    }

    function saveWorkflowUser() {
      var status = document.getElementById('userAdminStatus');
      if (status) status.textContent = '';
      var payload = {
        email: valueOf('userAdminEmail'),
        name: valueOf('userAdminName'),
        password: valueOf('userAdminPassword'),
        notes: valueOf('userAdminNotes'),
        roles: [].slice.call(document.querySelectorAll('.user-role-option:checked')).map(function (el) { return el.value; })
      };
      serverCall('sw_adminUpsertWorkflowUser', [payload], function (res) {
        var message = 'Saved ' + (res.email || payload.email) + '. Password: ' + (res.password || payload.password || 'unchanged');
        if (status) status.textContent = message;
        setStatus('Workflow user saved');
        serverCall('sw_adminListWorkflowUsers', [], function (list) {
          appState.userAdmin = list;
          renderUserAdminPanel(list);
          var nextStatus = document.getElementById('userAdminStatus');
          if (nextStatus) nextStatus.textContent = message;
        });
      }, 'Saving user');
    }

    function clientGeneratedPassword() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
      var out = '';
      for (var i = 0; i < 14; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    function completionPayload() {
      var detail = appState.detail || {};
      var task = detail.task || {};
      var payload = { checklist: {} };
      (detail.checklist || []).forEach(function (item) {
        var el = document.getElementById('check-' + item.id);
        payload.checklist[item.id] = !!(el && el.checked);
      });
      var text = document.getElementById('completionText');
      if (text && task.taskType === 'PROCESS_APPOINTMENT_DATA') payload.recapText = text.value;
      if (text && task.taskType === 'APPROVE_RECAP_MESSAGE') payload.approvedText = text.value;
      if (task.taskType === 'APPOINTMENT_DAY_CHECKLIST') {
        payload.appointmentOutcome = valueOf('appointmentOutcome');
        payload.uploadedArtifactCount = (detail.appointmentArtifacts || []).length;
        payload.primaryRecordingUploaded = hasPrimaryAppointmentRecording(detail.appointmentArtifacts || []);
      }
      if (task.taskType === 'PROPOSE_DIAMONDS') {
        payload.proposalStones = collectProposalStones();
        payload.customerDiamondRequirements = collectCustomerDiamondRequirements();
      }
      if (task.taskType === 'ORDER_DIAMONDS') {
        payload.orderedDate = valueOf('orderedDate');
        payload.diamondOrderDecisions = [].slice.call(document.querySelectorAll('.diamond-order-decision')).map(function (select) {
          var row = select.closest('.mini-row');
          return { rowIndex: row ? row.getAttribute('data-row-index') : '', decision: select.value };
        });
      }
      if (task.taskType === 'TRACK_DIAMONDS') {
        payload.trackingEta = valueOf('trackingEta');
        payload.trackingStatus = valueOf('trackingStatus');
        payload.carrier = valueOf('carrier');
        payload.trackingNumber = valueOf('trackingNumber');
        payload.trackingUrl = valueOf('trackingUrl');
        payload.trackingNotes = valueOf('trackingNotes');
      }
      if (task.taskType === 'CONFIRM_DIAMOND_DELIVERY') {
        payload.memoDate = valueOf('memoDate');
      }
      if (task.taskType === 'RECORD_DIAMOND_DECISIONS') {
        payload.diamondDecisions = [].slice.call(document.querySelectorAll('.diamond-stone-decision')).map(function (select) {
          var row = select.closest('.mini-row');
          var hold = row ? row.querySelector('.diamond-hold') : null;
          return { rowIndex: row ? row.getAttribute('data-row-index') : '', decision: select.value, hold: !!(hold && hold.checked) };
        }).filter(function (item) { return item.decision; });
      }
      if (task.taskType === 'POST_CONSULT_CLIENT_STATUS') {
        payload.salesStage = valueOf('pcSalesStage');
        payload.convStatus = valueOf('pcConvStatus');
        payload.customOrder = valueOf('pcCustomOrder');
        payload.centerStone = valueOf('pcCenterStone');
        payload.inProduction = valueOf('pcInProduction');
        payload.orderDate = valueOf('pcOrderDate');
        payload.deadline3d = valueOf('pcDeadline3d');
        payload.prodDeadline = valueOf('pcProdDeadline');
        payload.threeDNeeded = valueOf('pcThreeDNeeded');
        payload.no3dReason = valueOf('pcNo3dReason');
        payload.designRequest = valueOf('pcDesignRequest');
        payload.nextSteps = valueOf('pcNextSteps');
        payload.waxNeeded = valueOf('pcWaxNeeded');
        payload.waxNeededBy = valueOf('pcWaxNeededBy');
        payload.waxPriority = valueOf('pcWaxPriority');
      }
      if (isDataCleanupTaskType(task.taskType)) {
        if (task.taskType === 'CUSTOMER_DATA_CLEANUP_CONFIRM') {
          payload.cleanupDecision = norm(valueOf('cleanupDecision')) === 'return' ? 'return' : (norm(valueOf('cleanupDecision')) === 'approve' ? 'approve' : '');
          payload.cleanupReturnReason = valueOf('cleanupReturnReason');
        } else {
          payload.cleanupProposal = collectDataCleanupProposal();
        }
      }
      if (task.taskType === 'START_3D_DESIGN') {
        payload.start3dMode = checkedOf('s3dNo3d') ? 'no3d' : 'start';
        payload.no3d = checkedOf('s3dNo3d');
        payload.no3dReason = valueOf('s3dNo3dReason');
        payload.brand = valueOf('s3dBrand');
        payload.so = valueOf('s3dSo');
        payload.odooUrl = valueOf('s3dOdooUrl');
        payload.shortTag = valueOf('s3dShortTag');
        payload.shape = valueOf('s3dShape');
        payload.ringStyle = valueOf('s3dRingStyle');
        payload.designRequest = valueOf('s3dDesignRequest');
        payload.waxNeeded = valueOf('s3dWaxNeeded');
        payload.waxNeededBy = valueOf('s3dWaxNeededBy');
        payload.waxPriority = valueOf('s3dWaxPriority');
      }
      if (task.taskType === 'RECORD_3D_DEADLINE') {
        payload.deadline3d = valueOf('deadline3dTask');
        payload.note = valueOf('deadline3dNote');
      }
      if (task.taskType === 'REQUEST_WAX_PRINT') {
        payload.soMo = valueOf('waxSoMo');
        payload.neededByRep = valueOf('waxNeededBy');
        payload.priority = valueOf('waxPriority');
        payload.notes = valueOf('waxRequestNotes');
      }
      if (task.taskType === 'UPDATE_WAX_REQUEST') {
        payload.waxUpdates = [].slice.call(document.querySelectorAll('.wax-update-row')).map(function (row) {
          return {
            id: row.getAttribute('data-wax-id') || '',
            status: (row.querySelector('.waxStatus') || {}).value || '',
            adminDeadline: (row.querySelector('.waxAdminDeadline') || {}).value || '',
            estPrint: (row.querySelector('.waxEstPrint') || {}).value || '',
            completed: (row.querySelector('.waxCompleted') || {}).value || '',
            notes: (row.querySelector('.waxNotes') || {}).value || ''
          };
        }).filter(function (item) { return item.id; });
      }
      return payload;
    }

    function collectProposalStones() {
      return [].slice.call(document.querySelectorAll('.proposal-row')).map(function (row) {
        var stone = {};
        [].slice.call(row.querySelectorAll('.proposal-field')).forEach(function (field) {
          stone[field.getAttribute('data-field')] = field.value;
        });
        return stone;
      }).filter(function (stone) {
        return !!(stone.certNo || stone.shape || stone.carat || stone.vendor);
      });
    }

    function collectCustomerDiamondRequirements() {
      var requirements = {};
      [].slice.call(document.querySelectorAll('.requirement-field')).forEach(function (field) {
        requirements[field.getAttribute('data-field')] = field.value;
      });
      requirements.varietyFocus = [].slice.call(document.querySelectorAll('.requirement-variety:checked')).map(function (field) {
        return field.value;
      });
      return requirements;
    }

    function collectDataCleanupProposal() {
      return {
        salesStage: valueOf('cleanupSalesStage'),
        convStatus: valueOf('cleanupConvStatus'),
        customOrder: valueOf('cleanupCustomOrder'),
        inProduction: valueOf('cleanupInProduction'),
        centerStone: valueOf('cleanupCenterStone'),
        orderDate: valueOf('cleanupOrderDate'),
        deadline3d: valueOf('cleanupDeadline3d'),
        prodDeadline: valueOf('cleanupProdDeadline'),
        nextSteps: valueOf('cleanupNextSteps'),
        lostLeadReason: valueOf('cleanupLostLeadReason'),
        lostLeadNotes: valueOf('cleanupLostLeadNotes'),
        cleanupNotes: valueOf('cleanupNotes'),
        verification: {
          ownersVerified: checkedOf('cleanupOwnersVerified'),
          contactVerified: checkedOf('cleanupContactVerified'),
          opsStatusReviewed: checkedOf('cleanupOpsStatusReviewed'),
          nextStepsCurrent: checkedOf('cleanupNextStepsCurrent')
        }
      };
    }

    function missingCustomerDiamondRequirements(requirements) {
      requirements = requirements || {};
      var missing = [];
      if (!String(requirements.summary || '').trim()) missing.push('customer brief');
      if (!String(requirements.primaryDecisionFactor || '').trim()) missing.push('primary deciding factor');
      if (!requirements.varietyFocus || !requirements.varietyFocus.length) missing.push('variety to show');
      return missing;
    }

    function updateCustomerDiamondRequirementStatus(missing) {
      var el = document.getElementById('proposalRequirementStatus');
      if (!el) return;
      el.textContent = missing && missing.length ? 'Complete required customer requirements: ' + missing.join(', ') + '.' : '';
    }

    function updateCompleteButtonState() {
      var button = document.querySelector('.js-complete-task');
      if (!button) return;
      var detail = appState.detail || {};
      var task = detail.task || {};
      var disabled = false;
      var isNoShowChecklist = task.taskType === 'APPOINTMENT_DAY_CHECKLIST' && valueOf('appointmentOutcome') === 'No Show';
      (detail.checklist || []).forEach(function (item) {
        if (isNoShowChecklist) return;
        if (item.required === false) return;
        var el = document.getElementById('check-' + item.id);
        if (!el || !el.checked) disabled = true;
      });
      if (task.taskType === 'APPOINTMENT_DAY_CHECKLIST') {
        var outcome = valueOf('appointmentOutcome');
        if (!outcome) disabled = true;
        if (outcome === 'Completed' && !hasPrimaryAppointmentRecording(detail.appointmentArtifacts || [])) disabled = true;
      }
      if (task.taskType === 'ORDER_DIAMONDS') {
        var selects = [].slice.call(document.querySelectorAll('.diamond-order-decision'));
        if (selects.length && selects.some(function (select) { return !select.value; })) disabled = true;
      }
      if (task.taskType === 'PROPOSE_DIAMONDS' && !collectProposalStones().length) {
        disabled = true;
      }
      if (task.taskType === 'PROPOSE_DIAMONDS') {
        var missingRequirements = missingCustomerDiamondRequirements(collectCustomerDiamondRequirements());
        if (missingRequirements.length) disabled = true;
        updateCustomerDiamondRequirementStatus(missingRequirements);
      }
      if (task.taskType === 'POST_CONSULT_CLIENT_STATUS') {
        if (!valueOf('pcSalesStage') || !valueOf('pcConvStatus') || !valueOf('pcThreeDNeeded')) disabled = true;
        if (norm(valueOf('pcThreeDNeeded')) === 'no' && !valueOf('pcNo3dReason')) disabled = true;
      }
      if (isDataCleanupTaskType(task.taskType)) {
        if (task.taskType === 'CUSTOMER_DATA_CLEANUP_CONFIRM') {
          var decision = norm(valueOf('cleanupDecision'));
          if (decision !== 'approve' && decision !== 'return') disabled = true;
          if (decision === 'return' && !valueOf('cleanupReturnReason')) disabled = true;
        } else {
          var proposal = collectDataCleanupProposal();
          if (!proposal.salesStage || !proposal.convStatus) disabled = true;
          if (!proposal.verification.ownersVerified || !proposal.verification.contactVerified || !proposal.verification.opsStatusReviewed || !proposal.verification.nextStepsCurrent) disabled = true;
          if (cleanupProposalIsLost(proposal) && (!proposal.lostLeadReason || !proposal.lostLeadNotes)) disabled = true;
        }
      }
      if (task.taskType === 'START_3D_DESIGN') {
        if (checkedOf('s3dNo3d')) {
          if (!valueOf('s3dNo3dReason')) disabled = true;
        } else if (!valueOf('s3dBrand') || !valueOf('s3dSo') || !valueOf('s3dOdooUrl')) {
          disabled = true;
        }
      }
      if (task.taskType === 'RECORD_3D_DEADLINE' && !valueOf('deadline3dTask')) disabled = true;
      if (task.taskType === 'REQUEST_WAX_PRINT' && (!valueOf('waxSoMo') || !valueOf('waxNeededBy') || !valueOf('waxPriority'))) disabled = true;
      button.disabled = disabled;
      button.title = disabled ? 'Complete required fields, uploads, customer requirements, cleanup checks, and decisions first.' : '';
    }

    function cleanupProposalIsLost(proposal) {
      proposal = proposal || {};
      return norm(proposal.salesStage).indexOf('lost') >= 0 || norm(proposal.convStatus).indexOf('lost') >= 0;
    }

    function hasPrimaryAppointmentRecording(artifacts) {
      artifacts = artifacts || [];
      return artifacts.some(function (artifact) {
        return artifact.artifactType === 'APPOINTMENT_RECORDING' && norm(artifact.workflowStage) !== 'error' && artifact.driveUrl;
      });
    }

    function valueOf(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    function checkedOf(id) {
      var el = document.getElementById(id);
      return !!(el && el.checked);
    }

    function completeTask() {
      if (!appState.selectedTaskId) return;
      serverCall('sw_completeTask', [appState.selectedTaskId, completionPayload()], function () {
        setStatus('Task completed');
        loadTasks(appState.view);
        closeTaskWorkspace(true);
      });
    }

    function snoozeTask() {
      if (!appState.selectedTaskId) return;
      var payload = {
        untilDate: valueOf('snoozeUntil'),
        reason: valueOf('snoozeReason')
      };
      serverCall('sw_snoozeTask', [appState.selectedTaskId, payload], function () {
        setStatus('Task snoozed');
        loadTasks(appState.view);
        closeTaskWorkspace(true);
      });
    }

    function claimTask() {
      if (!appState.selectedTaskId) return;
      var taskId = appState.selectedTaskId;
      serverCall('sw_claimTask', [taskId], function () {
        setStatus('Task claimed');
        loadTasks(appState.view, { reopenTaskId: taskId });
      });
    }

    function adminSaveAssignment() {
      if (!appState.selectedTaskId) return;
      var taskId = appState.selectedTaskId;
      if (document.getElementById('adminAssignedRep') || document.getElementById('adminAssistedRep')) {
        var payload = {
          assignedRep: valueOf('adminAssignedRep'),
          assistedRep: valueOf('adminAssistedRep'),
          reason: valueOf('adminReason')
        };
        serverCall('sw_adminAssignAppointmentOwners', [taskId, payload], function (res) {
          setStatus('Assignment saved: ' + (res.rowsUpdated || 0) + ' appointment row(s) updated');
          loadTasks(appState.view, { reopenTaskId: taskId });
        }, 'Saving assignment');
        return;
      }
      serverCall('sw_adminReassignTask', [
        taskId,
        valueOf('adminOwnerName'),
        valueOf('adminOwnerEmail'),
        valueOf('adminReason')
      ], function () {
        setStatus('Assignment saved');
        loadTasks(appState.view, { reopenTaskId: taskId });
      }, 'Saving assignment');
    }

    function adminBlock() {
      if (!appState.selectedTaskId) return;
      var taskId = appState.selectedTaskId;
      var reason = document.getElementById('adminReason').value || 'Admin blocked';
      serverCall('sw_adminBlockTask', [taskId, reason], function () {
        setStatus('Task blocked');
        loadTasks(appState.view, { reopenTaskId: taskId });
      });
    }

    function adminUnblock() {
      if (!appState.selectedTaskId) return;
      var taskId = appState.selectedTaskId;
      var reason = document.getElementById('adminReason').value || '';
      serverCall('sw_adminUnblockTask', [taskId, reason], function () {
        setStatus('Task unblocked');
        loadTasks(appState.view, { reopenTaskId: taskId });
      });
    }

    function refreshQueue() {
      setStatus('Refreshing queue. This can take a minute on the first run.');
      serverCall('sw_generateSalesWorkflowTasks', [], function (res) {
        setStatus('Queue refreshed: ' + (res.created || 0) + ' created, ' + (res.updated || 0) + ' updated');
        loadTasks(appState.view);
      }, 'Refreshing queue. This can take a minute on the first run.');
    }

    function copyTemplate() {
      var text = document.getElementById('renderedTemplate');
      if (!text) return;
      var copyText = text.textContent || '';
      var clientMessage = appState.detail && isClientMessageTaskType((appState.detail.task || {}).taskType);
      if (clientMessage) {
        copyText = stripGoogleDriveLinksForCopy_(copyText);
      }
      navigator.clipboard.writeText(copyText).then(function () {
        setStatus(clientMessage ? 'Message copied' : 'Template copied');
        if (appState.selectedTaskId) {
          google.script.run.sw_logTemplateCopied(appState.token, appState.selectedTaskId);
        }
      }, function () {
        setStatus('Copy failed. Select the template text manually.', true);
      });
    }

    function isClientMessageTaskType(taskType) {
      return ['SEND_WELCOME', 'SEND_HYBRID_WELCOME', 'SEND_MAP_INSTRUCTIONS', 'SEND_FINAL_RECAP'].indexOf(taskType) >= 0;
    }

    function stripGoogleDriveLinksForCopy_(text) {
      return String(text || '')
        .replace(/\b(?:https?:\/\/)?(?:drive|docs)\.google\.com\/[^\s<>"')]+/gi, '')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function copyManufacturingMessage() {
      var text = document.getElementById('manufacturingMessage');
      if (!text) return;
      navigator.clipboard.writeText(text.textContent || '').then(function () {
        setStatus('Manufacturing message copied');
      }, function () {
        setStatus('Copy failed. Select the manufacturing message manually.', true);
      });
    }

    function refreshDiamondQuote(mode) {
      if (!appState.selectedTaskId) return;
      var fn = mode === 'diamonds' ? 'sw_refreshDiamondQuoteFromTracking' :
        mode === 'settings' ? 'sw_refreshDiamondQuoteFrom3D' : 'sw_refreshDiamondQuoteAll';
      serverCall(fn, [appState.selectedTaskId], function (res) {
        setStatus('Quotation refreshed');
        openTask(appState.selectedTaskId);
      }, 'Refreshing quotation');
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/\s+/g, '_');
    }

    function escapeAttrValue(value) {
      return escapeHtml(value);
    }

    function escapeHref(value) {
      return escapeHtml(value);
    }

    function isImageUrl(value) {
      return /\.(png|jpe?g|gif|webp)(\?|#|$)/i.test(String(value || ''));
    }

    bindEvents();
    init();
  </script>
</body>
</html>
