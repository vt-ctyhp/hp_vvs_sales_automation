<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-foundation: #F7F1EB;
      --surface-card:  #FBF7F1;
      --surface-inset: #EFE8DD;
      --ink-primary:   #2A2725;
      --ink-body:      #4A4540;
      --ink-muted:     #8A8178;
      --rule:          #D4CFC4;
      --accent:        #E91D79;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-foundation);
      color: var(--ink-body);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
    }

    .auth-screen {
      align-items: center;
      display: flex;
      min-height: 100vh;
      padding: 32px;
    }

    .auth-panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      margin: 0 auto;
      max-width: 440px;
      padding: 32px;
      width: 100%;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow {
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1, h2, h3 {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      margin: 0;
    }

    h1 {
      font-size: 38px;
      line-height: 1;
    }

    h2 {
      font-size: 26px;
    }

    h3 {
      font-size: 20px;
    }

    .userline {
      color: var(--ink-muted);
      text-align: right;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border-radius: 2px;
      border: 1px solid var(--ink-primary);
      background: transparent;
      color: var(--ink-primary);
      cursor: pointer;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      padding: 10px 14px;
      text-transform: uppercase;
      transition: background-color 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;
    }

    button:hover:not(:disabled) {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button.primary {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }

    button.active {
      background: var(--ink-primary);
      color: var(--bg-foundation);
    }

    button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    button.is-loading {
      pointer-events: none;
    }

    .status {
      color: var(--ink-muted);
      min-height: 20px;
      text-align: right;
    }

    .error {
      color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      min-width: 0;
      padding: 28px;
    }

    .panel-header {
      border-bottom: 1px solid var(--rule);
      margin-bottom: 20px;
      padding-bottom: 16px;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      background: var(--surface-card);
      border: 1px solid var(--rule);
      padding: 18px;
    }

    .task-card.overdue {
      border-top: 2px solid var(--accent);
    }

    .task-side {
      align-content: start;
      display: grid;
      gap: 8px;
      justify-items: end;
      min-width: 72px;
    }

    .task-main {
      min-width: 0;
    }

    .brand-chip {
      border: 1px solid var(--rule);
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1;
      padding: 5px 7px;
      text-transform: uppercase;
    }

    .brand-chip.hp {
      background: #FCEAF3;
      border-color: #F3B8D5;
      color: #A71358;
    }

    .brand-chip.vvs {
      background: #FFF4CC;
      border-color: #E8C75C;
      color: #725500;
    }

    .calendar-nav {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .calendar-month {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      line-height: 1;
    }

    .calendar-grid {
      border-left: 1px solid var(--rule);
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekday {
      background: var(--surface-inset);
      border-bottom: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      padding: 9px 8px;
      text-transform: uppercase;
    }

    .calendar-day {
      background: var(--surface-card);
      border-bottom: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      min-height: 132px;
      padding: 8px;
    }

    .calendar-day.outside {
      background: var(--bg-foundation);
      color: var(--ink-muted);
    }

    .calendar-day.today {
      background: var(--surface-inset);
    }

    .calendar-day-number {
      color: var(--ink-muted);
      font-size: 11px;
      margin-bottom: 8px;
      text-align: right;
    }

    button.calendar-event {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: block;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.35;
      padding: 7px 0;
      text-align: left;
      text-transform: none;
      width: 100%;
    }

    button.calendar-event:hover:not(:disabled) {
      background: transparent;
      color: var(--ink-primary);
    }

    .calendar-event-time {
      color: var(--ink-muted);
      display: block;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .calendar-more {
      color: var(--ink-muted);
      font-size: 11px;
      padding-top: 7px;
    }

    .task-top {
      display: flex;
      gap: 16px;
      justify-content: space-between;
    }

    .task-title {
      color: var(--ink-primary);
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .meta {
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      background: var(--surface-inset);
      color: var(--ink-body);
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.12em;
      margin: 10px 8px 0 0;
      padding: 5px 7px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .empty, .loading {
      background: var(--surface-inset);
      color: var(--ink-muted);
      padding: 24px;
    }

    .detail-body {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .detail-section {
      border-bottom: 1px solid var(--rule);
      min-width: 0;
      padding-bottom: 18px;
    }

    .detail-section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .snooze-panel summary {
      align-items: center;
      color: var(--ink-muted);
      cursor: pointer;
      display: flex;
      font-size: 10px;
      gap: 12px;
      justify-content: space-between;
      letter-spacing: 0.14em;
      list-style: none;
      text-transform: uppercase;
    }

    .snooze-panel summary::-webkit-details-marker {
      display: none;
    }

    .snooze-panel summary::after {
      border: 1px solid var(--rule);
      color: var(--ink-primary);
      content: '+';
      flex: 0 0 auto;
      font-size: 13px;
      height: 24px;
      line-height: 22px;
      text-align: center;
      width: 24px;
    }

    .snooze-panel[open] summary {
      margin-bottom: 14px;
    }

    .snooze-panel[open] summary::after {
      content: '-';
    }

    .snooze-panel summary:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 4px;
    }

    .snooze-summary-text {
      min-width: 0;
    }

    .snooze-current {
      color: var(--ink-muted);
      display: block;
      font-size: 12px;
      letter-spacing: 0;
      line-height: 1.5;
      margin-top: 6px;
      text-transform: none;
    }

    .template-box {
      background: var(--surface-inset);
      color: var(--ink-primary);
      line-height: 1.55;
      max-width: 100%;
      min-height: 96px;
      overflow-wrap: anywhere;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .attachment-list {
      display: grid;
      gap: 12px;
    }

    .attachment-row {
      border-bottom: 1px solid var(--rule);
      overflow-wrap: anywhere;
      padding-bottom: 12px;
    }

    .attachment-row a {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .attachment-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .attachment-image {
      border: 1px solid var(--rule);
      display: block;
      margin-top: 10px;
      max-height: 220px;
      max-width: 100%;
      object-fit: contain;
    }

    label {
      color: var(--ink-muted);
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    textarea, input, select {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      color: var(--ink-primary);
      font: inherit;
      padding: 6px 2px;
      width: 100%;
    }

    textarea {
      border: 1px solid var(--rule);
      min-height: 140px;
      padding: 12px;
      resize: vertical;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
      outline: none;
    }

    .checklist {
      display: grid;
      gap: 10px;
    }

    .check-row {
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .check-row input {
      width: auto;
    }

    .role-grid {
      display: grid;
      gap: 10px;
    }

    .role-option {
      align-items: flex-start;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      font-size: 14px;
      gap: 10px;
      grid-template-columns: 18px 1fr;
      letter-spacing: 0;
      margin-bottom: 0;
      padding: 10px 0;
      text-transform: none;
    }

    .role-option input {
      margin-top: 2px;
      width: auto;
    }

    .admin-form {
      display: grid;
      gap: 12px;
    }

    .field-grid {
      display: grid;
      gap: 14px;
    }

    .field-grid .wide {
      grid-column: 1 / -1;
    }

    .mini-table {
      border-top: 1px solid var(--rule);
      display: grid;
      gap: 0;
    }

    .mini-row {
      border-bottom: 1px solid var(--rule);
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 160px);
      padding: 12px 0;
    }

    .mini-row.three {
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 150px) minmax(80px, 110px);
    }

    .wax-update-row {
      grid-template-columns: minmax(160px, 1fr) minmax(220px, 2fr);
    }

    .wax-update-row textarea {
      margin-top: 8px;
      min-height: 64px;
    }

    .bulk-actions {
      align-items: center;
      background: var(--surface-inset);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 14px;
    }

    .bulk-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stock-filter-panel {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      margin-bottom: 16px;
      padding: 14px;
    }

    .stock-filter-heading {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stock-filter-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .bulk-return-row {
      align-items: flex-start;
      border-top: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      gap: 12px;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      letter-spacing: 0;
      margin: 0;
      padding: 16px 0;
      text-transform: none;
    }

    .bulk-return-row.issue {
      border-top: 2px solid var(--accent);
    }

    .bulk-return-row input {
      margin-top: 4px;
      width: auto;
    }

    .bulk-return-row .task-title,
    .bulk-return-row .meta {
      display: block;
    }

    .bulk-selected-list {
      border-top: 1px solid var(--rule);
      display: grid;
      gap: 0;
      margin-top: 10px;
    }

    .bulk-selected-item {
      border-bottom: 1px solid var(--rule);
      padding: 10px 0;
    }

    .stat-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface-inset);
      border: 1px solid var(--rule);
      padding: 14px;
    }

    .stat-value {
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      line-height: 1;
    }

    button.tracking-row {
      background: transparent;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      border-top: 1px solid var(--rule);
      color: var(--ink-body);
      display: grid;
      font-size: 14px;
      font-weight: 400;
      gap: 10px;
      letter-spacing: 0;
      padding: 16px 0;
      text-align: left;
      text-transform: none;
      width: 100%;
    }

    button.tracking-row:hover:not(:disabled) {
      background: var(--surface-inset);
      color: var(--ink-body);
    }

    button.tracking-row.issue {
      border-top: 2px solid var(--accent);
    }

    .proposal-rows {
      display: grid;
      gap: 18px;
    }

    .proposal-row {
      border-top: 1px solid var(--rule);
      padding-top: 16px;
    }

    .proposal-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .proposal-grid .wide {
      grid-column: 1 / -1;
    }

    .requirement-checks {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 8px;
    }

    .requirement-checks .check-row {
      align-items: flex-start;
    }

    .requirement-status {
      margin-top: 10px;
      min-height: 18px;
    }

    .login-status {
      min-height: 18px;
      margin-top: 12px;
    }

    @media (max-width: 980px) {
      .shell {
        padding: 20px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .calendar-weekday {
        display: none;
      }

      .calendar-day.outside {
        display: none;
      }

      .calendar-day {
        min-height: 96px;
      }

      .stat-grid, .proposal-grid {
        grid-template-columns: 1fr;
      }

      .stock-filter-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .stock-filter-grid {
        grid-template-columns: 1fr;
      }

      .masthead, .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .userline, .status {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <section class="auth-screen" id="loginScreen">
    <div class="auth-panel">
      <div class="eyebrow">Sales Workflow</div>
      <h1>Sign in</h1>
      <div class="field-grid" style="margin-top:24px">
        <div>
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username">
        </div>
        <div>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password">
        </div>
      </div>
      <div class="actions">
        <button id="loginButton" class="primary" type="button">Sign In</button>
      </div>
      <div class="login-status error" id="loginStatus"></div>
    </div>
  </section>

  <main class="shell" id="appShell" style="display:none">
    <header class="masthead">
      <div>
        <div class="eyebrow">Sales Appointment Workflow</div>
        <h1>Team Queue</h1>
      </div>
      <div class="userline" id="userLine">Loading user</div>
    </header>

    <section class="toolbar">
      <div class="tabs">
        <button id="tab-mine" class="active" type="button" data-view="mine">My Queue</button>
        <button id="tab-calendar" type="button" data-view="calendar">Calendar</button>
        <button id="tab-inStockDiamonds" type="button" data-view="inStockDiamonds">In-Stock Diamonds</button>
        <button id="tab-diamondTracking" type="button" data-view="diamondTracking" style="display:none">Diamond Tracking</button>
        <button id="tab-bulkReturns" type="button" data-view="bulkReturns" style="display:none">Bulk Returns</button>
        <button id="tab-coverage" type="button" data-view="coverage" style="display:none">JOC Coverage</button>
        <button id="tab-admin" type="button" data-view="admin" style="display:none">Admin Review</button>
      </div>
      <div>
        <button id="manageUsersButton" type="button" style="display:none">Manage Users</button>
        <button id="logoutButton" type="button">Sign Out</button>
        <button id="refreshOwnersButton" type="button">Refresh Owners</button>
        <button id="generateTasksButton" class="primary" type="button">Generate Tasks</button>
      </div>
    </section>

    <div class="status" id="status"></div>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="eyebrow" id="viewEyebrow">My Queue</div>
          <h2 id="viewTitle">Tasks assigned to you</h2>
        </div>
        <div id="taskList" class="task-list">
          <div class="loading">LOADING</div>
        </div>
      </div>

      <aside class="panel" id="detailPanel">
        <div class="panel-header">
          <div class="eyebrow">Task Detail</div>
          <h2>Select a task</h2>
        </div>
        <div class="empty">Open a task to see instructions, message templates, attachments, and completion controls.</div>
      </aside>
    </section>
  </main>

  <script>
    var appState = {
      token: '',
      user: null,
      view: 'mine',
      selectedTaskId: '',
      detail: null,
      userAdmin: null,
      calendarMonth: '',
      calendarAppointments: [],
      diamondTrackingRows: [],
      inStockDiamondsRows: [],
      inStockDiamondsSource: null,
      inStockDiamondFilters: {
        shape: '',
        caratMin: '',
        caratMax: '',
        color: '',
        clarity: ''
      },
      bulkReturnRows: [],
      bulkReturnSource: null,
      mainRequestId: 0,
      detailRequestId: 0,
      lastActionButton: null,
      loginBusy: false,
      busy: false
    };

    function bindEvents() {
      document.addEventListener('click', function (event) {
        var button = closestMatch_(event.target, 'button');
        if (!button || button.disabled) return;
        appState.lastActionButton = button;
        window.setTimeout(function () {
          if (appState.lastActionButton === button) appState.lastActionButton = null;
        }, 0);
      }, true);

      var loginButton = document.getElementById('loginButton');
      if (loginButton) loginButton.addEventListener('click', login);
      var loginPassword = document.getElementById('loginPassword');
      if (loginPassword) {
        loginPassword.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') login();
        });
      }

      var logoutButton = document.getElementById('logoutButton');
      if (logoutButton) logoutButton.addEventListener('click', logout);

      var manageUsersButton = document.getElementById('manageUsersButton');
      if (manageUsersButton) manageUsersButton.addEventListener('click', openUserAdminPanel);

      ['mine', 'calendar', 'inStockDiamonds', 'diamondTracking', 'bulkReturns', 'coverage', 'admin'].forEach(function (view) {
        var tab = document.getElementById('tab-' + view);
        if (!tab) return;
        tab.addEventListener('click', function () {
          if (view === 'calendar') loadCalendar();
          else if (view === 'inStockDiamonds') loadInStockDiamonds();
          else if (view === 'diamondTracking') loadDiamondTracking();
          else if (view === 'bulkReturns') loadBulkReturns();
          else loadTasks(view);
        });
      });

      var refreshOwnersButton = document.getElementById('refreshOwnersButton');
      if (refreshOwnersButton) refreshOwnersButton.addEventListener('click', refreshOwners);

      var generateTasksButton = document.getElementById('generateTasksButton');
      if (generateTasksButton) generateTasksButton.addEventListener('click', generateTasks);

      var taskList = document.getElementById('taskList');
      if (taskList) {
        taskList.addEventListener('click', function (event) {
          var stockClearButton = closestMatch_(event.target, '.js-stock-filter-clear');
          if (stockClearButton) {
            clearInStockDiamondFilters();
            return;
          }
          var bulkSelectButton = closestMatch_(event.target, '.js-bulk-return-select');
          if (bulkSelectButton) {
            selectBulkReturnRows(bulkSelectButton.getAttribute('data-select-mode') || '');
            return;
          }
          var calendarButton = closestMatch_(event.target, '.js-calendar-appt');
          if (calendarButton) {
            renderCalendarAppointmentDetail(calendarButton.getAttribute('data-appointment-id') || '');
            return;
          }
          var trackingButton = closestMatch_(event.target, '.js-diamond-tracking-row');
          if (trackingButton) {
            renderDiamondTrackingDetail(trackingButton.getAttribute('data-row-index') || '');
            return;
          }
          var stockButton = closestMatch_(event.target, '.js-instock-diamond-row');
          if (stockButton) {
            renderInStockDiamondDetail(stockButton.getAttribute('data-row-index') || '');
            return;
          }
          var button = closestMatch_(event.target, '.js-open-task');
          if (!button) return;
          openTask(button.getAttribute('data-task-id') || '');
        });
        taskList.addEventListener('change', function (event) {
          if (closestMatch_(event.target, '.js-stock-filter')) {
            updateInStockDiamondFilters();
            return;
          }
          if (closestMatch_(event.target, '.js-bulk-return-checkbox')) {
            updateBulkReturnActionPanel();
          }
        });
      }

      var detailPanel = document.getElementById('detailPanel');
      if (detailPanel) {
        detailPanel.addEventListener('click', function (event) {
          if (closestMatch_(event.target, '.js-copy-template')) return copyTemplate();
          if (closestMatch_(event.target, '.js-copy-manufacturing')) return copyManufacturingMessage();
          if (closestMatch_(event.target, '.js-snooze-task')) return snoozeTask();
          var refreshButton = closestMatch_(event.target, '.js-refresh-diamond-quote');
          if (refreshButton) return refreshDiamondQuote(refreshButton.getAttribute('data-mode') || 'all');
          var copyStockButton = closestMatch_(event.target, '.js-copy-stock-diamond');
          if (copyStockButton) return copyStockDiamondDetails(copyStockButton.getAttribute('data-row-index') || '');
          var bulkReturnButton = closestMatch_(event.target, '.js-submit-bulk-return');
          if (bulkReturnButton) return submitBulkReturn(bulkReturnButton);
          var addProposalButton = closestMatch_(event.target, '.js-add-proposal-row');
          if (addProposalButton) return addProposalRow();
          var removeProposalButton = closestMatch_(event.target, '.js-remove-proposal-row');
          if (removeProposalButton) return removeProposalRow(removeProposalButton);
          if (closestMatch_(event.target, '.js-claim-task')) return claimTask();
          if (closestMatch_(event.target, '.js-complete-task')) return completeTask();
          if (closestMatch_(event.target, '.js-admin-save-assignment')) return adminSaveAssignment();
          if (closestMatch_(event.target, '.js-admin-block')) return adminBlock();
          if (closestMatch_(event.target, '.js-admin-unblock')) return adminUnblock();
          if (closestMatch_(event.target, '.js-admin-generate-password')) return fillGeneratedUserPassword();
          if (closestMatch_(event.target, '.js-admin-save-user')) return saveWorkflowUser();
        });
        detailPanel.addEventListener('change', function () {
          updateCompleteButtonState();
        });
        detailPanel.addEventListener('input', function () {
          updateCompleteButtonState();
        });
      }
    }

    function closestMatch_(target, selector) {
      return target && target.closest ? target.closest(selector) : null;
    }

    function setStatus(message, isError) {
      var el = document.getElementById('status');
      el.textContent = message || '';
      el.className = isError ? 'status error' : 'status';
    }

    function setLoginStatus(message) {
      document.getElementById('loginStatus').textContent = message || '';
    }

    function setLoginBusy(isBusy) {
      appState.loginBusy = !!isBusy;
      var button = document.getElementById('loginButton');
      var email = document.getElementById('loginEmail');
      var password = document.getElementById('loginPassword');
      if (button) {
        button.disabled = !!isBusy;
        button.textContent = isBusy ? 'Signing In' : 'Sign In';
      }
      if (email) email.disabled = !!isBusy;
      if (password) password.disabled = !!isBusy;
    }

    function setBusy(isBusy, message) {
      appState.busy = isBusy;
      if (message) {
        setStatus(message);
      } else if (!isBusy) {
        setStatus('');
      }
    }

    function lockLoadingButton(sourceButton) {
      var button = sourceButton || appState.lastActionButton;
      if (!button || !document.documentElement.contains(button) || button.disabled) return null;
      button.disabled = true;
      button.classList.add('is-loading');
      button.setAttribute('aria-busy', 'true');
      return button;
    }

    function releaseLoadingButton(button) {
      if (!button) return;
      button.classList.remove('is-loading');
      button.removeAttribute('aria-busy');
      if (document.documentElement.contains(button)) button.disabled = false;
    }

    function serverCall(fnName, args, onSuccess, busyMessage, sourceButton) {
      var loadingButton = lockLoadingButton(sourceButton);
      setBusy(true, busyMessage || 'Working');
      var callArgs = args || [];
      if (fnName !== 'sw_login') callArgs = [appState.token].concat(callArgs);
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          onSuccess(response || {});
        })
        .withFailureHandler(function (err) {
          setBusy(false, '');
          releaseLoadingButton(loadingButton);
          var message = (err && err.message) ? err.message : String(err);
          if (fnName === 'sw_login') {
            setLoginBusy(false);
            setLoginStatus(message);
          }
          else if (fnName === 'sw_getBootstrap' && !appState.user) {
            appState.token = '';
            sessionStorage.removeItem('salesWorkflowToken');
            showLogin();
            setLoginStatus(message);
          }
          else setStatus(message, true);
        });
      runner[fnName].apply(runner, callArgs);
    }

    function beginMainRequest(view) {
      appState.mainRequestId += 1;
      appState.view = view;
      return appState.mainRequestId;
    }

    function isCurrentMainRequest(requestId, view) {
      return requestId === appState.mainRequestId && appState.view === view;
    }

    function init() {
      appState.token = sessionStorage.getItem('salesWorkflowToken') || '';
      if (!appState.token) {
        showLogin();
        return;
      }
      bootstrap();
    }

    function bootstrap() {
      var requestId = beginMainRequest('mine');
      serverCall('sw_getBootstrap', [], function (res) {
        showApp();
        appState.user = res.user;
        renderUser(res);
        if (!isCurrentMainRequest(requestId, 'mine')) return;
        appState.view = 'mine';
        setActiveTab(appState.view);
        renderViewHeader(appState.view);
        renderTasks(res.tasks || []);
        if (res.message) setStatus(res.message);
      });
    }

    function showLogin() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
      setLoginBusy(false);
      setLoginStatus('');
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = '';
    }

    function login() {
      if (appState.loginBusy || appState.busy) return;
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      setLoginBusy(true);
      setLoginStatus('Signing in');
      serverCall('sw_login', [email, password], function (res) {
        setLoginStatus('Opening dashboard');
        appState.token = res.token || '';
        appState.user = res.user || null;
        sessionStorage.setItem('salesWorkflowToken', appState.token);
        showApp();
        renderUser({
          user: appState.user || {},
          views: clientViewsForUser(appState.user || {})
        });
        document.getElementById('taskList').innerHTML = '<div class="loading">LOADING TASKS</div>';
        bootstrap();
      }, 'Signing in');
    }

    function clientViewsForUser(user) {
      user = user || {};
      return {
        mine: true,
        calendar: true,
        inStockDiamonds: true,
        diamondTracking: !!(user.isAdmin || user.isDiamondOrderAdmin || user.isDiamondOrderAssistant),
        bulkReturns: !!(user.isAdmin || user.isDiamondOrderAdmin),
        coverage: !!(user.isJoc || user.isAdmin),
        admin: !!user.isAdmin
      };
    }

    function logout() {
      serverCall('sw_logout', [], function () {
        appState.token = '';
        sessionStorage.removeItem('salesWorkflowToken');
        appState.user = null;
        showLogin();
      }, 'Signing out');
    }

    function renderUser(res) {
      var user = res.user || {};
      var parts = [];
      parts.push(escapeHtml(user.name || user.email || 'Unknown user'));
      if (user.isAdmin) parts.push('Admin');
      if (user.isJoc) parts.push('JOC');
      if (user.isDiamondOrderAdmin) parts.push('Diamond Order Admin');
      if (user.isDiamondOrderAssistant) parts.push('Diamond Order Assistant');
      document.getElementById('userLine').innerHTML = parts.join('<br>');
      document.getElementById('tab-inStockDiamonds').style.display = res.views && res.views.inStockDiamonds !== false ? '' : 'none';
      document.getElementById('tab-diamondTracking').style.display = res.views && res.views.diamondTracking ? '' : 'none';
      document.getElementById('tab-bulkReturns').style.display = res.views && res.views.bulkReturns ? '' : 'none';
      document.getElementById('tab-coverage').style.display = res.views && res.views.coverage ? '' : 'none';
      document.getElementById('tab-admin').style.display = res.views && res.views.admin ? '' : 'none';
      document.getElementById('manageUsersButton').style.display = user.isAdmin ? '' : 'none';

    function loadTasks(view) {
      if (view === 'calendar') {
        loadCalendar(appState.calendarMonth);
        return;
      }
      if (view === 'inStockDiamonds') {
        loadInStockDiamonds();
        return;
      }
      if (view === 'diamondTracking') {
        loadDiamondTracking();
        return;
      }
      if (view === 'bulkReturns') {
        loadBulkReturns();
        return;
      }
      var viewName = view || 'mine';

      setActiveTab(viewName);
      renderViewHeader(viewName);
      document.getElementById('taskList').innerHTML = '<div class="loading">LOADING</div>';
      serverCall('sw_getMyTasks', [viewName], function (res) {
        if (!isCurrentMainRequest(requestId, viewName)) return;
        renderTasks(res.tasks || []);
      });
    }

    function setActiveTab(view) {
      ['mine', 'calendar', 'inStockDiamonds', 'diamondTracking', 'bulkReturns', 'coverage', 'admin'].forEach(function (v) {
        var el = document.getElementById('tab-' + v);

    function loadCalendar(monthKey) {

      serverCall('sw_getCalendarAppointments', [appState.calendarMonth], function (res) {

    function renderCalendar(res) {
      res = res || {};
      var days = calendarDays(res.monthKey || currentMonthKey(), res.appointments || [], res.todayKey || currentDateKey());
      var weekdayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

          weekdayLabels.map(function (label) { return '<div class="calendar-weekday">' + escapeHtml(label) + '</div>'; }).join(''),
          days.map(renderCalendarDay).join(''),
        '</div>'
      ].join('');

      var prev = document.querySelector('.js-calendar-prev');
      var next = document.querySelector('.js-calendar-next');
      if (prev) prev.addEventListener('click', function () { loadCalendar(res.prevMonthKey); });
      if (next) next.addEventListener('click', function () { loadCalendar(res.nextMonthKey); });

            ].join('');

          appointments.length > visible.length ? '<div class="calendar-more">+' + escapeHtml(appointments.length - visible.length) + ' more</div>' : '',
        '</div>'
      ].join('');

    function renderInStockDiamonds(res) {
      res = res || {};

        : '<div class="empty"><h3>No in-stock diamonds found</h3><p>Delivered/In Stock diamonds that are not already purchased or being returned will appear here.</p></div>';

    function renderInStockDiamondFilters(rows, filteredCount) {

      return [

          '<div class="stock-filter-heading">',
            '<div class="meta">Showing ' + escapeHtml(filteredCount) + ' of ' + escapeHtml(total) + ' diamond(s)</div>',
            active ? '<button class="js-stock-filter-clear" type="button">Clear Filters</button>' : '',
          '</div>',
          '<div class="stock-filter-grid">',
            stockFilterSelectHtml('shape', 'Shape', uniqueStockFilterValues(rows, 'shape'), filters.shape),
            stockFilterInputHtml('caratMin', 'Carat Min', filters.caratMin),
            stockFilterInputHtml('caratMax', 'Carat Max', filters.caratMax),
            stockFilterSelectHtml('color', 'Color', uniqueStockFilterValues(rows, 'color', ['D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'Fancy']), filters.color),
            stockFilterSelectHtml('clarity', 'Clarity', uniqueStockFilterValues(rows, 'clarity', ['FL', 'IF', 'VVS1', 'VVS2', 'VS1', 'VS2', 'SI1', 'SI2', 'I1', 'I2']), filters.clarity),
          '</div>',
        '</div>'
      ].join('');
    }

    function stockFilterSelectHtml(name, label, options, selected) {
      var id = 'stockFilter' + name.charAt(0).toUpperCase() + name.slice(1);
      var tags = ['<option value="">All</option>'].concat((options || []).map(function (option) {
        var value = String(option || '');
        return '<option value="' + escapeAttrValue(value) + '"' + (norm(value) === norm(selected) ? ' selected' : '') + '>' + escapeHtml(value) + '</option>';
      })).join('');
      return '<div><label for="' + escapeAttrValue(id) + '">' + escapeHtml(label) + '</label><select id="' + escapeAttrValue(id) + '" class="js-stock-filter" data-filter="' + escapeAttrValue(name) + '">' + tags + '</select></div>';
    }

    function stockFilterInputHtml(name, label, value) {
      var id = 'stockFilter' + name.charAt(0).toUpperCase() + name.slice(1);
      return '<div><label for="' + escapeAttrValue(id) + '">' + escapeHtml(label) + '</label><input id="' + escapeAttrValue(id) + '" class="js-stock-filter" data-filter="' + escapeAttrValue(name) + '" type="number" min="0" step="0.01" value="' + escapeAttrValue(value || '') + '"></div>';
    }

    function uniqueStockFilterValues(rows, field, gradeOrder) {
      var seen = {};
      var values = [];
      (rows || []).forEach(function (row) {
        var value = String(row && row[field] || '').trim();
        var key = norm(value);
        if (!value || seen[key]) return;
        seen[key] = true;
        values.push(value);
      });
      if (gradeOrder && gradeOrder.length) {
        var gradeRank = {};
        gradeOrder.forEach(function (grade, index) {
          gradeRank[String(grade).toUpperCase()] = index;
        });
        values.sort(function (a, b) {
          var ai = gradeRank[String(a).toUpperCase()];
          var bi = gradeRank[String(b).toUpperCase()];
          if (ai == null && bi == null) return String(a).localeCompare(String(b));
          if (ai == null) return 1;
          if (bi == null) return -1;
          return ai - bi || String(a).localeCompare(String(b));
        });
        return values;
      }
      return values.sort(function (a, b) { return String(a).localeCompare(String(b)); });
    }

    function currentInStockDiamondFilters() {
      if (!appState.inStockDiamondFilters) {
        appState.inStockDiamondFilters = { shape: '', caratMin: '', caratMax: '', color: '', clarity: '' };
      }
      return appState.inStockDiamondFilters;
    }

    function updateInStockDiamondFilters() {
      var filters = currentInStockDiamondFilters();
      [].slice.call(document.querySelectorAll('.js-stock-filter')).forEach(function (field) {
        filters[field.getAttribute('data-filter')] = field.value;
      });
      appState.inStockDiamondFilters = filters;
      renderInStockDiamonds(appState.inStockDiamondsSource || { available: true, rows: appState.inStockDiamondsRows || [], stats: {} });
    }

    function clearInStockDiamondFilters() {
      appState.inStockDiamondFilters = { shape: '', caratMin: '', caratMax: '', color: '', clarity: '' };
      renderInStockDiamonds(appState.inStockDiamondsSource || { available: true, rows: appState.inStockDiamondsRows || [], stats: {} });
    }

    function hasActiveInStockDiamondFilters(filters) {
      filters = filters || {};
      return !!(filters.shape || filters.caratMin || filters.caratMax || filters.color || filters.clarity);
    }

    function filteredInStockDiamondRows(rows) {
      var filters = currentInStockDiamondFilters();
      var caratMin = stockCaratNumber(filters.caratMin);
      var caratMax = stockCaratNumber(filters.caratMax);
      return (rows || []).filter(function (row) {
        if (filters.shape && norm(row.shape) !== norm(filters.shape)) return false;
        if (filters.color && norm(row.color) !== norm(filters.color)) return false;
        if (filters.clarity && norm(row.clarity) !== norm(filters.clarity)) return false;
        if (!isNaN(caratMin) || !isNaN(caratMax)) {
          var carat = stockCaratNumber(row.carat);
          if (isNaN(carat)) return false;
          if (!isNaN(caratMin) && carat < caratMin) return false;
          if (!isNaN(caratMax) && carat > caratMax) return false;
        }

    function calendarDays(monthKey, appointments, todayKey) {
      var first = monthDate(monthKey);
      var start = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
      var byDate = {};
      (appointments || []).forEach(function (appt) {
        if (!byDate[appt.dateKey]) byDate[appt.dateKey] = [];
        byDate[appt.dateKey].push(appt);
      });
      var days = [];
      for (var i = 0; i < 42; i++) {
        var date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        var key = dateKey(date);
        days.push({
          dateKey: key,
          dayNumber: date.getDate(),
          inMonth: date.getMonth() === first.getMonth(),
          isToday: key === todayKey,
          appointments: byDate[key] || []
        });
      }
      return days;
    }

    function currentMonthKey() {
      var now = new Date();
      return now.getFullYear() + '-' + pad2(now.getMonth() + 1);
    }

    function currentDateKey() {
      return dateKey(new Date());
    }

    function monthDate(monthKey) {
      var parts = String(monthKey || currentMonthKey()).split('-');
      var year = Number(parts[0]) || new Date().getFullYear();
      var month = (Number(parts[1]) || (new Date().getMonth() + 1)) - 1;
      return new Date(year, month, 1);
    }

    function dateKey(date) {
      return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function formatCalendarTime(value) {
      var s = String(value == null ? '' : value).trim();
      if (!s) return '';
      var m12 = /^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*(AM|PM)$/i.exec(s);
      if (m12) {
        var hour12 = Number(m12[1]);
        if (!hour12) hour12 = 12;
        hour12 = ((hour12 - 1) % 12) + 1;
        return pad2(hour12) + ':' + m12[2] + ' ' + m12[3].toLowerCase();
      }
      var m24 = /^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?$/.exec(s);
      if (m24) {
        var hour24 = Number(m24[1]);
        var minute = Number(m24[2]);
        if (hour24 >= 0 && hour24 <= 23 && minute >= 0 && minute <= 59) {
          return pad2((hour24 % 12) || 12) + ':' + pad2(minute) + ' ' + (hour24 < 12 ? 'am' : 'pm');
        }
      }
      return s.replace(/:(\d{2})(\s*[AP]M)$/i, function (_match, _seconds, suffix) {
        return ' ' + suffix.trim().toLowerCase();
      }).replace(/\s*(AM|PM)$/i, function (_match, suffix) {
        return ' ' + suffix.toLowerCase();
      });
    }

    function taskBrandCode(brand) {
      var b = String(brand || '').trim().toUpperCase();
      if (!b) return '';
      if (b.normalize) b = b.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      b = b.replace(/[^A-Z0-9]+/g, ' ');
      if (/\bVVS\b/.test(b) || b.indexOf('VVS JEWELRY') >= 0) return 'VVS';
      if (/\bHP\b/.test(b) || b.indexOf('HPUSA') >= 0 || b.indexOf('HUNG PHAT') >= 0) return 'HP';
      return '';
    }

    function taskBrandChipHtml(brand) {
      var code = taskBrandCode(brand);
      if (!code) return '';
      return '<span class="brand-chip ' + (code === 'HP' ? 'hp' : 'vvs') + '">' + escapeHtml(code) + '</span>';
    }

        if (detailRequestId !== appState.detailRequestId ||
            mainRequestId !== appState.mainRequestId ||
            appState.selectedTaskId !== taskId) return;

    function renderDetail(res) {

      var messageBlocks = clientMessage ? attachments + template : template + attachments;
      var checklist = renderChecklist(res.checklist || []);

    function selectFieldHtml(id, label, options, selected, required) {
      return '<div><label for="' + escapeAttrValue(id) + '">' + escapeHtml(label) + (required ? ' *' : '') + '</label><select id="' + escapeAttrValue(id) + '">' + optionTags(options, selected) + '</select></div>';
    }

    function selectInlineHtml(className, options, selected) {
      return '<select class="' + escapeAttrValue(className) + '">' + optionTags(options, selected) + '</select>';
    }

    function optionTags(options, selected) {
      var seen = {};
      options = options && options.length ? options : [''];
      if (String(options[0] || '') !== '') options = [''].concat(options);
      return options.filter(function (option) {
        var key = String(option || '');
        if (seen[key]) return false;
        seen[key] = true;
        return true;
      }).map(function (option) {
        var v = String(option || '');
        return '<option value="' + escapeAttrValue(v) + '"' + (v === String(selected || '') ? ' selected' : '') + '>' + escapeHtml(v || 'Select') + '</option>';
      }).join('');
    }

    function start3dBrandDefault(brand) {
      var b = norm(brand);
      if (b.indexOf('vvs') >= 0) return 'VVS';
      return 'HPUSA';
    }

    function dateInputValue(value) {
      value = String(value || '').trim();
      var iso = /^(\d{4}-\d{2}-\d{2})/.exec(value);
      if (iso) return iso[1];
      var mdy = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(value);
      if (mdy) return mdy[3] + '-' + ('0' + mdy[1]).slice(-2) + '-' + ('0' + mdy[2]).slice(-2);
      return '';
    }

    function saveWorkflowUser() {
      var status = document.getElementById('userAdminStatus');
      if (status) status.textContent = '';
      var payload = {
        email: valueOf('userAdminEmail'),
        name: valueOf('userAdminName'),
        password: valueOf('userAdminPassword'),
        notes: valueOf('userAdminNotes'),
        roles: [].slice.call(document.querySelectorAll('.user-role-option:checked')).map(function (el) { return el.value; })
      };
      serverCall('sw_adminUpsertWorkflowUser', [payload], function (res) {
        var message = 'Saved ' + (res.email || payload.email) + '. Password: ' + (res.password || payload.password || 'unchanged');
        if (status) status.textContent = message;
        setStatus('Workflow user saved');
        serverCall('sw_adminListWorkflowUsers', [], function (list) {
          appState.userAdmin = list;
          renderUserAdminPanel(list);
          var nextStatus = document.getElementById('userAdminStatus');
          if (nextStatus) nextStatus.textContent = message;
        });
      }, 'Saving user');

    function clientGeneratedPassword() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
      var out = '';
      for (var i = 0; i < 14; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    function completionPayload() {
      var detail = appState.detail || {};
      var task = detail.task || {};
      var payload = { checklist: {} };
      (detail.checklist || []).forEach(function (item) {
        var el = document.getElementById('check-' + item.id);
        payload.checklist[item.id] = !!(el && el.checked);
      });
      var text = document.getElementById('completionText');
      if (text && task.taskType === 'PROCESS_APPOINTMENT_DATA') payload.recapText = text.value;
      if (text && task.taskType === 'APPROVE_RECAP_MESSAGE') payload.approvedText = text.value;
      if (task.taskType === 'PROPOSE_DIAMONDS') {
        payload.proposalStones = collectProposalStones();
        payload.customerDiamondRequirements = collectCustomerDiamondRequirements();
      }
      if (task.taskType === 'ORDER_DIAMONDS') {
        payload.orderedDate = valueOf('orderedDate');
        payload.diamondOrderDecisions = [].slice.call(document.querySelectorAll('.diamond-order-decision')).map(function (select) {
          var row = select.closest('.mini-row');
          return { rowIndex: row ? row.getAttribute('data-row-index') : '', decision: select.value };
        });
      }
      if (task.taskType === 'TRACK_DIAMONDS') {
        payload.trackingEta = valueOf('trackingEta');
        payload.trackingStatus = valueOf('trackingStatus');
        payload.carrier = valueOf('carrier');
        payload.trackingNumber = valueOf('trackingNumber');
        payload.trackingUrl = valueOf('trackingUrl');
        payload.trackingNotes = valueOf('trackingNotes');
      }
      if (task.taskType === 'CONFIRM_DIAMOND_DELIVERY') {
        payload.memoDate = valueOf('memoDate');
      }
      if (task.taskType === 'RECORD_DIAMOND_DECISIONS') {
        payload.diamondDecisions = [].slice.call(document.querySelectorAll('.diamond-stone-decision')).map(function (select) {
          var row = select.closest('.mini-row');
          var hold = row ? row.querySelector('.diamond-hold') : null;
          return { rowIndex: row ? row.getAttribute('data-row-index') : '', decision: select.value, hold: !!(hold && hold.checked) };
        }).filter(function (item) { return item.decision; });
      }
      if (task.taskType === 'POST_CONSULT_CLIENT_STATUS') {
        payload.salesStage = valueOf('pcSalesStage');
        payload.convStatus = valueOf('pcConvStatus');
        payload.customOrder = valueOf('pcCustomOrder');
        payload.centerStone = valueOf('pcCenterStone');
        payload.inProduction = valueOf('pcInProduction');
        payload.orderDate = valueOf('pcOrderDate');
        payload.deadline3d = valueOf('pcDeadline3d');
        payload.prodDeadline = valueOf('pcProdDeadline');
        payload.threeDNeeded = valueOf('pcThreeDNeeded');
        payload.no3dReason = valueOf('pcNo3dReason');
        payload.designRequest = valueOf('pcDesignRequest');
        payload.nextSteps = valueOf('pcNextSteps');
        payload.waxNeeded = valueOf('pcWaxNeeded');
        payload.waxNeededBy = valueOf('pcWaxNeededBy');
        payload.waxPriority = valueOf('pcWaxPriority');
      }
      if (task.taskType === 'START_3D_DESIGN') {
        payload.start3dMode = checkedOf('s3dNo3d') ? 'no3d' : 'start';
        payload.no3d = checkedOf('s3dNo3d');
        payload.no3dReason = valueOf('s3dNo3dReason');
        payload.brand = valueOf('s3dBrand');
        payload.so = valueOf('s3dSo');
        payload.odooUrl = valueOf('s3dOdooUrl');
        payload.shortTag = valueOf('s3dShortTag');
        payload.shape = valueOf('s3dShape');
        payload.ringStyle = valueOf('s3dRingStyle');
        payload.designRequest = valueOf('s3dDesignRequest');
        payload.waxNeeded = valueOf('s3dWaxNeeded');
        payload.waxNeededBy = valueOf('s3dWaxNeededBy');
        payload.waxPriority = valueOf('s3dWaxPriority');
      }
      if (task.taskType === 'RECORD_3D_DEADLINE') {
        payload.deadline3d = valueOf('deadline3dTask');
        payload.note = valueOf('deadline3dNote');
      }
      if (task.taskType === 'REQUEST_WAX_PRINT') {
        payload.soMo = valueOf('waxSoMo');
        payload.neededByRep = valueOf('waxNeededBy');
        payload.priority = valueOf('waxPriority');
        payload.notes = valueOf('waxRequestNotes');
      }
      if (task.taskType === 'UPDATE_WAX_REQUEST') {
        payload.waxUpdates = [].slice.call(document.querySelectorAll('.wax-update-row')).map(function (row) {
          return {
            id: row.getAttribute('data-wax-id') || '',
            status: (row.querySelector('.waxStatus') || {}).value || '',
            adminDeadline: (row.querySelector('.waxAdminDeadline') || {}).value || '',
            estPrint: (row.querySelector('.waxEstPrint') || {}).value || '',
            completed: (row.querySelector('.waxCompleted') || {}).value || '',
            notes: (row.querySelector('.waxNotes') || {}).value || ''
          };
        }).filter(function (item) { return item.id; });
      }
      return payload;
    }

    function collectProposalStones() {
      return [].slice.call(document.querySelectorAll('.proposal-row')).map(function (row) {
        var stone = {};
        [].slice.call(row.querySelectorAll('.proposal-field')).forEach(function (field) {
          stone[field.getAttribute('data-field')] = field.value;
        });
        return stone;
      }).filter(function (stone) {
        return !!(stone.certNo || stone.shape || stone.carat || stone.vendor);
      });
    }

    function collectCustomerDiamondRequirements() {
      var requirements = {};
      [].slice.call(document.querySelectorAll('.requirement-field')).forEach(function (field) {
        requirements[field.getAttribute('data-field')] = field.value;
      });
      requirements.varietyFocus = [].slice.call(document.querySelectorAll('.requirement-variety:checked')).map(function (field) {
        return field.value;
      });
      return requirements;
    }

    function missingCustomerDiamondRequirements(requirements) {
      requirements = requirements || {};
      var missing = [];
      if (!String(requirements.summary || '').trim()) missing.push('customer brief');
      if (!String(requirements.primaryDecisionFactor || '').trim()) missing.push('primary deciding factor');
      if (!requirements.varietyFocus || !requirements.varietyFocus.length) missing.push('variety to show');
      return missing;
    }

    function updateCustomerDiamondRequirementStatus(missing) {
      var el = document.getElementById('proposalRequirementStatus');
      if (!el) return;
      el.textContent = missing && missing.length ? 'Complete required customer requirements: ' + missing.join(', ') + '.' : '';
    }

    function updateCompleteButtonState() {
      var button = document.querySelector('.js-complete-task');
      if (!button) return;
      var detail = appState.detail || {};
      var task = detail.task || {};
      var disabled = false;
      (detail.checklist || []).forEach(function (item) {
        if (item.required === false) return;
        var el = document.getElementById('check-' + item.id);
        if (!el || !el.checked) disabled = true;
      });
      if (task.taskType === 'ORDER_DIAMONDS') {
        var selects = [].slice.call(document.querySelectorAll('.diamond-order-decision'));
        if (selects.length && selects.some(function (select) { return !select.value; })) disabled = true;
      }
      if (task.taskType === 'PROPOSE_DIAMONDS' && !collectProposalStones().length) {
        disabled = true;
      }
      if (task.taskType === 'PROPOSE_DIAMONDS') {
        var missingRequirements = missingCustomerDiamondRequirements(collectCustomerDiamondRequirements());
        if (missingRequirements.length) disabled = true;
        updateCustomerDiamondRequirementStatus(missingRequirements);
      }
      if (task.taskType === 'POST_CONSULT_CLIENT_STATUS') {
        if (!valueOf('pcSalesStage') || !valueOf('pcConvStatus') || !valueOf('pcThreeDNeeded')) disabled = true;
        if (norm(valueOf('pcThreeDNeeded')) === 'no' && !valueOf('pcNo3dReason')) disabled = true;
      }
      if (task.taskType === 'START_3D_DESIGN') {
        if (checkedOf('s3dNo3d')) {
          if (!valueOf('s3dNo3dReason')) disabled = true;
        } else if (!valueOf('s3dBrand') || !valueOf('s3dSo') || !valueOf('s3dOdooUrl')) {
          disabled = true;
        }
      }
      if (task.taskType === 'RECORD_3D_DEADLINE' && !valueOf('deadline3dTask')) disabled = true;
      if (task.taskType === 'REQUEST_WAX_PRINT' && (!valueOf('waxSoMo') || !valueOf('waxNeededBy') || !valueOf('waxPriority'))) disabled = true;
      button.disabled = disabled;
      button.title = disabled ? 'Complete required checklist items, customer requirements, and diamond decisions first.' : '';
    }

    function valueOf(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    function checkedOf(id) {
      var el = document.getElementById(id);
      return !!(el && el.checked);
    }

    function completeTask() {
      if (!appState.selectedTaskId) return;
      serverCall('sw_completeTask', [appState.selectedTaskId, completionPayload()], function () {
        setStatus('Task completed');
        loadTasks(appState.view);
        appState.selectedTaskId = '';
        document.getElementById('detailPanel').innerHTML = '<div class="panel-header"><div class="eyebrow">Task Detail</div><h2>Select a task</h2></div><div class="empty">Open a task to see instructions, message templates, attachments, and completion controls.</div>';
      });
    }

    function snoozeTask() {
      if (!appState.selectedTaskId) return;
      var payload = {
        untilDate: valueOf('snoozeUntil'),
        reason: valueOf('snoozeReason')
      };
      serverCall('sw_snoozeTask', [appState.selectedTaskId, payload], function () {
        setStatus('Task snoozed');
        loadTasks(appState.view);
        appState.selectedTaskId = '';
        document.getElementById('detailPanel').innerHTML = '<div class="panel-header"><div class="eyebrow">Task Detail</div><h2>Select a task</h2></div><div class="empty">Open a task to see instructions, message templates, attachments, and completion controls.</div>';
      });
    }

    function claimTask() {
      if (!appState.selectedTaskId) return;
      serverCall('sw_claimTask', [appState.selectedTaskId], function () {
        setStatus('Task claimed');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function adminSaveAssignment() {
      if (!appState.selectedTaskId) return;
      if (document.getElementById('adminAssignedRep') || document.getElementById('adminAssistedRep')) {
        var payload = {
          assignedRep: valueOf('adminAssignedRep'),
          assistedRep: valueOf('adminAssistedRep'),
          reason: valueOf('adminReason')
        };
        serverCall('sw_adminAssignAppointmentOwners', [appState.selectedTaskId, payload], function (res) {
          setStatus('Assignment saved: ' + (res.rowsUpdated || 0) + ' appointment row(s) updated');
          openTask(appState.selectedTaskId);
          loadTasks(appState.view);
        }, 'Saving assignment');
        return;
      }
      serverCall('sw_adminReassignTask', [
        appState.selectedTaskId,
        valueOf('adminOwnerName'),
        valueOf('adminOwnerEmail'),
        valueOf('adminReason')
      ], function () {
        setStatus('Assignment saved');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      }, 'Saving assignment');
    }

    function adminBlock() {
      if (!appState.selectedTaskId) return;
      var reason = document.getElementById('adminReason').value || 'Admin blocked';
      serverCall('sw_adminBlockTask', [appState.selectedTaskId, reason], function () {
        setStatus('Task blocked');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function adminUnblock() {
      if (!appState.selectedTaskId) return;
      var reason = document.getElementById('adminReason').value || '';
      serverCall('sw_adminUnblockTask', [appState.selectedTaskId, reason], function () {
        setStatus('Task unblocked');
        openTask(appState.selectedTaskId);
        loadTasks(appState.view);
      });
    }

    function generateTasks() {
      setStatus('Generating tasks. This can take a minute on the first run.');
      serverCall('sw_generateSalesWorkflowTasks', [], function (res) {
        setStatus('Generated: ' + (res.created || 0) + ' created, ' + (res.updated || 0) + ' updated');
        loadTasks(appState.view);
      }, 'Generating tasks. This can take a minute on the first run.');
    }

    function refreshOwners() {
      setStatus('Refreshing task owners.');
      serverCall('sw_refreshTaskOwners', [], function (res) {
        setStatus('Owners refreshed: ' + (res.updated || 0) + ' updated');
        loadTasks(appState.view);
      }, 'Refreshing task owners.');
    }

    function copyTemplate() {
      var text = document.getElementById('renderedTemplate');
      if (!text) return;
      var copyText = text.textContent || '';
      var clientMessage = appState.detail && isClientMessageTaskType((appState.detail.task || {}).taskType);
      if (clientMessage) {
        copyText = stripGoogleDriveLinksForCopy_(copyText);
      }
      navigator.clipboard.writeText(copyText).then(function () {
        setStatus(clientMessage ? 'Message copied' : 'Template copied');
        if (appState.selectedTaskId) {
          google.script.run.sw_logTemplateCopied(appState.token, appState.selectedTaskId);
        }
      }, function () {
        setStatus('Copy failed. Select the template text manually.', true);
      });
    }

    function isClientMessageTaskType(taskType) {
      return ['SEND_WELCOME', 'SEND_HYBRID_WELCOME', 'SEND_MAP_INSTRUCTIONS', 'SEND_FINAL_RECAP'].indexOf(taskType) >= 0;
    }

    function stripGoogleDriveLinksForCopy_(text) {
      return String(text || '')
        .replace(/\b(?:https?:\/\/)?(?:drive|docs)\.google\.com\/[^\s<>"')]+/gi, '')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function copyManufacturingMessage() {
      var text = document.getElementById('manufacturingMessage');
      if (!text) return;
      navigator.clipboard.writeText(text.textContent || '').then(function () {
        setStatus('Manufacturing message copied');
      }, function () {
        setStatus('Copy failed. Select the manufacturing message manually.', true);
      });
    }

    function refreshDiamondQuote(mode) {
      if (!appState.selectedTaskId) return;
      var fn = mode === 'diamonds' ? 'sw_refreshDiamondQuoteFromTracking' :
        mode === 'settings' ? 'sw_refreshDiamondQuoteFrom3D' : 'sw_refreshDiamondQuoteAll';
      serverCall(fn, [appState.selectedTaskId], function (res) {
        setStatus('Quotation refreshed');
        openTask(appState.selectedTaskId);
      }, 'Refreshing quotation');
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/\s+/g, '_');
    }

    function escapeAttrValue(value) {
      return escapeHtml(value);
    }

    function escapeHref(value) {
      return escapeHtml(value);
    }

    function isImageUrl(value) {
      return /\.(png|jpe?g|gif|webp)(\?|#|$)/i.test(String(value || ''));
    }

    bindEvents();
    init();
  </script>
</body>
</html>
